# Prioritized finding — key insight from research readout
# Emitted by: research_readout
# Consumed by: targeted_readouts, github_issues_generator
#
# v2.0 (May 6, 2026): Cascade-aware deepening. Added supporting_themes,
#   supporting_nuggets, participant_coverage, affected_personas, barrier/question
#   linkage, representative_quote. Renamed finding_number→id.
#
# v3.0 (June 6, 2026): TRACEABLE ROLE-TRANSFORMATION
#   supporting_themes and supporting_nuggets are now REQUIRED.
#   Every finding must trace to upstream themes and nuggets.
#   This enables bidirectional queries: "which findings cite theme-01?"
type: object
required: [id, finding, severity, evidence_strength, supporting_themes, supporting_nuggets]
properties:
  id:
    type: string
    description: "Format: finding-01, finding-02, etc."
  finding:
    type: string
    description: "The insight statement"
  category:
    type: string
    nullable: true
    enum: [accessibility_barrier, mental_model_mismatch, navigation_failure, success_pattern, unexpected_pattern, other]
  severity:
    type: integer
    description: "1-4 severity scale"
  evidence_strength:
    type: string
    enum: [Strong, Moderate, Limited]
  supporting_themes:
    type: array
    items:
      type: string
    description: "REQUIRED: Validated theme IDs (theme-XX) that ground this finding. Every finding must trace to themes."
  supporting_theme_evidence_ids:
    type: array
    items:
      type: string
      format: uuid
    description: "Canonical evidence_construct public_ids (UUIDs) of themes supporting this finding. Required for canonical lineage."
  supporting_nuggets:
    type: array
    items:
      type: string
    description: "REQUIRED: Nugget IDs that provide evidence. Every finding must trace to raw observations."
  participant_coverage:
    type: string
    nullable: true
    description: "X of Y participants format"
  affected_personas:
    type: array
    nullable: true
    items:
      type: string
    description: "Persona IDs affected by this finding"
  validates_barrier:
    type: string
    nullable: true
    description: "Target barrier ID (TB-XXX) validated by this finding"
  refutes_barrier:
    type: string
    nullable: true
    description: "Target barrier ID (TB-XXX) refuted by this finding"
  addresses_question:
    type: string
    nullable: true
    description: "Research question ID (RQ-XXX) answered by this finding"
  unexpected:
    type: boolean
    nullable: true
    description: "True if not anticipated by upstream barriers"
  representative_quote:
    type: string
    nullable: true
    description: "Verbatim quote illustrating this finding"
  representative_quote_source:
    type: string
    nullable: true
    description: "PT-XXX who said the quote"
  recommendation:
    type: string
    nullable: true
    description: "Recommended action for this finding"
  recommended_owner:
    type: string
    nullable: true
    description: "Team or role responsible"
