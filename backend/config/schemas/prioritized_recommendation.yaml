# Prioritized recommendation — actionable next step from research readout
# Emitted by: research_readout
# Consumed by: targeted_readouts, github_issues_generator
#
# v2.0 (May 6, 2026): Cascade-aware deepening. Added addresses_findings,
#   expected_impact, implementation_notes, source_implications, addresses_barrier.
#
# v3.0 (June 6, 2026): TRACEABLE ROLE-TRANSFORMATION
#   addresses_findings is now REQUIRED.
#   Every recommendation must trace to upstream findings.
#   This enables bidirectional queries: "which recommendations address finding-01?"
type: object
required: [id, recommendation, priority, addresses_findings]
properties:
  id:
    type: string
    description: "Format: rec-01, rec-02, etc."
  recommendation:
    type: string
    description: "Specific action to take"
  rationale:
    type: string
    nullable: true
    description: "Why this recommendation matters"
  addresses_findings:
    type: array
    items:
      type: string
    description: "REQUIRED: Finding IDs (finding-XX) this addresses. Every recommendation must trace to findings."
  supporting_finding_evidence_ids:
    type: array
    items:
      type: string
      format: uuid
    description: "Canonical evidence_construct public_ids (UUIDs) of findings this addresses. Required for canonical lineage."
  priority:
    type: string
    enum: [P0, P1, P2, P3]
  effort_estimate:
    type: string
    nullable: true
    enum: [High, Medium, Low]
  expected_impact:
    type: string
    nullable: true
    description: "What changes if this is implemented"
  implementation_notes:
    type: string
    nullable: true
    description: "How to implement"
  addresses_barrier:
    type: string
    nullable: true
    description: "Target barrier ID (TB-XXX) this recommendation addresses"
  source_implications:
    type: array
    nullable: true
    description: "References persona_design_implication IDs if derived from personas"
    items:
      type: string
