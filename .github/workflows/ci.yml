name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qori_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: qori_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci --legacy-peer-deps

      - name: Type check
        working-directory: backend
        run: npm run typecheck

      - name: Check cascade registry freshness
        working-directory: backend
        run: |
          npm run build:cascade
          git diff --exit-code src/helpers/slack/ui/cascadeRegistry.generated.ts src/types/cascade.generated.ts || {
            echo "::error::Cascade registry is stale. Run 'npm run build:cascade' and commit the generated files."
            exit 1
          }

      - name: Run unit tests
        working-directory: backend
        run: npm test

      - name: Verify migrations
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_USER: qori_test
          DB_PASSWORD: test
          DB_NAME: qori_test
          DB_DIALECT: postgres
        run: |
          echo "Running migrations..."
          npx sequelize-cli db:migrate

          echo "Verifying migration state..."
          EXPECTED_COUNT=$(ls -1 src/database/migrations/*.js | wc -l | tr -d ' ')
          APPLIED_COUNT=$(node -e "
            const { Sequelize } = require('sequelize');
            const seq = new Sequelize({
              dialect: 'postgres',
              host: 'localhost',
              port: 5432,
              database: 'qori_test',
              username: 'qori_test',
              password: 'test',
              logging: false
            });
            seq.query('SELECT COUNT(*) as count FROM \"SequelizeMeta\"', { type: seq.QueryTypes.SELECT })
              .then(r => { console.log(r[0].count); seq.close(); })
              .catch(e => { console.error(e.message); process.exit(1); });
          ")

          echo "Migration count: $APPLIED_COUNT applied, $EXPECTED_COUNT expected"

          if [ "$APPLIED_COUNT" != "$EXPECTED_COUNT" ]; then
            echo "::error::Migration count mismatch! Applied: $APPLIED_COUNT, Expected: $EXPECTED_COUNT"
            echo "::error::This may indicate missing migrations or migrations that failed silently."
            exit 1
          fi

          echo "Migration state verified."

      - name: Verify schema matches models
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_USER: qori_test
          DB_PASSWORD: test
          DB_NAME: qori_test
          DB_DIALECT: postgres
        run: node scripts/validate-schema.js

      - name: Run integration tests
        working-directory: backend
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: '5432'
          TEST_DB_USER: qori_test
          TEST_DB_PASSWORD: test
          TEST_DB_NAME: qori_test
        run: npm run test:integration
