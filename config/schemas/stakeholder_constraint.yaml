# Stakeholder constraint — technical, policy, or resource limitation
# Emitted by: stakeholder_synthesis
# Consumed by: research_brief, design_opportunities, service_blueprint, research_readout
type: object
properties:
  type:
    type: string
    enum: [Technical, Policy, Resource]
  constraint:
    type: string
    description: "Specific constraint description with full context"
  impact:
    type: string
    description: "Quantified impact — include numbers, timelines, scope"
  source:
    type: string
    description: "SH-XXX with role context, e.g. 'SH-002 Engineering Lead, Mobile Team'"
  verbatim_quote:
    type: string
    nullable: true
    description: "Direct quote from stakeholder illustrating this constraint"
  related_pattern:
    type: string
    nullable: true
    description: "Broader system or organizational pattern this constraint is part of"
  research_implication:
    type: string
    nullable: true
    description: "What this means for study design — recruitment, task selection, protocol"
  implementation_implication:
    type: string
    nullable: true
    description: "What this means for the build — technical boundaries, timeline constraints"
