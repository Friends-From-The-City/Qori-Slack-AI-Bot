# Alignment gap — stated priority vs. actual behavior mismatch
# Emitted by: stakeholder_synthesis
# Consumed by: research_brief, research_readout
type: object
properties:
  id:
    type: string
    description: "gap-001, gap-002, etc."
  gap_description:
    type: string
    description: "Short description — 'Accessibility stated P1 but sprint-deprioritized'"
  stated_position:
    type: string
    description: "What stakeholders say — 'All stakeholders rate accessibility P1'"
  actual_behavior:
    type: string
    description: "What actually happens — 'when push comes to shove, accessibility fixes get bumped'"
  acknowledged_by:
    type: string
    nullable: true
    description: "SH-XXX who acknowledged the gap"
  verbatim_quote:
    type: string
    nullable: true
    description: "Direct quote revealing the gap"
  consequence:
    type: string
    nullable: true
    description: "What this gap produces — '9-month-old open issue on tab bar accessibility'"
  addressable_in_research:
    type: boolean
    nullable: true
    description: "Whether user research can help close this gap"
