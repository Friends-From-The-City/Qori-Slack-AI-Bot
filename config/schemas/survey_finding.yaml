# Survey finding — quantitative or thematic finding from survey synthesis
# Emitted by: survey_synthesis
# Consumed by: research_brief, research_plan
type: object
properties:
  id:
    type: string
    description: "finding-001, finding-002, etc."
  finding:
    type: string
    description: "The finding statement — '73% of Veterans abandoned tasks due to navigation'"
  metric_name:
    type: string
    nullable: true
    description: "Name of the metric — 'Task Abandonment Rate'"
  sample_size:
    type: integer
    nullable: true
    description: "Number of respondents"
  affected_segment:
    type: string
    nullable: true
    description: "Who this finding affects — 'older veterans (65+)' or 'AT users'"
  supporting_quotes:
    type: array
    items:
      type: string
    nullable: true
    description: "Verbatim respondent quotes supporting this finding"
  source_question:
    type: string
    nullable: true
    description: "Which survey question yielded this finding"
