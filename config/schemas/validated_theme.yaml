# Validated theme — cross-participant pattern from affinity analysis
# Emitted by: affinity_mapping
# Consumed by: journey_mapping, persona_generator, usability_issues,
#              jobs_to_be_done, design_opportunities, research_readout
type: object
properties:
  id:
    type: string
    pattern: "theme-{seq}"
    description: "Unique theme ID"
  label:
    type: string
    description: "Theme name"
  description:
    type: string
    nullable: true
    description: "What this theme captures — the pattern in plain language"
  evidence_count:
    type: integer
    description: "Number of supporting observations"
  participants:
    type: array
    items:
      type: string
    description: "Participant IDs who contributed evidence"
  representative_quotes:
    type: array
    items:
      type: object
      properties:
        quote:
          type: string
        participant:
          type: string
        context:
          type: string
          nullable: true
    nullable: true
    description: "Verbatim quotes that best illustrate this theme, with participant ID and context"
  confidence:
    type: string
    enum: [Strong, Moderate, Limited]
  confidence_rationale:
    type: string
    nullable: true
    description: "Why this confidence level — triangulation, sample coverage, contradictions"
  implications:
    type: string
    nullable: true
    description: "What this theme means for design, research, or implementation"
  nugget_refs:
    type: array
    items:
      type: string
    nullable: true
    description: "References to atomic_nuggets that support this theme"
