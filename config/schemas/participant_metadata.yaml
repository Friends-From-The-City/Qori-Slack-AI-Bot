# Participant metadata — demographics and context from a session
# Emitted by: session_summary
# Consumed by: persona_generator, research_readout
type: object
properties:
  participant_id:
    type: string
    pattern: "PT-###"
    description: "Participant ID"
  background:
    type: string
    description: "Military service, disability status, relevant experience"
  tech_setup:
    type: string
    description: "Device, OS, connectivity"
  accessibility:
    type: string
    nullable: true
    description: "Assistive technology or accessibility needs"
  app_usage:
    type: string
    nullable: true
    description: "Frequency, primary tasks"
  key_contribution:
    type: string
    description: "What this participant uniquely highlighted"
