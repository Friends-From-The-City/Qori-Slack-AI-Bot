# ═══════════════════════════════════════════════════════════
# IDENTITY
# ═══════════════════════════════════════════════════════════
id: journey_mapping
name: run_journey_mapping
label: 🧭 Journey Mapping
version: "v7.0"

description: >
  Turn raw user research into a clear, step-by-step journey map. Maps key stages of the
  user's experience — capturing actions, thoughts, emotions, opportunities, and ownership —
  to inform design, policy, and service improvements.
  v7.0: True v7.0 restructure — Handlebars frame renders masthead, methodology, appendixes,
  validity checklist, cascade provenance. LLM bounded to journey_body (summary + stages +
  actions + discussion). OUTPUT BOUNDARIES added. Metadata ruling applied.

author: Qori R&D
created: 2025-06-30
last_updated: 2026-08-04

# ═══════════════════════════════════════════════════════════
# CONFIGURATION
# ═══════════════════════════════════════════════════════════
input_type: slack_modal_form
input_processing: auto_file_discovery

# ═══════════════════════════════════════════════════════════
# INPUTS
# ═══════════════════════════════════════════════════════════
input_variables:
  - selected_study              # Study name from dropdown (REQUIRED)
  - include_research_plan       # Boolean from checkbox (OPTIONAL)
  - include_participant_notes   # Boolean from checkbox (OPTIONAL)
  - include_raw_transcripts     # Boolean from checkbox (OPTIONAL)
  - discovered_files            # Files found by auto-discovery (GENERATED)
  - combined_file_content       # Auto-combined content from selected files (GENERATED)
  - quality_assessment          # Initial quality score (GENERATED)

# ═══════════════════════════════════════════════════════════
# CASCADE CONTRACT
# ═══════════════════════════════════════════════════════════
consumes:
  - key: atomic_nugget_core
    source: session_summary
    required: true
    inject_as: reference
    description: "Nugget pool — primary input for journey stage identification"
  - key: atomic_nugget_detail
    source: session_summary
    required: true
    inject_as: reference
    description: "Rich context — verbatim quotes, behaviors, emotional state for stage characterization"
  - key: validated_themes
    source: affinity_mapping
    required: false
    inject_as: reference
    description: "Cross-participant themes — validates and groups journey patterns"
  - key: personas
    source: persona_generator
    required: false
    inject_as: reference
    description: "Persona archetypes — journeys can be persona-specific or aggregate"
  - key: target_barriers
    source: research_brief
    required: false
    inject_as: grounding
    description: "Hypothesized barriers — journey stages can validate when they manifest"
  - key: research_questions
    source: research_brief
    required: false
    inject_as: context
    description: "Questions journey map should help answer"

emits:
  - key: journey_stages
    pool: false
    pool_strategy: replace
    extraction_model: sonnet
    schema:
      type: array
      items:
        $ref: schemas/journey_stage.yaml
    extract_from: "ALL journey stage sections — extract EVERY stage as a separate array item"
  - key: journey_pain_points
    pool: false
    pool_strategy: replace
    extraction_model: sonnet
    schema:
      type: array
      items:
        $ref: schemas/journey_pain_point.yaml
    extract_from: "Pain points highlighted across stages, intervention opportunities"

# ═══════════════════════════════════════════════════════════
# AI GENERATION
# ═══════════════════════════════════════════════════════════
ai_generation_tasks:
  # File discovery and quality assessment
  - task_id: "file_discovery_summary"
    prompt: |
      As a research operations specialist, analyze the discovered files and quality:

      **Selected Study:** {{selected_study}}
      **Enhancement Options Selected:**
      - Research plan: {{include_research_plan}}
      - Participant notes: {{include_participant_notes}}
      - Raw transcripts: {{include_raw_transcripts}}

      **Discovered Files:** {{discovered_files}}
      **Total Content:** [Analyze character/word count of combined_file_content]

      Report on file coverage, content quality, enhancement impact, and analysis confidence for journey mapping.

  # Main journey mapping task
  - task_id: "journey_map_complete"
    prompt: |
      You are creating a journey map from research data.

      IMPORTANT: Generate the COMPLETE output following the format below. Do not stop early.

      ============================================================
      CRITICAL RULES - READ THEN GENERATE FULL OUTPUT
      ============================================================

      RULE 1: NO HALLUCINATION - EXTRACT ONLY
      You are an EXTRACTOR, not a GENERATOR. Every claim must come from the input data.
      - If you cannot find evidence for something, DO NOT INCLUDE IT
      - Never invent quotes, thoughts, or user statements
      - Never add generic filler content

      RULE 2: NO REAL PARTICIPANT NAMES
      - Use participant IDs (PT-001, PT-002, etc.) or "the participant"
      - NEVER use names like "John", "Sarah", "David Chen"
      - This applies everywhere: descriptions, quotes, all text

      RULE 3: VA GOVERNMENT CONTEXT ONLY
      This is a VA (Department of Veterans Affairs) research study.
      - Users are Veterans or VA staff
      - Teams are: Product, Engineering, Design, Content, Accessibility, Policy
      - NEVER mention: Marketing Team, Sales Team, Customer Success, Influencers, Social Media Marketing

      RULE 4: CITE YOUR SOURCES
      Every pain point, emotion, and insight MUST include:
      - Participant ID (e.g., PT-001)
      - Timestamp if available (e.g., 00:02:28)
      - Direct quote or paraphrase from data

      RULE 5: STAGE LABELS MUST BE CONSISTENT
      Define your stage labels ONCE at the beginning, then use EXACTLY those same labels throughout.
      Do not create different stages in different sections.

      RULE 6: NO GENERIC FILLER - BE SPECIFIC
      Every statement must be specific and actionable. If you find yourself writing generic filler, STOP and rewrite.

      GENERIC (DO NOT WRITE):
      ❌ "Success looks like: Clear navigation to view claim status accurately"
      ❌ "Opportunity: Enhance the visibility of the Edit button"
      ❌ "Opportunity: Streamline the process"

      SPECIFIC (WRITE LIKE THIS):
      ✅ "Success looks like: User finds claim status within 2 taps from home screen"
      ✅ "Opportunity: Move Edit button from overflow menu to inline with profile header"

      Ask yourself: "Could a developer implement this tomorrow?" If no, it's too vague.

      RULE 7: CITATION DIVERSITY - USE ALL PARTICIPANTS
      Your citations must represent ALL participants in the input data, not just one.

      If input contains PT-001, PT-002, PT-003:
      ❌ WRONG: Every citation is from PT-003
      ✅ RIGHT: Mix of PT-001, PT-002, PT-003 citations throughout

      If all your citations are from one participant, GO BACK and find supporting evidence from the others.

      RULE 8: VERIFY BEFORE SUBMITTING
      - No real participant names used
      - All pain points have citations
      - All emotions have supporting quotes
      - Stage labels consistent throughout
      - Opportunities are specific (not generic)
      - Owners are VA teams (not Marketing/Sales)

      ============================================================
      OUTPUT PROCESS
      ============================================================

      STEP 1: Generate ALL journey stages first (## 01 through ## 05 or 06).
      STEP 2: THEN build the Summary section from the stage findings.
      The "Critical issues" count for each stage in the Summary table
      MUST match the actual pain points listed under that stage.

      ============================================================
      INPUT DATA
      ============================================================

      **Study:** {{selected_study}}
      **Research Data:** {{combined_file_content}}
      **Quality Assessment:** {{ai_generated.file_discovery_summary}}

      {% if upstream_atomic_nugget_core %}
      ============================================================
      CASCADE-AWARE GENERATION
      ============================================================

      You have access to upstream nugget pool (atomic_nugget_core + atomic_nugget_detail),
      validated themes, personas, and target context (target_barriers, research_questions).

      1. **Build journey stages from nugget behavioral sequences.** Use
         atomic_nugget_detail.observed_behavior and task_context to identify discrete
         stages. Each stage's supporting_nuggets must list actual nugget IDs.

      2. **Cite evidence by nugget ID.** Pain points cite nugget-PT00X-XXX IDs.

      3. **Link stages to personas when available.** If personas exist, mark each stage
         with which persona(s) experience it: [for persona-01] or [for persona-01, persona-02].
         When personas have DIFFERENT experiences at a stage (e.g., accessibility persona
         hits different barriers than efficiency persona), describe both paths. Include
         persona IDs in linked_personas array for each stage. If the journey doesn't
         diverge by persona at a stage, mark [for both personas] or [for all personas].

      4. **Mark stage-barrier relationships.** When a stage validates a target_barrier,
         mark inline with [validates TB-XXX].

      5. **Mark stage-question relationships.** When a stage addresses a research_question,
         mark inline with [addresses RQ-XXX].

      6. **Ground in themes when available.** When a stage aligns with a validated_theme,
         reference the theme ID.

      7. **Use ONLY observations from upstream nuggets.** Do not invent journey stages
         not supported by evidence.

      8. **No fabrication of entities.** For suggested_owner and team references, use ONLY:
         - Teams explicitly named in upstream variables (stakeholder_constraints)
         - Generic role categories: Design, Engineering, Accessibility, Product, Content, Research
         Do NOT invent specific team names like "Policy Team", "Information Architecture Team",
         or "Innovation Lab". Use "Design team" not "UI/UX Design Team".

      ATOMIC NUGGETS — CORE:
      {{upstream_atomic_nugget_core}}

      ATOMIC NUGGETS — DETAIL:
      {{upstream_atomic_nugget_detail}}

      {% if upstream_validated_themes %}
      VALIDATED THEMES:
      {{upstream_validated_themes}}
      {% endif %}

      {% if upstream_personas %}
      PERSONAS:
      {{upstream_personas}}
      {% endif %}

      {% if upstream_target_barriers %}
      TARGET BARRIERS:
      {{upstream_target_barriers}}
      {% endif %}

      {% if upstream_research_questions %}
      RESEARCH QUESTIONS:
      {{upstream_research_questions}}
      {% endif %}

      {% endif %}

      ============================================================
      OUTPUT FORMAT — Summary + Stages + Actions + Discussion
      ============================================================

      The template handles the masthead, methodology, upstream context,
      validity checklist, related artifacts, and cascade provenance.
      Generate ONLY the sections below.

      ## Summary

      [2-3 sentence narrative synthesis of the journey. Reference: how many stages, where failures concentrate, what pattern emerges across stages. Ground every sentence in THIS study's data.]

      > [!IMPORTANT]
      > **Most critical journey moment:** [Identify the stage with the highest number of task-blocking pain points OR the stage that affects the most participants. Explain what happens and why it matters.]

      | Stage | Critical issues | Participants affected |{% if upstream_atomic_nugget_core %} Cascade |{% endif %}
      |-------|-----------------|----------------------|{% if upstream_atomic_nugget_core %}---------|{% endif %}
      | 01 — [Stage name] | [count] | [X of Y] |{% if upstream_atomic_nugget_core %} [validates TB-XXX] |{% endif %}
      | 02 — [Stage name] | [count] | [X of Y] |{% if upstream_atomic_nugget_core %} [validates TB-XXX] |{% endif %}
      | 03 — [Stage name] | [count] | [X of Y] |{% if upstream_atomic_nugget_core %} [validates TB-XXX] |{% endif %}
      | 04 — [Stage name] | [count] | [X of Y] |{% if upstream_atomic_nugget_core %} [validates TB-XXX] |{% endif %}
      | 05 — [Stage name] | [count] | [X of Y] |{% if upstream_atomic_nugget_core %} [validates TB-XXX] |{% endif %}

      ---

      ## 01 &nbsp;&nbsp; [Stage Title — Descriptive]

      [1-2 sentence description of what happens at this stage]

      **Touchpoints** — [What user interacts with — format: "[entry point] → [navigation step] → [outcome]"]

      **User emotion** — [Single word: Confused, Frustrated, Confident, Uncertain, etc.]

      > "[Verbatim quote from data]"
      > — PT-001, [timestamp]

      #### What goes wrong

      - [Specific issue] — PT-001, [timestamp]{% if upstream_atomic_nugget_core %} (nugget-PT001-XXX){% endif %}
      - [Specific issue] — PT-003, [timestamp]{% if upstream_atomic_nugget_core %} (nugget-PT003-XXX){% endif %}
      - [Specific issue] — PT-001, [timestamp]{% if upstream_atomic_nugget_core %} (nugget-PT001-XXX){% endif %}

      #### Success looks like

      [SPECIFIC measurable outcome — format: "[measurable user outcome within a stated timeframe]" NOT vague like "clear navigation."]

      #### Design opportunity

      [SPECIFIC implementable fix — format: "[specific technical remediation]" NOT vague like "improve accessibility."]

      **Suggested owner** — [Team name]

      {% if upstream_atomic_nugget_core %}
      **Supporting nuggets** — [nugget-PT001-XXX, nugget-PT002-XXX, ...]

      {% if upstream_personas %}**Personas at this stage** — [for persona-01: The Accessibility-Dependent Navigator, persona-02: The Task-Focused Efficiency Seeker] (or subset if stage diverges){% endif %}

      {% if upstream_validated_themes %}**Grounded in** — theme-XX: [Theme title]{% endif %}
      {% endif %}

      ---

      ## 02 &nbsp;&nbsp; [Stage Title]

      [Same format as Stage 01. Include description, touchpoints, emotion, quote, what goes wrong, success looks like, design opportunity, suggested owner.]

      ---

      [Continue for each stage. Typically 3-6 stages. Each follows the exact same format.]

      ---

      ## Recommended actions

      | Priority | Action | Stage | Owner | Effort |
      |:--------:|--------|-------|-------|:------:|
      | 1 | [Specific action] | 01 — [Stage name] | [Team] | [High/Medium/Low] |
      | 2 | [Specific action] | 04 — [Stage name] | [Team] | [High/Medium/Low] |
      | 3 | [Specific action] | 02 — [Stage name] | [Team] | [High/Medium/Low] |

      ---

      ## Discussion questions

      These questions emerged from the journey analysis and warrant team alignment before implementation.

      1. [Specific question about a finding that needs team input] — *[Team]*

      2. [Question about prioritization or implementation] — *[Team]*

      3. [Question about cross-team collaboration needed] — *[Team + Team]*

      ============================================================
      QUALITY CHECKS (do not include in output)
      ============================================================

      Before outputting, verify:
      - Every quote appears EXACTLY in source data
      - No real participant names used anywhere
      - Stage labels are consistent between Summary table and stage headings
      - Citations represent ALL participants, not just one
      - Opportunities are specific enough for a developer to implement
      - Owners are VA teams (Product, Engineering, Design, Content, Accessibility, Policy)
      - Summary stage overview counts match actual pain points per stage
      {% if upstream_atomic_nugget_core %}
      - Nugget IDs referenced in stage evidence match actual upstream IDs
      - Each stage has supporting_nuggets populated
      - Cascade markers ([validates TB-XXX], [addresses RQ-XXX]) present where applicable
      {% endif %}

      OUTPUT BOUNDARIES: Do not generate the document title, masthead,
      methodology section, upstream context appendix, related artifacts,
      validity checklist, cascade provenance, or footer. The template
      handles those sections. Start with ## Summary and end after
      ## Discussion questions.

# ═══════════════════════════════════════════════════════════
# OUTPUT
# ═══════════════════════════════════════════════════════════
output_template: |
  # Journey Map: {{selected_study}}

  **Study:** {{selected_study}} &nbsp; | &nbsp; **Researcher:** {{researcher_contact}} &nbsp; | &nbsp; **Date:** {{current_date}}

  ---

  {{ai_generated.journey_map_complete}}

  ---

  ## Methodology

  **Framework** — Experience journey mapping

  **Approach** — Stage-by-stage analysis of user actions, emotions, pain points, and opportunities derived from qualitative session data. Each stage's findings are grounded in verbatim quotes and observed behaviors. Pattern B traceability — citations are inline at each stage rather than aggregated separately.

  **Limitations** — Stage definitions are study-specific — different study contexts would surface different stage structures.

  ### References

  - Adaptive Path — Pioneers of journey mapping methodology
  - Nielsen Norman Group — Stage-based emotion mapping framework
  - Stickdorn, M. & Schneider, J. — *This Is Service Design Thinking* (2011)
  - Kalbach, J. — *Mapping Experiences* (O'Reilly, 2nd ed., 2020)

  {% if upstream_atomic_nugget_core %}
  ---

  <details>
  <summary><strong>Upstream context</strong></summary>

  This journey map was synthesized from:

  | Source | Used for |
  |--------|----------|
  | session_summary outputs | Nuggets across participants |
  {% if upstream_validated_themes %}| affinity_mapping | Theme grounding |{% endif %}
  {% if upstream_personas %}| persona_generator | Persona-specific journey paths |{% endif %}
  {% if upstream_target_barriers %}| research_brief | Target barriers, research questions |{% endif %}

  Citation markers throughout:
  - [validates TB-XXX] = target barrier manifesting at this stage
  - [addresses RQ-XXX] = research question this stage helps answer
  - nugget-PT00X-XXX = source nugget reference
  - theme-XX = source theme reference
  - persona-XX = persona whose journey includes this stage

  </details>
  {% endif %}

  {{#if detected_files}}
  <details>
  <summary><strong>Related artifacts</strong></summary>

  | Artifact | Location |
  |----------|----------|
  {{#each file_list}}
  | {{this}} | ../{{this}} |
  {{/each}}

  </details>
  {{/if}}

  <details>
  <summary><strong>Validity checklist</strong></summary>

  | Check | Result |
  |-------|--------|
  | All quotes verbatim from session data | |
  | No real participant names used | |
  | Stage labels consistent throughout document | |
  | Citations represent all participants in study | |
  | Opportunities are specific and implementable | |
  | Owners are concrete teams (not vague roles) | |

  </details>

  ---

  <details>
  <summary><strong>Research provenance</strong></summary>

  {% if upstream_atomic_nugget_core %}
  | Source data | Detail |
  |------------|--------|
  | Nugget pool | atomic_nugget_core + atomic_nugget_detail from session_summary |
  {% if upstream_validated_themes %}| Themes | validated_themes from affinity_mapping |{% endif %}
  {% if upstream_personas %}| Personas | personas from persona_generator |{% endif %}
  {% if upstream_target_barriers %}| Barriers | target_barriers from research_brief |{% endif %}
  {% if upstream_research_questions %}| Questions | research_questions from research_brief |{% endif %}

  | Emitted variable | Description |
  |-------------------|-------------|
  | journey_stages | Stage-by-stage breakdown with actions, emotions, pain points |
  | journey_pain_points | Cross-stage pain points with severity and ownership |
  {% else %}
  No upstream cascade variables — journey map generated from file content only.
  {% endif %}

  </details>

output_options:
  path: "04-synthesis/"
  filename: "{{selected_study}}--journey-map--{{__derivation_fp}}.md"

