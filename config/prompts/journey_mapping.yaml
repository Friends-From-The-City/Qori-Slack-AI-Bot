# ═══════════════════════════════════════════════════════════
# IDENTITY
# ═══════════════════════════════════════════════════════════
id: journey_mapping
name: run_journey_mapping
label: 🧭 Journey Mapping
version: "v3.12"

description: >
  Turn raw user research into a clear, step-by-step journey map. Maps key stages of the
  user's experience — capturing actions, thoughts, emotions, opportunities, and ownership —
  to inform design, policy, and service improvements.

author: Qori R&D
created: 2025-06-30
last_updated: 2026-04-30

# ═══════════════════════════════════════════════════════════
# CONFIGURATION
# ═══════════════════════════════════════════════════════════
input_type: slack_modal_form
input_processing: auto_file_discovery

# ═══════════════════════════════════════════════════════════
# INPUTS
# ═══════════════════════════════════════════════════════════
input_variables:
  - selected_study              # Study name from dropdown (REQUIRED)
  - include_research_plan       # Boolean from checkbox (OPTIONAL)
  - include_participant_notes   # Boolean from checkbox (OPTIONAL)
  - include_raw_transcripts     # Boolean from checkbox (OPTIONAL)
  - discovered_files            # Files found by auto-discovery (GENERATED)
  - combined_file_content       # Auto-combined content from selected files (GENERATED)
  - quality_assessment          # Initial quality score (GENERATED)

# ═══════════════════════════════════════════════════════════
# AI GENERATION
# ═══════════════════════════════════════════════════════════
ai_generation_tasks:
  # File discovery and quality assessment
  - task_id: "file_discovery_summary"
    prompt: |
      As a research operations specialist, analyze the discovered files and quality:

      **Selected Study:** {{selected_study}}
      **Enhancement Options Selected:**
      - Research plan: {{include_research_plan}}
      - Participant notes: {{include_participant_notes}}
      - Raw transcripts: {{include_raw_transcripts}}

      **Discovered Files:** {{discovered_files}}
      **Total Content:** [Analyze character/word count of combined_file_content]

      Report on file coverage, content quality, enhancement impact, and analysis confidence for journey mapping.

  # Main journey mapping task
  - task_id: "journey_map_complete"
    prompt: |
      You are creating a journey map from research data.

      IMPORTANT: Generate the COMPLETE output following the format below. Do not stop early.

      ============================================================
      CRITICAL RULES - READ THEN GENERATE FULL OUTPUT
      ============================================================

      RULE 1: NO HALLUCINATION - EXTRACT ONLY
      You are an EXTRACTOR, not a GENERATOR. Every claim must come from the input data.
      - If you cannot find evidence for something, DO NOT INCLUDE IT
      - Never invent quotes, thoughts, or user statements
      - Never add generic filler content

      RULE 2: NO REAL PARTICIPANT NAMES
      - Use participant IDs (PT-001, PT-002, etc.) or "the participant"
      - NEVER use names like "John", "Sarah", "David Chen"
      - This applies everywhere: descriptions, quotes, all text

      RULE 3: VA GOVERNMENT CONTEXT ONLY
      This is a VA (Department of Veterans Affairs) research study.
      - Users are Veterans or VA staff
      - Teams are: Product, Engineering, Design, Content, Accessibility, Policy
      - NEVER mention: Marketing Team, Sales Team, Customer Success, Influencers, Social Media Marketing

      RULE 4: CITE YOUR SOURCES
      Every pain point, emotion, and insight MUST include:
      - Participant ID (e.g., PT-001)
      - Timestamp if available (e.g., 00:02:28)
      - Direct quote or paraphrase from data

      RULE 5: STAGE LABELS MUST BE CONSISTENT
      Define your stage labels ONCE at the beginning, then use EXACTLY those same labels throughout.
      Do not create different stages in different sections.

      RULE 6: NO GENERIC FILLER - BE SPECIFIC
      Every statement must be specific and actionable. If you find yourself writing generic filler, STOP and rewrite.

      GENERIC (DO NOT WRITE):
      ❌ "Success looks like: Clear navigation to view claim status accurately"
      ❌ "Opportunity: Enhance the visibility of the Edit button"
      ❌ "Opportunity: Streamline the process"

      SPECIFIC (WRITE LIKE THIS):
      ✅ "Success looks like: User finds claim status within 2 taps from home screen"
      ✅ "Opportunity: Move Edit button from overflow menu to inline with profile header"

      Ask yourself: "Could a developer implement this tomorrow?" If no, it's too vague.

      RULE 7: CITATION DIVERSITY - USE ALL PARTICIPANTS
      Your citations must represent ALL participants in the input data, not just one.

      If input contains PT-001, PT-002, PT-003:
      ❌ WRONG: Every citation is from PT-003
      ✅ RIGHT: Mix of PT-001, PT-002, PT-003 citations throughout

      If all your citations are from one participant, GO BACK and find supporting evidence from the others.

      RULE 8: VERIFY BEFORE SUBMITTING
      - No real participant names used
      - All pain points have citations
      - All emotions have supporting quotes
      - Stage labels consistent throughout
      - Opportunities are specific (not generic)
      - Owners are VA teams (not Marketing/Sales)

      ============================================================
      OUTPUT PROCESS
      ============================================================

      STEP 1: Generate ALL journey stages first (## 01 through ## 05 or 06).
      STEP 2: THEN build the Summary section from the stage findings.
      The "Critical issues" count for each stage in the Summary table
      MUST match the actual pain points listed under that stage.

      ============================================================
      INPUT DATA
      ============================================================

      **Study:** {{selected_study}}
      **Focus Area:** {{focus_area}}
      **Research Data:** {{combined_file_content}}
      **Quality Assessment:** {{ai_generated.file_discovery_summary}}

      ============================================================
      OUTPUT FORMAT
      ============================================================

      # Journey Map: [DESCRIPTIVE TITLE — infer from the research data, e.g., "VA Mobile App Navigation" or "Benefits Claims Processing". If a descriptive title cannot be confidently inferred from the data, use the study slug.]

      **Study:** {{selected_study}} &nbsp; | &nbsp; **Researcher:** {{researcher_contact}} &nbsp; | &nbsp; **Date:** {{current_date}}

      ---

      ## Summary

      [2-3 sentence narrative synthesis of the journey. Reference: how many stages, where failures concentrate, what pattern emerges across stages. Ground every sentence in THIS study's data.]

      > [!IMPORTANT]
      > **Most critical journey moment:** [Identify the stage with the highest number of task-blocking pain points OR the stage that affects the most participants. Explain what happens and why it matters.]

      | Stage | Critical issues | Participants affected |
      |-------|-----------------|----------------------|
      | 01 — [Stage name] | [count] | [X of Y] |
      | 02 — [Stage name] | [count] | [X of Y] |
      | 03 — [Stage name] | [count] | [X of Y] |
      | 04 — [Stage name] | [count] | [X of Y] |
      | 05 — [Stage name] | [count] | [X of Y] |

      ---

      ## 01 &nbsp;&nbsp; [Stage Title — Descriptive]

      [1-2 sentence description of what happens at this stage]

      **Touchpoints** — [What user interacts with — e.g., "Home screen → Bottom navigation tabs → Section discovery"]

      **User emotion** — [Single word: Confused, Frustrated, Confident, Uncertain, etc.]

      > "[Verbatim quote from data]"
      > — PT-001, [timestamp]

      #### What goes wrong

      - [Specific issue] — PT-001, [timestamp]
      - [Specific issue] — PT-003, [timestamp]
      - [Specific issue] — PT-001, [timestamp]

      #### Success looks like

      [SPECIFIC measurable outcome — e.g., "Users discover all available app sections within 30 seconds of opening the app, regardless of accessibility settings." NOT vague like "clear navigation."]

      #### Design opportunity

      [SPECIFIC implementable fix — e.g., "Modify VoiceOver focus behavior to start on the tab bar, and implement responsive navigation labels that remain visible at 180% text scaling." NOT vague like "improve accessibility."]

      **Suggested owner** — [Team name]

      ---

      ## 02 &nbsp;&nbsp; [Stage Title]

      [Same format as Stage 01. Include description, touchpoints, emotion, quote, what goes wrong, success looks like, design opportunity, suggested owner.]

      ---

      [Continue for each stage. Typically 3-6 stages. Each follows the exact same format.]

      ---

      ## Recommended actions

      | Priority | Action | Stage | Owner | Effort |
      |:--------:|--------|-------|-------|:------:|
      | 1 | [Specific action] | 01 — [Stage name] | [Team] | [High/Medium/Low] |
      | 2 | [Specific action] | 04 — [Stage name] | [Team] | [High/Medium/Low] |
      | 3 | [Specific action] | 02 — [Stage name] | [Team] | [High/Medium/Low] |

      ---

      ## Discussion questions

      These questions emerged from the journey analysis and warrant team alignment before implementation.

      1. [Specific question about a finding that needs team input] — *[Team]*

      2. [Question about prioritization or implementation] — *[Team]*

      3. [Question about cross-team collaboration needed] — *[Team + Team]*

      ---

      ## Methodology

      **Framework** — Experience journey mapping

      **Approach** — Stage-by-stage analysis of user actions, emotions, pain points, and opportunities derived from qualitative session data. Each stage's findings are grounded in verbatim quotes and observed behaviors. Pattern B traceability — citations are inline at each stage rather than aggregated separately.

      **Data sources** — [List participant IDs: PT-001, PT-002, PT-003]

      **Limitations** — [Number] participants. [Note any sample composition bias]. Stage definitions are study-specific — different study contexts would surface different stage structures.

      ### References

      - Adaptive Path — Pioneers of journey mapping methodology
      - Nielsen Norman Group — Stage-based emotion mapping framework
      - Stickdorn, M. & Schneider, J. — *This Is Service Design Thinking* (2011)
      - Kalbach, J. — *Mapping Experiences* (O'Reilly, 2nd ed., 2020)

      ---

      ## Appendix

      <details>
      <summary><strong>Related artifacts</strong></summary>

      RELATED ARTIFACTS:
      Populate this table with artifacts from {{detected_files}} when available.
      Use exact paths from the detected files list. Prepend ../ to each path.
      If a file isn't in the list, omit the row. Do NOT invent files.

      | Artifact | Location | Status |
      |----------|----------|--------|
      | [Per-participant session summary] | [path from detected_files](../path) | Complete |
      | [Analysis artifacts if present] | [path](../path) | Complete |

      </details>

      <details>
      <summary><strong>Validity checklist</strong></summary>

      | Criterion | Verified |
      |-----------|:--------:|
      | All quotes verbatim from session data | ✓ |
      | No real participant names used | ✓ |
      | Stage labels consistent throughout document | ✓ |
      | Citations represent all participants in study | ✓ |
      | Opportunities are specific and implementable | ✓ |
      | Owners are concrete teams (not vague roles) | ✓ |

      </details>

      ============================================================
      QUALITY CHECKS (do not include in output)
      ============================================================

      Before outputting, verify:
      - Every quote appears EXACTLY in source data
      - No real participant names used anywhere
      - Stage labels are consistent between Summary table and stage headings
      - Citations represent ALL participants, not just one
      - Opportunities are specific enough for a developer to implement
      - Owners are VA teams (Product, Engineering, Design, Content, Accessibility, Policy)
      - Summary stage overview counts match actual pain points per stage

      Do NOT output a footer or "Generated by Qori" line — that is added automatically.

# ═══════════════════════════════════════════════════════════
# OUTPUT
# ═══════════════════════════════════════════════════════════
output_template: |
  {{ai_generated.journey_map_complete}}

output_options:
  path: "04-analysis/journey-mapping/"
  filename: "{{selected_study}}-journey-map-{{current_date_iso}}.md"

# ═══════════════════════════════════════════════════════════
# METADATA (documentation only — not read by backend)
# ═══════════════════════════════════════════════════════════
processing_workflow:
  1. validate_slack_modal_inputs
  2. discover_files_from_study_selection
  3. combine_selected_files_with_truncation
  4. execute_file_discovery_summary
  5. execute_journey_map_complete
  6. format_output
  7. save_to_analysis_folder

auto_variables:
  - stage_count: extract_stage_count(ai_generated.journey_map_complete) || 5
  - current_date: new Date().toISOString().split('T')[0]

notify:
  - role: team
    action: "Journey mapping completed"
    channel: "{{study_channel}}"
    message: "Journey mapping for {{selected_study}} complete. {{stage_count}} stages mapped."

quality_assurance:
  require_citations: true
  require_participant_ids_only: true
  require_va_context: true
  prohibit_generic_opportunities: true
  prohibit_invented_quotes: true
  require_stage_consistency: true

notes: |
  v3.12 Changes (Design Language Translation):
