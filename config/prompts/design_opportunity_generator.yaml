  - Removed github_file_template (identical passthrough, redundant)
  - Removed default_delivery, slack_format, file_format from output_options (dead config)
  - Updated prompt: summary blockquote reordered to metrics first (no date)
  - Removed decorative emoji from Methodology heading (was 📚)
  - Unwrapped Methodology from <details> toggle — should be visible, not collapsed
  - Standardized participant ID format to PT-001 (hyphenated)
  - Changed filename from {{study_folder}} to {{selected_study}} (matches actual variable)
  - Added inline comments on input_variables

  v2.3 Changes:
  - HMW formula with verb/user/situation/outcome structure
  - Scope and priority assessment per opportunity
  - VA context enforcement
  - Anti-hallucination rules

  v2.0: Original implementation

output_use: |
  Generate How Might We opportunity statements from research data.
  Each opportunity traces directly to user evidence with quotes and
  participant citations. Includes prioritization and design direction.
