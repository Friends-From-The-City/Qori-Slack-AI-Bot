# ═══════════════════════════════════════════════════════════
# IDENTITY
# ═══════════════════════════════════════════════════════════
id: stakeholder_synthesis
name: synthesize_stakeholder_interviews
label: "Stakeholder Synthesis"
version: "v7.1"

description: |
  Synthesize internal stakeholder interviews into findings-grade
  documentation with role-only attribution. v7.0: Interleaved
  Handlebars/AI architecture — mechanical content (masthead,
  headings, methodology, appendix structure) rendered by template,
  LLM writes bounded analytical sections. Per ADR 0005/0016.

author: Qori R&D
created: 2026-01-08
last_updated: 2026-08-04

# ═══════════════════════════════════════════════════════════
# CONFIGURATION
# ═══════════════════════════════════════════════════════════
input_type: slack_modal_form
input_processing: direct
discovery_scope: true

# ═══════════════════════════════════════════════════════════
# INPUTS
# ═══════════════════════════════════════════════════════════
input_variables:
  - name: topic
    type: string
    required: true
    description: "Researcher-provided topic"
  - name: selected_study
    type: string
    required: true
  - name: study_name
    type: string
    required: true
  - name: study_channel
    type: string
    required: true
  - name: researcher_contact
    type: string
    required: true
  - name: combined_file_content
    type: string
    required: true
    description: "Combined content of all selected stakeholder files"
  - name: project_problem_statement
    type: string
    required: false
    description: "Project-level research problem. Stakeholder insights are framed against this."
  - name: source_intent
    type: string
    required: true
    description: "What the researcher needs this source to tell them — how it relates to the project problem."

# ═══════════════════════════════════════════════════════════
# CASCADE CONTRACT
# ═══════════════════════════════════════════════════════════
consumes:
  - key: discovered_barriers
    source: desk_research
    required: false
    inject_as: reference
    description: "Earlier discovery findings — stakeholder synthesis builds on desk research"
  - key: knowledge_gaps
    source: desk_research
    required: false
    inject_as: reference
    description: "Knowledge gaps from desk research that stakeholder interviews should address"

emits:
  - key: stakeholder_constraints
    pool: false
    pool_strategy: replace
    extraction_model: sonnet
    schema:
      type: array
      items:
        $ref: schemas/stakeholder_constraint.yaml
    extract_from: "Constraints section (## 01) table and surrounding quotes. Assign sequential IDs (constraint-001). Include type, impact, source SH-XXX, source_role, source_team, verbatim_quote, broader_pattern, research_implication, implementation_implication."

  - key: stakeholder_priorities
    pool: false
    pool_strategy: replace
    extraction_model: sonnet
    schema:
      type: array
      items:
        $ref: schemas/stakeholder_priority.yaml
    extract_from: "Strategic priorities and alignment section (## 02) table. Assign sequential IDs (priority-001). stated_by as array of SH-XXX. Map alignment marks."

  - key: alignment_gaps
    pool: false
    pool_strategy: replace
    extraction_model: sonnet
    schema:
      type: array
      items:
        $ref: schemas/alignment_gap.yaml
    extract_from: "Alignment gap WARNING callout (## 02) and Believe/Reality table (## 04). Assign sequential IDs (gap-001). Include stated_position vs actual_behavior, verbatim_quote, consequence, addressable_in_research."

  - key: stakeholder_questions_for_users
    pool: false
    pool_strategy: replace
    extraction_model: sonnet
    schema:
      type: array
      items:
        $ref: schemas/stakeholder_question.yaml
    extract_from: "Questions for user research section (## 05) — Blocking, Important, and Validation tables. Assign sequential IDs (question-001). Map priority from section heading. Include asked_by, stakeholder_insight, suggested_method."

  - key: backstage_observations
    pool: false
    pool_strategy: replace
    schema:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
          title:
            type: string
          pattern_type:
            type: string
            enum: [working, broken, organizational, resource]
          observation:
            type: string
          verbatim_quote:
            type: string
            nullable: true
          flow_description:
            type: string
            nullable: true
          source:
            type: string
    extract_from: "System and process observations appendix. Assign sequential IDs (obs-001). Include full observation, verbatim quote, flow description, source SH-XXX."

  - key: system_failure_modes
    pool: false
    pool_strategy: replace
    schema:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
          flow_name:
            type: string
          where_it_breaks:
            type: string
          consequence:
            type: string
          source:
            type: string
          verbatim_quote:
            type: string
            nullable: true
    extract_from: "Stakeholder alignment section (## 03) — identify system/process failure points from stakeholder constraints and conflicts. Assign sequential IDs (failure-001). Include source SH-XXX, verbatim quote."

# ═══════════════════════════════════════════════════════════
# AI GENERATION — focused, bounded tasks
# ═══════════════════════════════════════════════════════════
ai_generation_tasks:

  # Main analytical body — sections 01-07 plus summary and stakeholder table.
  # Kept as one task to preserve cross-section coherence (SH-XXX IDs flow
  # across constraints → priorities → questions).
  - task_id: "analysis_body"
    prompt: |
      You are synthesizing internal stakeholder interviews into analytical sections.

      ============================================================
      CRITICAL RULES
      ============================================================

      RULE 1: ROLE-ONLY ATTRIBUTION (NON-NEGOTIABLE)

      NEVER use real names. Map each stakeholder to a role identifier:
      - SH-001 = Role/title (e.g., "Product Owner")
      - SH-002 = Role/title (e.g., "Engineering Lead")

      Quote format: > "quote" > — SH-XXX
      Multiple sources: SH-001 · SH-003 (middle-dot separator)

      If a role would identify someone (only one Director of X), use a
      more generic label.

      RULE 2: NO HALLUCINATION — You are an EXTRACTOR, not a GENERATOR.
      Every constraint, quote, priority must come from the interview data.
      If you can't find evidence, DON'T INCLUDE IT.

      RULE 3: CONFIDENCE PER SECTION — Every numbered section ends with:
      **Confidence** — [Strong/Moderate/Limited] ([reasoning])

      Stakeholder interpretation rubric:
      - Strong: Multiple stakeholders independently surfaced the same claim
        AND verifiable against external evidence
      - Moderate: Single source OR partial triangulation
      - Limited: Unverified single perspective

      RULE 4: ALIGNMENT TABLE in section 03. Render stakeholder alignment as a
      table with columns: Stakeholder | Priorities | Constraints | Conflicts With.
      Use ✓/⚠/✗ marks to show alignment/misalignment.

      RULE 5: NO METADATA FABRICATION — For interview durations, dates, metrics,
      use ONLY data explicitly stated. Write "Not specified" when unknown.

      {% if upstream_discovered_barriers %}
      ============================================================
      CASCADE-AWARE GENERATION
      ============================================================

      Prior discovery findings available. Your job:
      1. Build on prior discovery: [builds on DB-XXX] or [contradicts DB-XXX]
      2. Address knowledge gaps: [fills KG-XXX]
      3. Use stable IDs (constraint-001, etc.)
      4. No fabrication of entities — use ONLY what stakeholders mentioned

      DISCOVERED BARRIERS:
      {{upstream_discovered_barriers}}

      {% if upstream_knowledge_gaps %}
      KNOWLEDGE GAPS:
      {{upstream_knowledge_gaps}}
      {% endif %}
      {% endif %}

      ============================================================
      INPUT DATA
      ============================================================

      **Study:** {{study_name}}

      **Stakeholder Interview Data:**

      {{combined_file_content}}

      ============================================================
      GENERATE THESE SECTIONS
      ============================================================

      Output ALL sections below as continuous markdown. Do not stop early.

      **STAKEHOLDER TABLE:**

      | ID | Role | Team | Focus area |
      |----|------|------|------------|
      | SH-001 | [Role — NOT real name] | [Team] | [Topics] |
      [continue for each stakeholder]

      **SUMMARY:** 2-3 sentence narrative + metadata table:
      | | |
      |---|---|
      | **Stakeholders interviewed** | [count] |
      | **Teams represented** | [list] |
      | **Key tension** | [single most important tension] |

      Then: > [!IMPORTANT] > **Most actionable insight:** [consequential cross-stakeholder pattern]

      **SECTION 01 — CONSTRAINTS:** Opening quote + constraint table (Type | Constraint | Impact | Source) + Confidence

      **SECTION 02 — STRATEGIC PRIORITIES AND ALIGNMENT:** Priority table (Priority | Stated by | Aligns with user need? | Notes) using ✓/⚠/✗ marks + WARNING callout for alignment gap + Confidence

      **SECTION 03 — STAKEHOLDER ALIGNMENT:** 1-2 sentence frame + alignment table:

      | Stakeholder | Priorities | Constraints | Conflicts With |
      |-------------|------------|-------------|----------------|
      | SH-XXX | [Top priorities] | [Key constraints] | [SH-XXX on what issue] |

      Use ✓/⚠/✗ marks where helpful. Identify key alignment gaps. + Confidence

      **SECTION 04 — STAKEHOLDERS BELIEVE / REALITY / OPPORTUNITY:** Table (Believe | Reality | Opportunity) + Confidence

      **SECTION 05 — QUESTIONS FOR USER RESEARCH:** Three sub-sections: Blocking (table), Important (table), Validation (bullet list)

      **SECTION 06 — OPEN QUESTIONS:** Table (Question | Who might know | Why it matters)

      **SECTION 07 — RECOMMENDATIONS:** Three sub-sections: Immediate (table), Near-term (table), Strategic (table). Each: Action | Constraint addressed | Owner

      OUTPUT BOUNDARIES: Do not generate the document title, masthead,
      methodology section, appendix, validity checklist, references, or
      cascade summary. The template handles those sections.
      USE ## headings for each section (e.g., ## 01 &nbsp;&nbsp; Constraints).
      Output the analytical content with proper markdown heading hierarchy,
      separated by --- dividers between sections.

  # Appendix observations — raw system/process observations for downstream
  # service blueprint. Preservation, not synthesis.
  - task_id: "appendix_observations"
    prompt: |
      Extract 3-5 system or process observations from stakeholder interviews.
      These are RAW INPUTS for downstream service blueprint synthesis.

      RULES:
      - Use SH-XXX attribution only (no real names)
      - Do NOT synthesize or draw conclusions — preserve raw observations
      - Each observation: descriptive title, stakeholder quote, system flow
        in plain prose, pattern label

      **Interview Data:**

      {{combined_file_content}}

      For each observation output:

      #### [Observation title (pattern type)]

      > "[Stakeholder quote]" — SH-XXX

      [System flow description in plain prose.]

      [Pattern label: Working pattern / Broken pattern / Organizational pattern / Resource pattern]

      OUTPUT BOUNDARIES: Do not generate section headings, the details/summary
      wrapper, or any structural HTML. The template handles structure.
      Output only the observation entries.

# ═══════════════════════════════════════════════════════════
# OUTPUT — interleaved Handlebars + AI prose
# ═══════════════════════════════════════════════════════════
output_template: |
  # Stakeholder Synthesis: {{study_name}}

  **Study:** {{selected_study}} &nbsp; | &nbsp; **Researcher:** {{researcher_contact}} &nbsp; | &nbsp; **Date:** {{current_date}} &nbsp; | &nbsp; **Status:** Draft

  ---

  {{#if project_problem_statement}}
  **Research problem:** {{project_problem_statement}}

  **This document contributes:** {{source_intent}}
  {{else}}
  > [!WARNING]
  > No project problem statement set. Stakeholder insights cannot be fully contextualized.
  > Run `/qori-start` to set one.
  {{/if}}

  ---

  ## Stakeholders interviewed

  {{ai_generated.analysis_body}}

  ---

  <details>
  <summary><strong>Methodology</strong></summary>

  **Framework** — Stakeholder research synthesis for service design

  **Approach** — Aggregated {{document_count}} internal stakeholder interviews, organized by constraint type, priority alignment, and system dynamics. Cross-referenced insights across stakeholder perspectives to identify systemic patterns. Used role-only attribution to enable diplomatic surfacing of organizational tensions.

  **Synthesis methods** — Constraint triangulation; alignment gap analysis; system dynamics mapping with failure-mode identification; stakeholder belief vs. reality framing.

  ### References

  - Sam Ladner — *Mixed Methods* (stakeholder research framework)
  - Steve Portigal — *Interviewing Users* (stakeholder interview techniques)
  - Kim Goodwin — *Designing for the Digital Age* (stakeholder alignment)
  - Stickdorn & Schneider — *This Is Service Design Thinking* (systems mapping)

  </details>

  ---

  ## Appendix

  <details>
  <summary><strong>System and process observations (raw input for service blueprint)</strong></summary>

  These observations were captured for downstream service blueprint synthesis.
  They are preserved here in raw form rather than synthesized.

  {{ai_generated.appendix_observations}}

  </details>

  {{#if detected_files}}
  <details>
  <summary><strong>Related artifacts</strong></summary>

  | Artifact | Location |
  |----------|----------|
  {{#each file_list}}
  | {{this}} | ../{{this}} |
  {{/each}}

  </details>
  {{/if}}

  ---

  <details>
  <summary><strong>Research provenance</strong></summary>

  This stakeholder synthesis emits variables for downstream templates.

  | Variable | Description |
  |----------|-------------|
  | stakeholder_constraints | Technical, policy, resource, organizational limitations |
  | stakeholder_priorities | Strategic priorities with user-need alignment |
  | alignment_gaps | Stated priority vs. actual behavior mismatches |
  | stakeholder_questions_for_users | Prioritized research questions from stakeholder insights |
  | backstage_observations | Raw system/process observations for service blueprint |
  | system_failure_modes | System dynamics with failure points (from alignment conflicts) |

  **Stakeholders analyzed:** {{document_count}}

  </details>

output_options:
  path: "{{project_slug}}/00-discovery/"
  filename: "{{project_slug}}--stakeholder-synthesis--{{__derivation_fp}}.md"

  delivery:
    github:
      enabled: true
      commit_message: "Add stakeholder synthesis: {{study_name}}"

    slack:
      enabled: true
      channel: "{{study_channel}}"
      message: "{{researcher_contact}} completed stakeholder synthesis for {{study_name}}."

# ═══════════════════════════════════════════════════════════
# METADATA
# ═══════════════════════════════════════════════════════════
# NOTE: derived_variables removed — handler (discoverHandler.ts) computes
# topic_slug explicitly. yamlProcessor does not process derived_variables.

validation_rules:
  - rule: "role_only_attribution"
    description: "No real names — only SH-XXX identifiers"
    check: "no real names from input transcripts appear in output"
  - rule: "confidence_per_section"
    description: "Every numbered section has a Confidence line"
    check: "sections 01-07 each contain 'Confidence' indicator"
  - rule: "all_sections_present"
    description: "All required sections present"
    check: "output contains Constraints, Priorities, Stakeholder Alignment, Believe/Reality, Questions, Open questions, Recommendations"

notes: |
  v7.0: Interleaved Handlebars/AI architecture (ADR 0005/0016 pattern).
  - Monolithic synthesis_complete task split into 2 tasks:
    analysis_body (stakeholder table + sections 01-07 in one pass for
    cross-section coherence) and appendix_observations (raw preservation).
  - Handlebars renders: masthead, methodology (in toggle), validity
    checklist, references, appendix structure, related artifacts,
    declared inputs (static declaration table).
  - Anti-fabrication guards preserved (6 rules from v5.0).
  - OUTPUT BOUNDARIES rule added to both tasks.
  - derived_variables block removed (handler computes topic_slug).
  - Declared inputs section always renders (was conditional on upstream data).
  - Methodology section wrapped in details/summary toggle.

  v5.0-v5.0.1: Single-task architecture (superseded by v7.0).
  v4.0: Design language translation.
  v3.0-v3.3: Multi-task architecture.
