  v2.0: Added structured AI processing, participant tracker integration,
  accessibility observation section, key moments extraction.

output_use: |
  Quick session note-taking with AI-powered organization. Observer writes
  freeform notes during or after a session, and the AI structures them into
  categorized sections: quotes, emotions, tasks, technical issues, accessibility,
  key moments, and additional context.
