  - Removed dead config: llm_config, precision_mode
  - Removed duplicate github and filename top-level keys (redundant with output_options)
  - Changed footer from <sub> tag to italic line
  - Wrapped Session Metadata in output_template with <details> (supplementary data)
  - Removed decorative emoji from output_template field labels
  - Kept emoji in AI prompt output sections (🗣️, 😤, ✅, etc.) — these convey category within structured notes
