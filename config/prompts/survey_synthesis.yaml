# ═══════════════════════════════════════════════════════════
# IDENTITY
# ═══════════════════════════════════════════════════════════
id: survey_synthesis
name: survey_response_synthesizer
label: "Survey Synthesis"
version: "v10.0"

description: |
  Analyze survey data with deterministic structured evidence and bounded
  qualitative interpretation. When accepted qualitative coding exists,
  renders deterministic "What Respondents Described" section with
  researcher-reviewed groupings, governed quotes, and code-computed counts.
  v10.0: Slice 2B — accepted coding integration, deterministic qualitative
  section, redesigned Executive Summary, updated Method & Provenance.
  Per ADR 0005/0016/0028/0032.

author: Qori R&D
created: 2025-08-11
last_updated: 2026-08-16

# ═══════════════════════════════════════════════════════════
# CONFIGURATION
# ═══════════════════════════════════════════════════════════
input_type: slack_modal_form
input_processing: form_based
discovery_scope: true

# Survey v10.0 renders generation/model/provenance inside its own
# Method & Provenance details block. The shared footer is suppressed
# to avoid duplication and document-hierarchy disruption.
document:
  append_document_information: false

# ═══════════════════════════════════════════════════════════
# INPUTS
# ═══════════════════════════════════════════════════════════
input_variables:
  - name: topic
    type: text
    required: true
    description: "Researcher-provided topic"
  - name: selected_study
    type: select
    required: true
  - name: survey_name
    type: text
    required: true
    placeholder: "e.g., Post-launch satisfaction survey"
  - name: question_focus
    type: textarea
    required: false
    placeholder: "e.g., Q5: What was most frustrating? Q8: Any other feedback?"
  - name: combined_file_content
    type: textarea
    required: true
    description: "Extracted content from uploaded files (provided by backend)"
  - name: project_problem_statement
    type: text
    required: false
    description: "Project-level research problem. Knowledge gaps are derived against this."
  - name: source_intent
    type: textarea
    required: true
    description: "What the researcher needs this source to tell them — how it relates to the project problem."
  - name: computed_facts
    type: object
    required: false
    description: "Deterministic statistics computed from CSV data by code (ADR 0028). When present, all numeric claims must come from this object."
  - name: open_text_content
    type: textarea
    required: false
    description: "Open-text survey responses extracted from CSV, formatted with respondent labels for qualitative analysis."
  - name: qualitative_coding
    type: object
    required: false
    description: "Accepted qualitative coding data from Slice 2B: recurring patterns, individual observations, review metadata, privacy counts. When present, replaces Preliminary Qualitative Observations with deterministic What Respondents Described."
  - name: has_accepted_coding
    type: boolean
    required: false
    description: "Top-level boolean for task skip_when evaluation. True when an accepted coding run exists for the current evidence source. Derived from Postgres, not from artifact text or Slack state."

# ═══════════════════════════════════════════════════════════
# CASCADE CONTRACT — aligned with v9 authority model
# ═══════════════════════════════════════════════════════════
#
# AUDIT (v10.0):
# survey_themes:       NOT EMITTED — "themes" terminology retired (Slice 2B decision)
# survey_findings:     KEPT — model-derived interpretation (no new numbers)
# discovered_barriers: NOT EMITTED — not auto-emitted from qualitative patterns
# discovered_metrics:  NOT EMITTED — deterministic metrics in evidence layer
# sample_demographics: NOT EMITTED — no confirmed demographic fields
# knowledge_gaps:      KEPT — identifying evidence gaps is approved interpretive work

emits:
  - key: survey_findings
    pool: true
    pool_strategy: append
    schema:
      type: array
      items:
        $ref: schemas/survey_finding.yaml
    extract_from: "Integrated Interpretation or Structured Evidence sections. Assign sequential IDs (finding-001). metric_name and sample_size must come from Structured Evidence values only — do not invent or re-count. Include source_question where applicable."

  - key: knowledge_gaps
    pool: true
    pool_strategy: append
    schema:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
          gap:
            type: string
          why_matters:
            type: string
            nullable: true
          suggested_resolution:
            type: string
            nullable: true
          source_document:
            type: string
    extract_from: "Evidence Gaps section — questions the survey couldn't answer. Assign sequential IDs (gap-001). Include why the gap matters and suggested resolution."

# ═══════════════════════════════════════════════════════════
# AI GENERATION — two bounded tasks, no arithmetic
# ═══════════════════════════════════════════════════════════
ai_generation_tasks:

  # Task 1: Qualitative observations on open-text responses.
  # SKIPPED when accepted qualitative coding exists (Slice 2B).
  # When coding is accepted, the "What Respondents Described" section
  # renders deterministic counts and governed quotes from the template.
  # NO counting, NO frequencies, NO themes, NO sentiment distributions.
  # NO soft prevalence language.
  - task_id: "qualitative_observations"
    skip_when: "has_accepted_coding"
    skip_output: ""
    prompt: |
      You are interpreting open-text survey responses. Your output is
      PRELIMINARY qualitative observation — not formal thematic analysis,
      not coded data, not quantitative summary.

      ============================================================
      RULES
      ============================================================

      RULE 1 — NUMERIC AUTHORITY
      Never calculate, re-count, infer percentages, round values, or
      modify any supplied statistic. You have NO numeric authority.
      All numbers appear in the Structured Evidence section rendered
      by the template. Do not repeat, re-derive, or contradict them.

      RULE 2 — QUALITATIVE AUTHORITY (SLICE 1)
      Open-text interpretation is preliminary. You may:
        - Describe what respondents wrote about
        - Identify notable topics WITHOUT counting them
        - Quote respondents to illustrate observations
        - Note areas of convergence or tension across responses

      You must NOT:
        - Assign prevalence ("most respondents," "X of N," "60%")
        - Use ANY soft prevalence language, including but not limited to:
          "some respondents," "some participants," "some entries,"
          "at least some respondents," "at least some participants,"
          "for some respondents," "for at least some respondents,"
          "several respondents," "several participants,"
          "many respondents," "many participants,"
          "a recurring concern," "recurring pattern,"
          "with some respondents noting,"
          "commonly," "frequently," "often,"
          "a small number," "a majority," "most respondents,"
          "predominant," "widespread"
        - Use the word "theme" or "themes" to describe qualitative
          groupings. Before formal coding, use: "observation,"
          "preliminary grouping," "category," "type," or "topic."
          Reserve "theme/themes" for accepted coded analysis.
        - Claim themes (no "Theme 1," no "three themes emerged,"
          no "friction themes," no "distinct themes")
        - Perform sentiment classification or distribution
        - Produce frequency tables, sentiment tables, or coded counts

      RULE 3 — RESPONDENT TERMINOLOGY
      The reporting unit is the unique respondent. Never count text
      entries as respondents. If referring to volume, say
      "22 open-text entries across 11 respondents" NOT "22 responses."

      RULE 4 — RESPONDENT CITATIONS
      Every quote must include the respondent label exactly as provided
      in the input data: "[Direct quote]" — T001 (or whatever label
      appears in the data). Do NOT replace source labels with aliases.

      RULE 5 — EMPTY CONTENT
      If the survey data between BEGIN/END markers is empty or contains
      no text responses, respond ONLY with:
      > **No open-text responses provided.** Structured evidence is
      > available above. Re-run with open-text data for qualitative
      > interpretation.

      RULE 6 — QUESTION FOCUS
      {% if question_focus %}
      PRIORITIZE these questions: {{question_focus}}
      {% else %}
      Interpret ALL open-ended/text responses. Skip closed-ended data.
      {% endif %}

      ============================================================
      INPUT DATA
      ============================================================

      **Survey:** {{survey_name}}
      **Study:** {{selected_study}}

      **Open-text responses for qualitative interpretation:**
      ---BEGIN DATA---
      {% if open_text_content %}{{open_text_content}}{% else %}{{combined_file_content}}{% endif %}
      ---END DATA---

      ============================================================
      OUTPUT FORMAT
      ============================================================

      Write 3–7 observation groups. For each:

      ### [Descriptive label — what respondents wrote about]

      [1–3 sentences describing the observation. Use evidence-based
      language without prevalence:
      "Open-text entries describe..."
      "One observed issue involves..."
      "An illustrative account describes..."
      Never assign counts or percentages.]

      > "[Direct quote]" — [respondent label from data]
      > "[Direct quote]" — [respondent label from data]

      [Optional: 1 sentence on why this is notable relative to the
      survey purpose.]

      ---

      After all observation groups, add:

      > [!NOTE]
      > These observations are preliminary and illustrative. They have
      > not been formally coded or validated. Prevalence cannot be
      > inferred from the groupings above.

      OUTPUT BOUNDARIES: Do not generate the document title, section
      heading (## Preliminary Qualitative Observations), structured
      evidence, methodology, footer, or any other structural element.
      Output observation groups only.

  # Task 2: Evidence gaps — what the survey cannot answer
  - task_id: "evidence_gaps"
    skip_when: "not project_problem_statement"
    skip_output: |
      > **Evidence gaps require a project problem statement.**
      >
      > Run `/qori-start` to set a problem statement for this project, then re-run discovery.
    prompt: |
      Identify evidence gaps from the survey data.

      ============================================================
      CONTEXT
      ============================================================

      **Research Problem (from project):**
      {{project_problem_statement}}

      **Source Intent (what researcher needs from this source):**
      {{source_intent}}

      **Survey:** {{survey_name}}

      {% if computed_facts %}
      ============================================================
      AVAILABLE STRUCTURED EVIDENCE
      ============================================================

      The following ARE available from this survey:
      - {{computed_facts.totalRespondents}} unique respondents
      - Fields: {{computed_facts.schemaSummary}}
      - Field distributions (value counts for all categorical fields)
      - Ordinal medians (where researcher confirmed category order)
      - Completion status distribution
      - Cross-tabulations (completion × difficulty, completion × satisfaction)
      - Missingness counts

      The following are NOT available:
      {% if qualitative_coding and qualitative_coding.hasAcceptedCoding %}
      - (Accepted qualitative coding IS available — do not list as missing)
      {% else %}
      - Accepted qualitative-code prevalence (coding not performed)
      {% endif %}
      - Population prevalence or representativeness
      - Causal attribution (survey is descriptive only)
      - Inferential significance (not computed)

      Do NOT claim a structured result is missing if it appears in the
      list above.
      {% endif %}

      **Open-text responses:**
      ---BEGIN DATA---
      {% if open_text_content %}{{open_text_content}}{% else %}{{combined_file_content}}{% endif %}
      ---END DATA---

      ============================================================
      RULES
      ============================================================

      RULE 1 — NUMERIC AUTHORITY
      Never calculate, re-count, infer percentages, round values, or
      modify any supplied statistic.

      RULE 2 — GAP DEFINITION
      A knowledge gap is: A question that the stated research problem
      requires answering, which THIS SOURCE cannot answer.

      Do NOT include:
        - Questions the survey answers (partially or fully)
        - Questions unrelated to the stated problem
        - Generic research-practice observations
        - Product actions, feature changes, or design implementations
        - Structured distributions that ARE available (see above)

      RULE 3 — TERMINOLOGY
      Do not use "theme" or "themes" to describe qualitative groupings.
      Use: "observation types," "qualitative categories," "friction
      types," "preliminary groupings."

      ============================================================
      OUTPUT FORMAT
      ============================================================

      For each gap (3–5 maximum):

      ### Gap N: [Question the problem requires answering]

      | What this source establishes | Where it stops |
      |:-----------------------------|:---------------|
      | [Specific evidence from survey] | [Specific limitation] |

      > [!TIP]
      > **Suggested research approach:** [Method to investigate]

      ---

      OUTPUT BOUNDARIES: Do not generate section headings or structural
      elements beyond the per-gap format above.

# ═══════════════════════════════════════════════════════════
# OUTPUT — deterministic structure + bounded interpretation
# ═══════════════════════════════════════════════════════════
output_template: |
  # Survey Synthesis: {{survey_name}}

  ## Executive Summary

  {{#if computed_facts}}
  > [!IMPORTANT]
  > **{{computed_facts.totalRespondents}} unique respondents** analyzed.{{#each computed_facts.fieldStats}}{{#if this.median}} {{this.displayName}} median: **{{this.median}}**.{{/if}}{{/each}}
  {{#if qualitative_coding}}
  {{#if qualitative_coding.hasAcceptedCoding}}
  >
  > **Qualitative analysis complete.** {{qualitative_coding.eligibleRespondentCount}} respondents with eligible open-text entries.{{#each qualitative_coding.recurringPatterns}} **{{this.label}}** — {{this.displayFrequency}}.{{/each}}
  {{/if}}
  {{/if}}
  {{else}}
  > [!WARNING]
  > No computed facts available. This synthesis relies on qualitative interpretation only.
  {{/if}}

  ---

  ## Research Context

  {{#if project_problem_statement}}
  **Research problem:** {{project_problem_statement}}

  **This survey contributes:** {{source_intent}}
  {{else}}
  > [!WARNING]
  > No project problem statement set. Run `/qori-start` to set one.
  {{/if}}

  {{#if question_focus}}
  **Focus questions:** {{question_focus}}
  {{/if}}

  ---

  {{#if computed_facts}}
  <details>
  <summary><strong>View Structured Evidence</strong> — distributions, medians, and cross-tabulations</summary>

  *All values below are computed deterministically from source data.*

  {{#each computed_facts.fieldStats}}
  {{#if this.distribution}}

  ### {{this.displayName}}

  **Role:** {{this.role}} &nbsp; | &nbsp; **Present:** {{this.nPresent}} of {{../computed_facts.totalRespondents}} &nbsp; | &nbsp; **Missing:** {{this.nMissing}}{{#if this.median}} &nbsp; | &nbsp; **Median:** {{this.median}}{{/if}}

  {{this.distribution}}

  {{/if}}
  {{/each}}

  {{#if computed_facts.crossTabs}}

  ### Cross-Tabulations

  {{#each computed_facts.crossTabs}}

  **{{this.rowDisplayName}} × {{this.colDisplayName}}** (n={{this.totalN}})

  {{this.cells}}

  {{/each}}
  {{/if}}

  </details>

  {{/if}}

  ---

  {{#if qualitative_coding}}
  {{#if qualitative_coding.hasAcceptedCoding}}
  ## What Respondents Described

  *All counts below are computed deterministically from researcher-reviewed matches. The reporting unit is the unique respondent.*

  {{#if qualitative_coding.recurringPatterns}}
  ### Recurring Patterns

  {{#each qualitative_coding.recurringPatterns}}
  **{{this.label}}** — {{this.displayFrequency}}

  {{this.definition}}

  {{#if this.quotes}}
  {{this.quotes}}
  {{/if}}

  ---

  {{/each}}
  {{/if}}

  {{#if qualitative_coding.individualObservations}}
  ### Individual Observations

  {{#each qualitative_coding.individualObservations}}
  **{{this.label}}** — {{this.displayFrequency}}

  {{this.definition}}

  {{#if this.quotes}}
  {{this.quotes}}
  {{/if}}

  ---

  {{/each}}
  {{/if}}
  {{/if}}
  {{else}}
  ## Preliminary Qualitative Observations

  {{ai_generated.qualitative_observations}}

  ---

  {{/if}}

  ## Integrated Interpretation

  {{#if computed_facts}}
  The structured evidence above establishes the distributional baseline from {{computed_facts.totalRespondents}} unique respondents.
  {{#if qualitative_coding}}
  {{#if qualitative_coding.hasAcceptedCoding}}
  The qualitative findings represent researcher-reviewed groupings with deterministic counts. Readers should:
  {{else}}
  The qualitative observations offer preliminary interpretation of open-text entries. Readers should:
  {{/if}}
  {{else}}
  The qualitative observations offer preliminary interpretation of open-text entries. Readers should:
  {{/if}}

  - **Look for convergence** — where structured distributions and qualitative findings point the same direction
  - **Look for complementarity** — where open-text entries explain patterns visible in the distributions
  - **Look for dissonance** — where qualitative findings seem to contradict distributional patterns (these warrant investigation, not resolution)

  No new arithmetic is introduced in this section. No causal claims are made.
  {{else}}
  Without computed facts, integration is limited to the qualitative analysis above.
  {{/if}}

  ---

  ## Evidence Gaps

  {{ai_generated.evidence_gaps}}

  ---

  {{#if computed_facts}}
  <details>
  <summary><strong>Analysis Details</strong></summary>

  **Unique respondents:** {{computed_facts.totalRespondents}}

  **Fields:** {{computed_facts.schemaSummary}}

  | Field | Role | Present | Missing |
  |-------|------|--------:|--------:|
  {{#each computed_facts.fieldStats}}
  | {{this.displayName}} (`{{this.fieldName}}`) | {{this.role}} | {{this.nPresent}} | {{this.nMissing}} |
  {{/each}}

  > [!NOTE]
  > {{computed_facts.nonresponseLimitation}}

  </details>
  {{/if}}

  <details>
  <summary><strong>Method & Provenance</strong></summary>

  > **Source**
  >
  > Original file: {{#if provenance}}{{provenance.source_filename}}{{else}}{{document_names}}{{/if}}
  > Respondents: {{#if computed_facts}}{{computed_facts.totalRespondents}}{{else}}Unknown{{/if}}

  > **Schema**
  >
  {{#if provenance}}
  > Researcher confirmed the field roles and ordinal ordering.
  > Reviewed by: {{provenance.reviewed_by}}
  > Reviewed at: {{provenance.reviewed_at}}
  >
  > {{provenance.ordinal_orders}}
  {{else}}
  > No schema — computed facts not available.
  {{/if}}

  {{#if qualitative_coding}}
  {{#if qualitative_coding.hasAcceptedCoding}}
  > **Privacy Review**
  >
  > Approved as written: {{qualitative_coding.privacyReview.clear}}
  > Approved with edits: {{qualitative_coding.privacyReview.redacted}}
  > Excluded: {{qualitative_coding.privacyReview.restricted}}

  > **Qualitative Method**
  >
  > Structured qualitative content analysis.
  > Mixed inductive/deductive grouping development.

  > **Grouping Review**
  >
  {{#if qualitative_coding.codebook}}
  > Codebook version: {{qualitative_coding.codebook.version}}
  > Reviewed by: {{qualitative_coding.codebook.reviewed_by}}
  > Reviewed at: {{qualitative_coding.codebook.reviewed_at}}
  {{/if}}

  > **Match Review**
  >
  > Coding run version: {{qualitative_coding.codingRun.version}}
  > Reviewed by: {{qualitative_coding.codingRun.reviewed_by}}
  > Reviewed at: {{qualitative_coding.codingRun.reviewed_at}}

  > **Aggregation**
  >
  > Reporting unit: unique respondent
  > Denominator: eligible respondents with privacy-approved entries
  > Recurring pattern threshold: ≥2 unique respondents
  > All calculations deterministic — code-computed, not AI-generated
  {{/if}}
  {{/if}}

  > **Computation**
  >
  {{#if computed_facts}}
  > Distributions, medians, respondent counts, and cross-tabulations were computed deterministically in application code.
  >
  > {{computed_facts.nonresponseLimitation}}
  {{else}}
  > Not applicable — no CSV pipeline output.
  {{/if}}

  > **Generation**
  >
  > Template: Survey Synthesis v10.0
  > Model: {{#if provenance}}{{provenance.model_used}}{{else}}Unknown{{/if}}
  > Generated: {{current_date_iso}}

  > **Analysis Authority**
  >
  > Structured statistics: deterministic — code-computed, no AI involvement
  {{#if qualitative_coding}}
  {{#if qualitative_coding.hasAcceptedCoding}}
  > Qualitative groupings: Qori proposed, researcher reviewed and approved
  > Qualitative matches: Qori proposed, researcher reviewed and approved
  > Qualitative counts: deterministic — code-computed from accepted matches
  > Quote selection: deterministic — governed text, code-selected (not AI-selected)
  {{else}}
  > Open-text interpretation: preliminary AI-assisted interpretation — not formally coded
  {{/if}}
  {{else}}
  > Open-text interpretation: preliminary AI-assisted interpretation — not formally coded
  {{/if}}

  > **Integrity**
  >
  {{#if computed_facts}}
  > SHA-256: `{{computed_facts.sourceContentHash}}`
  {{/if}}

  </details>

output_options:
  path: "{{project_slug}}/00-discovery/"
  filename: "{{topic_slug}}-survey-synthesis-{{current_date_iso}}.md"

# ═══════════════════════════════════════════════════════════
# METADATA
# ═══════════════════════════════════════════════════════════

slack_ui:
  modal:
    title: "Survey data"
    submit_label: "Analyze"
    close_label: "Cancel"

  error_messages:
    no_files: "Please upload at least one survey file."
    no_survey_name: "Please enter a survey name."
    processing_failed: "Analysis failed. Please check that your file is valid CSV format."

notes: |
  v10.0: Slice 2B — accepted qualitative coding integration.
  - "What Respondents Described" section replaces "Preliminary Qualitative
    Observations" when accepted coding run exists
  - Recurring patterns (≥2 unique respondents) with deterministic counts
  - Individual observations (1 respondent) — not called themes
  - Deterministic governed illustrative quotes (up to 2 per grouping,
    preferring distinct respondents, restricted entries excluded)
  - Executive Summary includes qualitative pattern headlines when available
  - Method & Provenance expanded with Privacy Review, Qualitative Method,
    Grouping Review, Match Review, and Aggregation subsections
  - Analysis Authority reflects researcher approval chain
  - qualitative_observations AI task skipped when accepted coding exists
  - survey_themes NOT emitted — "themes" terminology retired
  - discovered_barriers NOT auto-emitted from qualitative patterns

  v9.2: Emit contract and cascade alignment (superseded by v10.0).
  v9.0: Deterministic structured evidence architecture (superseded).
  v8.0: computed_facts integration (superseded).
  v7.0: Interleaved Handlebars/AI architecture (superseded).
