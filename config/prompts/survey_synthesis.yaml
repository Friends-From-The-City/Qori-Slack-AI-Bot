# ═══════════════════════════════════════════════════════════
# IDENTITY
# ═══════════════════════════════════════════════════════════
id: survey_synthesis
name: survey_response_synthesizer
label: "Survey Synthesis"
version: "v7.0"

description: |
  Analyze open-ended survey responses using thematic analysis.
  v7.0: Interleaved Handlebars/AI architecture — mechanical content
  (masthead, methodology, references) rendered by template, LLM
  writes bounded analytical sections. Per ADR 0005/0016.

author: Qori R&D
created: 2025-08-11
last_updated: 2026-05-20

# ═══════════════════════════════════════════════════════════
# CONFIGURATION
# ═══════════════════════════════════════════════════════════
input_type: slack_modal_form
input_processing: form_based
discovery_scope: true

# ═══════════════════════════════════════════════════════════
# INPUTS
# ═══════════════════════════════════════════════════════════
input_variables:
  - name: topic
    type: text
    required: true
    description: "Researcher-provided topic"
  - name: selected_study
    type: select
    required: true
  - name: survey_name
    type: text
    required: true
    placeholder: "e.g., Post-launch satisfaction survey"
  - name: question_focus
    type: textarea
    required: false
    placeholder: "e.g., Q5: What was most frustrating? Q8: Any other feedback?"
  - name: combined_file_content
    type: textarea
    required: true
    description: "Extracted content from uploaded files (provided by backend)"

# ═══════════════════════════════════════════════════════════
# CASCADE CONTRACT
# ═══════════════════════════════════════════════════════════
emits:
  - key: survey_themes
    pool: true
    pool_strategy: append
    schema:
      type: array
      items:
        $ref: schemas/survey_theme.yaml
    extract_from: "Each Theme section (Theme 1, Theme 2, etc). Assign sequential IDs (theme-001). Include theme_name, frequency_count and frequency_percentage, sentiment, priority, full pattern text, and verbatim_quotes array."

  - key: survey_findings
    pool: true
    pool_strategy: append
    schema:
      type: array
      items:
        $ref: schemas/survey_finding.yaml
    extract_from: "Quantitative findings across all themes. Assign sequential IDs (finding-001). Include metric_name, sample_size, affected_segment, supporting_quotes, source_question."

  - key: discovered_barriers
    pool: true
    pool_strategy: append
    schema:
      type: array
      items:
        $ref: schemas/discovered_barrier.yaml
    extract_from: "Negative-sentiment themes as barriers. Assign sequential IDs (barrier-001). Use theme pattern as summary, frequency as magnitude, respondent quotes as evidence array, survey name as source_document."

  - key: discovered_metrics
    pool: true
    pool_strategy: append
    schema:
      type: array
      items:
        $ref: schemas/discovered_metric.yaml
    extract_from: "All quantitative measurements — theme frequencies, sentiment percentages, response counts. Assign sequential IDs (metric-001). Include context and survey name as source_document."

  - key: sample_demographics
    pool: false
    pool_strategy: replace
    schema:
      type: object
      properties:
        total_responses:
          type: integer
        composition:
          type: string
          description: "Respondent composition — who responded"
        response_rate:
          type: string
          nullable: true
    extract_from: "Overview section — total responses analyzed, respondent composition."

  - key: knowledge_gaps
    pool: true
    pool_strategy: append
    schema:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
          gap:
            type: string
          why_matters:
            type: string
            nullable: true
          suggested_resolution:
            type: string
            nullable: true
          source_document:
            type: string
    extract_from: "Knowledge Gaps section — questions the survey couldn't answer. Assign sequential IDs (gap-001). Include why the gap matters and suggested resolution."

# ═══════════════════════════════════════════════════════════
# AI GENERATION — focused, bounded tasks
# ═══════════════════════════════════════════════════════════
ai_generation_tasks:

  # Main analytical body — theme summary, per-theme sections, sentiment overview.
  # Kept as one task to preserve theme numbering consistency.
  - task_id: "analysis_body"
    prompt: |
      You are synthesizing open-ended survey responses using thematic analysis.

      ============================================================
      RULES
      ============================================================

      RULE 1: THEME-BY-THEME, NOT RESPONSE-BY-RESPONSE
      Aggregate patterns across ALL responses. No one reads response-by-response.

      RULE 2: EVERY THEME NEEDS FREQUENCY + QUOTES
      For each theme: count, percentage, 2-3 representative quotes with R-IDs.

      RULE 3: RESPONDENT CITATIONS
      Assign IDs sequentially: R001, R002, R003...
      Every quote: "[Quote]" — R00X

      RULE 4: SENTIMENT WITH MEANING
      Always explain WHAT is driving the sentiment, not just the percentage.

      RULE 5: NO HALLUCINATION
      Only report themes from the data. Counts must be accurate. Quotes verbatim.
      If unsure about a count, say "approximately."

      RULE 6: QUESTION FOCUS
      {% if question_focus %}
      PRIORITIZE these questions: {{question_focus}}
      {% else %}
      Analyze ALL open-ended/text responses. Skip closed-ended questions.
      {% endif %}

      RULE 7: EMPTY CONTENT
      If the survey data between BEGIN/END markers is empty or contains no
      text responses, respond ONLY with:
      "> **No survey responses provided.** Please upload survey data and try again."

      ============================================================
      INPUT DATA
      ============================================================

      **Survey:** {{survey_name}}
      **Study:** {{selected_study}}
      {% if question_focus %}
      **Focus Questions:** {{question_focus}}
      {% endif %}

      **Survey Data:**
      ---BEGIN DATA---
      {{combined_file_content}}
      ---END DATA---

      ============================================================
      GENERATE THESE SECTIONS
      ============================================================

      **OVERVIEW:** A summary blockquote and metadata table:

      > **[X] themes** from **[Y] responses**

      | | |
      |---|---|
      | **Responses Analyzed** | [X] |
      | **Themes Identified** | [Y] |
      {% if question_focus %}
      | **Focus Questions** | {{question_focus}} |
      {% endif %}
      | **Top Finding** | [1 sentence — most important takeaway] |

      ---

      **THEME SUMMARY TABLE:**

      | # | Theme | Frequency | Sentiment | Priority |
      |---|-------|:---------:|:----------|:--------:|
      | 1 | [Name] | [X] ([Y]%) | [Sentiment] | [Priority] |
      [continue for each theme]

      > **Note:** Percentages may exceed 100% as responses can mention multiple themes.

      ---

      **PER-THEME SECTIONS:** For each theme:

      **Theme N: [Name]**

      **Frequency:** [X] of [Total] responses ([Y]%)

      **Sentiment:** [Sentiment]

      **What respondents said:**

      > "[Direct quote]" — R00X
      > "[Direct quote]" — R00X
      > "[Direct quote]" — R00X

      **Pattern:** [1-2 sentences explaining what this theme means]

      ---

      [Repeat for each theme]

      **SENTIMENT OVERVIEW:**

      | Sentiment | Count | % | Key Driver |
      |-----------|:-----:|:-:|------------|
      | Negative | [X] | [Y]% | [What topics caused frustration] |
      | Positive | [X] | [Y]% | [What topics caused satisfaction] |
      | Mixed | [X] | [Y]% | [What topics had split opinions] |
      | Neutral | [X] | [Y]% | [Factual/descriptive responses] |

      **Key Insight:** [1-2 sentences on what the sentiment pattern tells us]

      OUTPUT BOUNDARIES: Do not generate the document title, masthead,
      methodology section, references, knowledge gaps section, or any
      footer. The template handles those sections.
      USE ## headings for each section (e.g., ## Overview, ## Theme 1: [Name]).
      Output the analytical content with proper markdown heading hierarchy.

  # Knowledge gaps — what the survey couldn't answer
  - task_id: "knowledge_gaps_prose"
    prompt: |
      Identify 3-5 knowledge gaps from this survey data — questions the
      survey couldn't answer or themes needing qualitative follow-up.

      **Survey:** {{survey_name}}

      **Survey Data:**
      ---BEGIN DATA---
      {{combined_file_content}}
      ---END DATA---

      RULES:
      - Each gap must trace to a specific limitation in the survey data
      - Do NOT suggest product actions — those belong in the research brief
      - Focus on: what the survey couldn't answer, what follow-up research
        would investigate

      Output as a table:

      | Gap Identified | Why It Matters | Suggested Research Approach |
      |:---------------|:---------------|:---------------------------|
      | [Unanswered question] | [Why this gap matters] | [Research method] |

      If the survey data is comprehensive:
      > The survey provides strong coverage. One area for further investigation: [specific gap].

      OUTPUT BOUNDARIES: Do not generate section headings or structural
      elements. The template handles all document structure.

# ═══════════════════════════════════════════════════════════
# OUTPUT — interleaved Handlebars + AI prose
# ═══════════════════════════════════════════════════════════
output_template: |
  # Survey Synthesis: {{survey_name}}

  **Study:** {{selected_study}} &nbsp; | &nbsp; **Survey:** {{survey_name}} &nbsp; | &nbsp; **Documents:** {{document_count}} &nbsp; | &nbsp; **Date:** {{current_date}}

  ---

  {{ai_generated.analysis_body}}

  ---

  ## Knowledge Gaps

  {{ai_generated.knowledge_gaps_prose}}

  ---

  <details>
  <summary><strong>Methodology</strong></summary>

  **Framework:** Thematic Analysis

  **Approach:** Open-ended responses were coded for recurring themes, counted for frequency, and analyzed for sentiment patterns. Representative quotes were extracted to illustrate each theme.

  **Data Source:** {{survey_name}}

  ### References

  - **Virginia Braun & Victoria Clarke** — Thematic analysis methodology
  - **Nielsen Norman Group** — Survey data analysis best practices
  - **Qualtrics** — Open-ended response coding guidelines

  </details>

  ---

  ---

  ## Cascade summary

  This survey synthesis emits discovery variables for downstream templates.

  | Variable | Description |
  |----------|-------------|
  | survey_themes | Thematic patterns with frequency, sentiment, and quotes |
  | survey_findings | Quantitative findings across themes |
  | discovered_barriers | Negative-sentiment themes as barriers for research brief |
  | discovered_metrics | Theme frequencies, sentiment percentages, response counts |
  | sample_demographics | Respondent composition and response count |
  | knowledge_gaps | Questions the survey couldn't answer |

  **Files analyzed:** {{document_count}}

output_options:
  path: "{{team}}/_discovery/survey-synthesis/"
  filename: "{{topic_slug}}-survey-synthesis-{{current_date_iso}}.md"

# ═══════════════════════════════════════════════════════════
# METADATA
# ═══════════════════════════════════════════════════════════
# NOTE: derived_variables removed — handler (discoverHandler.ts) computes
# topic_slug explicitly. yamlProcessor does not process derived_variables.
# NOTE: survey_recommendations emit removed — orphaned variable with no
# downstream consumer. Knowledge Gaps section replaces Recommendations.

slack_ui:
  modal:
    title: "Survey data"
    submit_label: "Analyze"
    close_label: "Cancel"

  error_messages:
    no_files: "Please upload at least one survey file."
    no_survey_name: "Please enter a survey name."
    processing_failed: "Analysis failed. Please check that your files are valid CSV or Excel format."

notes: |
  v7.0: Interleaved Handlebars/AI architecture (ADR 0005/0016 pattern).
  - Monolithic survey_synthesis_complete task split into 2 tasks:
    analysis_body (overview + themes + sentiment) and knowledge_gaps_prose.
  - Handlebars renders: masthead, methodology (toggle), references (toggle),
    cascade summary (always present).
  - Recommendations removed → Knowledge Gaps (same treatment as desk_research).
  - survey_recommendations emit removed (orphaned — no downstream consumer).
  - sample_demographics emit kept (orphaned but potentially useful).
  - Anti-fabrication: added empty-content detection (Rule 7) and
    OUTPUT BOUNDARIES rule to both tasks.
  - Duplicate footer removed (yamlProcessor handles it).
  - derived_variables block removed (handler computes topic_slug).

  v3.1: Standards polish (superseded by v7.0).
  v3.0: Claude Sonnet, improved question_focus.
