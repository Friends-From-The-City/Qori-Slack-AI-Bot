# ═══════════════════════════════════════════════════════════
# IDENTITY
# ═══════════════════════════════════════════════════════════
id: research_plan
name: run_research_plan
label: "📋 Research Plan"
version: "v7.2"

description: |
  Transform your research concept into a stakeholder-ready execution plan.
  Lean output focused on methodology, participants, timeline, and deliverables.
  v7.2: OUTPUT BOUNDARIES added to all prose tasks, validity checklist (empty cells),
  cascade summary collapsed in <details> per metadata ruling (2026-08-04).
  v7.1: Fix participant duplication — glance value in summary, detail once in section.
  v7.0: Interleaved Handlebars/AI architecture — computed values render
  mechanically, LLM only writes bounded prose sections.

author: Qori R&D
created: 2025-06-26
last_updated: 2026-08-04

# ═══════════════════════════════════════════════════════════
# CONFIGURATION
# ═══════════════════════════════════════════════════════════
input_type: structured
input_processing: direct

# ═══════════════════════════════════════════════════════════
# INPUTS
# ═══════════════════════════════════════════════════════════
input_variables:
  - project_title:
      type: "text"
      required: true
  - lead_researcher:
      type: "text"
      required: true
  - start_date:
      type: "date"
      required: false
  - timeline_preference:
      type: "radio"
      required: false
  - recruitment_sources:
      type: "text"
      required: false
  - operational_risks:
      type: "textarea"
      required: false

# ═══════════════════════════════════════════════════════════
# CASCADE CONTRACT
# ═══════════════════════════════════════════════════════════
consumes:
  # Commitments from brief — plan MUST honor these
  - key: research_objectives
    source: research_brief
    required: true
    inject_as: commitment
    description: "Approved objectives — plan operationalizes these"
  - key: research_questions
    source: research_brief
    required: true
    inject_as: commitment
    description: "Approved questions — plan designs tasks to answer these"
  - key: methodology_selection
    source: research_brief
    required: true
    inject_as: commitment
    description: "Approved method — plan details the execution"
  - key: target_barriers
    source: research_brief
    required: true
    inject_as: grounding
    description: "Barriers to test — grounds task design and risk assessment"
  - key: participant_criteria
    source: research_brief
    required: true
    inject_as: commitment
    description: "Who to recruit — plan specifies recruitment to match"
  - key: participant_approach
    source: research_brief
    required: false
    inject_as: commitment
    description: "Composition and count from brief"
  - key: business_context
    source: research_brief
    required: false
    inject_as: context
    description: "Problem framing from brief"
  - key: out_of_scope
    source: research_brief
    required: false
    inject_as: constraint
    description: "What research won't cover — plan must not exceed"
  - key: timeline_preference
    source: research_brief
    required: false
    inject_as: constraint
    description: "Standard/accelerated/extended — constrains phase date calculation"
  - key: start_date
    source: research_brief
    required: false
    inject_as: constraint
    description: "When planning begins — constrains phase dates"
  - key: decision_deadline
    source: research_brief
    required: false
    inject_as: constraint
    description: "Hard deadline for findings — plan must deliver before this"
  - key: budget
    source: research_brief
    required: false
    inject_as: constraint
    description: "Budget envelope from brief — plan must not exceed"

emits:
  - key: study_timeline
    pool: false
    pool_strategy: replace
    extraction_model: sonnet
    schema:
      type: array
      items:
        $ref: schemas/study_timeline.yaml
    extract_from: "ALL timeline phases — extract EVERY phase as a separate array item"
  - key: risks
    pool: false
    pool_strategy: replace
    extraction_model: sonnet
    schema:
      type: array
      items:
        $ref: schemas/study_risk.yaml
    extract_from: "ALL risks — extract EVERY risk as a separate array item"
  - key: deliverables
    pool: false
    pool_strategy: replace
    extraction_model: sonnet
    schema:
      type: array
      items:
        $ref: schemas/study_deliverable.yaml
    extract_from: |
      ALL deliverables from the Deliverables section. For EACH deliverable:
      - id: Format deliverable-01, deliverable-02, etc.
      - deliverable_name: Name of the output artifact
      - format: Output format (Markdown report, etc.)
      - addresses_objective: REQUIRED — The research objective ID (OBJ-XXX) this deliverable serves.
        Each deliverable exists to fulfill a research objective from the brief.
        Infer from context: Session summaries serve OBJ-001 (primary findings), Readout serves OBJ-002 (synthesis), etc.
      CRITICAL: Every deliverable MUST have a non-empty addresses_objective field.

# ═══════════════════════════════════════════════════════════
# AI GENERATION — focused, bounded tasks
# ═══════════════════════════════════════════════════════════
ai_generation_tasks:
  - task_id: "summary"
    prompt: |
      Write a 2-3 sentence summary for a research execution plan.

      Study: {{project_title}}
      Method: {{methodology}}
      Participants: {{target_participants}}

      {% if upstream_research_objectives %}
      APPROVED OBJECTIVES: {{upstream_research_objectives}}
      {% endif %}
      {% if upstream_business_context %}
      BUSINESS CONTEXT: {{upstream_business_context}}
      {% endif %}

      OUTPUT BOUNDARIES: Generate ONLY the summary paragraph — no heading,
      no preamble, no footer or structural elements.
      Focus: what the study will do, the method, participant target,
      and what decision the findings will inform.

  - task_id: "background"
    skip_when: "not upstream_business_context"
    skip_output: "Background context was not provided in the approved brief."
    prompt: |
      Write a 3-4 sentence background paragraph for a research plan.

      Study: {{project_title}}
      Method: {{methodology}}

      BUSINESS CONTEXT: {{upstream_business_context}}
      {% if upstream_research_objectives %}
      OBJECTIVES: {{upstream_research_objectives}}
      {% endif %}

      OUTPUT BOUNDARIES: Generate ONLY the paragraph — no heading,
      no preamble, no footer or structural elements.
      Focus: why this research matters now, what's known, what the gap is.
      Do not introduce scope beyond what the brief approved.

  - task_id: "method_approach"
    prompt: |
      Write 2-3 sentences describing the methodology approach for this study.

      Method: {{methodology}}
      {% if upstream_target_barriers %}
      TARGET BARRIERS to test: {{upstream_target_barriers}}
      {% endif %}
      {% if upstream_research_questions %}
      RESEARCH QUESTIONS: {{upstream_research_questions}}
      {% endif %}

      OUTPUT BOUNDARIES: Generate ONLY the sentences — no heading,
      no label, no footer or structural elements.
      Be specific to the methodology. Mention what sessions will explore and
      how the protocol will elicit evidence about the target barriers.

  - task_id: "session_format_detail"
    prompt: |
      Write 1-2 sentences about session format for {{methodology}} sessions.

      OUTPUT BOUNDARIES: Generate ONLY the sentences — no heading,
      no footer or structural elements.
      Cover: remote/in-person, accessibility accommodations, alternative
      formats if applicable.

  - task_id: "data_collection_methods"
    prompt: |
      Write 1-2 sentences about data collection methods for {{methodology}}.

      OUTPUT BOUNDARIES: Generate ONLY the sentences — no heading,
      no footer or structural elements.
      Mention specific methods: think-aloud, screen recording, observer
      notes, post-session interviews, etc. Be specific to the methodology.

  - task_id: "participant_glance"
    model: "claude-haiku-4-5-20251001"
    skip_when: "not upstream_participant_approach"
    skip_output: "Not defined in brief"
    prompt: |
      Write a ONE-LINE glance summary of participant composition for an at-a-glance table.

      FULL APPROACH: {{upstream_participant_approach}}

      Output ONLY a single line with count + segment names. Format:
      "[count] [population] across [n] segments: [segment names]"

      OUTPUT BOUNDARIES: Generate ONLY a single line — no heading,
      no footer or structural elements.
      NO rationale, NO detail — just count and segment names. This is for a summary table cell.

  - task_id: "participant_composition_prose"
    skip_when: "not upstream_participant_criteria and not upstream_participant_approach"
    skip_output: "Participant requirements were not defined in the approved brief. Complete the brief's participant approach before relying on this section."
    prompt: |
      Write participant requirements content (sample size + composition).

      {% if upstream_participant_criteria %}
      APPROVED CRITERIA: {{upstream_participant_criteria}}
      {% endif %}
      {% if upstream_participant_approach %}
      APPROACH: {{upstream_participant_approach}}
      {% endif %}

      Structure:
      1. ONE sentence stating sample size and rationale (format: "Recruit [count] participants across [n] segments to ensure coverage of [criteria source]")
      2. A bullet list (use markdown dash -) with each segment on its own line, including count per segment and brief rationale

      OUTPUT BOUNDARIES: Generate ONLY the content — no heading,
      no footer or structural elements. The template provides the section header.
      Keep it actionable. Include accessibility segments and demographic diversity requirements if specified in the criteria.

  - task_id: "deliverables_narrative"
    prompt: |
      Write a bullet list of deliverables this {{methodology}} study will produce.

      {% if upstream_research_objectives %}
      OBJECTIVES: {{upstream_research_objectives}}
      {% endif %}

      Select deliverables appropriate for {{methodology}}:
      - Usability Testing: Session summaries, Affinity map, Journey map, Research readout, Design recommendations
      - User Interviews: Session summaries, Affinity map, Personas, Research readout
      - Card Sorting: Card sort analysis, IA recommendations, Research readout
      - Survey Research: Survey synthesis, Research readout
      - Concept Testing: Session summaries, Concept reaction synthesis, Research readout, Design recommendations
      - Mixed Methods: Session summaries, Affinity map, Journey map, Research readout

      OUTPUT BOUNDARIES: Generate ONLY the bullet list — no heading,
      no footer or structural elements.
      Format each as:
      - **[Deliverable]** — [one-line description]

      Close with: "All artifacts will be stored in the study's research folder for ongoing reference."

  - task_id: "risks"
    output_format: json
    prompt: |
      Generate 3 study-specific risks for this research plan as a JSON array.

      Study: {{project_title}}
      Method: {{methodology}}
      {% if upstream_target_barriers %}
      TARGET BARRIERS: {{upstream_target_barriers}}
      {% endif %}
      {% if operational_risks %}
      RESEARCHER-NOTED RISKS: {{operational_risks}}
      {% endif %}

      Rules:
      1. Risks must be study-specific, NOT generic project management risks.
      2. If target barriers exist, at least one risk should address challenges testing those barriers.
      3. If the researcher noted operational risks, incorporate them.

      Output ONLY valid JSON. No prose, no code fences.
      Schema: [{"risk": "string", "likelihood": "High|Medium|Low", "mitigation": "string"}]

  - task_id: "brief_operationalization"
    output_format: json
    prompt: |
      Map each top-level brief commitment to how this research plan addresses it.

      {% if upstream_research_objectives %}
      OBJECTIVES: {{upstream_research_objectives}}
      {% endif %}
      {% if upstream_research_questions %}
      QUESTIONS: {{upstream_research_questions}}
      {% endif %}
      Method: {{methodology}}
      {% if upstream_target_barriers %}
      BARRIERS: {{upstream_target_barriers}}
      {% endif %}

      RULES:
      1. Maximum 7 entries. Only top-level commitment categories.
      2. Use EXACTLY these category names as the "commitment" field:
         Objectives, Research questions, Method, Participants,
         Target barriers, Timeline, Budget.
      3. Do NOT list individual research questions (RQ-001, RQ-002) as
         separate entries — summarize ALL questions in one row.
      4. Do NOT list individual target barriers (TB-001, TB-002) as
         separate entries — summarize ALL barriers in one row.
      5. Each "address" field is ONE sentence explaining how the plan
         operationalizes that category.
      6. Omit a category if the brief didn't specify it (e.g., skip
         Budget if no budget was provided).

      Output ONLY valid JSON. No prose, no code fences.
      Schema: [{"commitment": "string", "address": "string"}]

# ═══════════════════════════════════════════════════════════
# OUTPUT — interleaved Handlebars + AI prose
# ═══════════════════════════════════════════════════════════
output_template: |
  # Research Plan: {{project_title}}

  **Study:** {{selected_study}} &nbsp; | &nbsp; **Researcher:** {{lead_researcher}} &nbsp; | &nbsp; **Date:** {{current_date}} &nbsp; | &nbsp; **Status:** Draft

  ---

  ## Summary

  {{ai_generated.summary}}

  | | |
  |---|---|
  | **Method** | {{methodology}} |
  | **Participants** | {{ai_generated.participant_glance}} |
  | **Timeline** | {{timeline_summary}} |

  ---

  ## Background

  {{ai_generated.background}}

  ---

  ## Objectives

  What we aim to learn through this research:

  {{#each objectives}}
  - **[{{this.id}}]** {{this.objective}}
  {{/each}}

  ---

  ## Research questions

  {{#each research_questions}}
  - **[{{this.id}}]** {{this.question}}{{#if this.priority}} _({{this.priority}})_{{/if}}
  {{/each}}

  ---

  ## Method

  **Approach** — {{ai_generated.method_approach}}

  **Session format** — {{ai_generated.session_format_detail}}

  **Data collection** — {{ai_generated.data_collection_methods}}

  ---

  ## Participants

  {{ai_generated.participant_composition_prose}}

  **Recruitment** — {{recruitment_sources}}

  {{#if per_participant_compensation}}
  **Compensation** — ${{per_participant_compensation}} per participant (calculated from ${{parsed_budget_amount}} budget ÷ {{target_participants}} target participants)
  {{else}}
  **Compensation** — Standard rate, typically $50-$100 per participant for 60-90 min
  {{/if}}

  ---

  ## Timeline

  | Phase | Dates | Duration |
  |-------|-------|---------:|
  {{#each timeline_phases}}
  | {{this.phase}} | {{this.dates}} | {{this.duration}} |
  {{/each}}

  > [!NOTE]
  > Timeline begins after stakeholder approval of this plan.

  ---

  ## Deliverables

  {{ai_generated.deliverables_narrative}}

  ---

  ## Risks and mitigations

  | Risk | Likelihood | Mitigation |
  |------|:----------:|------------|
  {{#each risks}}
  | {{this.risk}} | {{this.likelihood}} | {{this.mitigation}} |
  {{/each}}

  ---

  ## Brief commitments operationalized

  | Brief commitment | How this plan addresses it |
  |------------------|---------------------------|
  {{#each brief_operationalization}}
  | **{{this.commitment}}** | {{this.address}} |
  {{/each}}

  ---

  <details>
  <summary><strong>Validity checklist</strong></summary>

  | Check | Result |
  |-------|--------|
  | Objectives match brief | |
  | Research questions have RQ-XXX IDs | |
  | Target barriers have TB-XXX IDs | |
  | Method matches approved methodology | |
  | Participant count matches brief | |
  | Timeline phases are realistic | |
  | Deliverables are method-appropriate | |
  | Risks are study-specific, not generic | |
  | Brief operationalization covers all commitments | |

  </details>

  ---

  <details>
  <summary><strong>Research provenance</strong></summary>

  This plan operationalizes the approved research brief.

  | Brief commitment | Count |
  |------------------|-------|
  | Research objectives | {{objectives_count}} |
  | Research questions | {{research_questions_count}} |
  | Target barriers | {{target_barriers_count}} |
  | Methodology | {{methodology}} |
  | Budget | {{#if parsed_budget_amount}}${{parsed_budget_amount}}{{else}}N/A{{/if}} |

  **Upstream context**

  | Source | Used for |
  |--------|----------|
  | research_brief | Objectives, questions, method, participants, barriers, constraints |

  Citation markers throughout:
  - [RQ-XXX] = research question this element addresses
  - [TB-XXX] = target barrier this task tests
  - [Ob-XXX] = research objective this deliverable serves

  </details>

output_options:
  path: "02-plan/"
  filename: "{{selected_study}}--research-plan--{{__derivation_fp}}.md"

# ═══════════════════════════════════════════════════════════
# METADATA (documentation only — not read by backend)
# ═══════════════════════════════════════════════════════════
processing_workflow:
  1. handler_loads_upstream_and_computes_mechanical_values
  2. execute_focused_ai_tasks
  3. parse_json_ai_outputs
  4. render_interleaved_output_template
  5. save_to_planning_folder

notes: |
  v7.0: Interleaved Handlebars/AI architecture (reference implementation).
  - Output template is now the source of structure. Computed values
    (compensation, timeline, counts, objectives, research questions)
    render mechanically via Handlebars. LLM only writes prose.
  - Single monolithic plan_complete task replaced by 9 focused tasks:
    7 prose tasks + 2 structured JSON tasks (risks, brief_operationalization).
  - JSON tasks parsed by yamlProcessor (output_format: json), injected as
    template-ready arrays for {{#each}} iteration.
  - Handler assembles all mechanical data (timeline phases with calculated
    dates, compensation with explanatory math, cascade counts).
  - Team and roles section removed (lead researcher in masthead,
    observers/note-takers managed via /qori-fieldwork).
  - Cascade summary moved to bottom, preceded by double horizontal rule
    separator distinguishing body from meta-information.

  v6.0: Single-task architecture (superseded by v7.0).
  v5.0-v5.1: Cascade-aware retrofit (superseded by v6.0).
  v4.7: Lean rewrite — brief = approval gate, plan = execution doc.
