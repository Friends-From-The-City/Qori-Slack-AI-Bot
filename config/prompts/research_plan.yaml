# ═══════════════════════════════════════════════════════════
# IDENTITY
# ═══════════════════════════════════════════════════════════
id: research_plan
name: run_research_plan
label: "📋 Research Plan"
version: "v5.0"

description: |
  Transform your research concept into a stakeholder-ready execution plan.
  Lean output focused on methodology, participants, timeline, and deliverables.

author: Qori R&D
created: 2025-06-26
last_updated: 2026-05-06

# ═══════════════════════════════════════════════════════════
# CONFIGURATION
# ═══════════════════════════════════════════════════════════
input_type: structured
input_processing: direct

# ═══════════════════════════════════════════════════════════
# INPUTS
# ═══════════════════════════════════════════════════════════
input_variables:
  - project_title:
      type: "text"
      required: true
  - decision_context:
      type: "textarea"
      required: true
  - research_goal:
      type: "textarea"
      required: true
  - methodology:
      type: "select"
      required: true
  - target_participants:
      type: "textarea"
      required: true
  - participant_count:
      type: "select"
      required: true
  - start_date:
      type: "date"
      required: true
  - timeline_preference:
      type: "radio"
      required: true
  - lead_researcher:
      type: "text"
      required: true

# ═══════════════════════════════════════════════════════════
# CASCADE CONTRACT
# ═══════════════════════════════════════════════════════════
consumes:
  # Commitments from brief — plan MUST honor these
  - key: research_objectives
    source: research_brief
    required: true
    inject_as: commitment
    description: "Approved objectives — plan operationalizes these"
  - key: research_questions
    source: research_brief
    required: true
    inject_as: commitment
    description: "Approved questions — plan designs tasks to answer these"
  - key: methodology_selection
    source: research_brief
    required: true
    inject_as: commitment
    description: "Approved method — plan details the execution"
  - key: target_barriers
    source: research_brief
    required: true
    inject_as: grounding
    description: "Barriers to test — grounds task design and risk assessment"
  - key: participant_criteria
    source: research_brief
    required: true
    inject_as: commitment
    description: "Who to recruit — plan specifies recruitment to match"
  - key: participant_approach
    source: research_brief
    required: false
    inject_as: commitment
    description: "Composition and count from brief"
  # Context from brief — informs but does not bind
  - key: business_context
    source: research_brief
    required: false
    inject_as: context
    description: "Problem framing from brief"
  # Constraints from brief — plan must work within these
  - key: out_of_scope
    source: research_brief
    required: false
    inject_as: constraint
    description: "What research won't cover — plan must not exceed"
  - key: timeline_preference
    source: research_brief
    required: false
    inject_as: constraint
    description: "Standard/accelerated/extended — constrains phase date calculation"
  - key: start_date
    source: research_brief
    required: false
    inject_as: constraint
    description: "When planning begins — constrains phase dates"
  - key: decision_deadline
    source: research_brief
    required: false
    inject_as: constraint
    description: "Hard deadline for findings — plan must deliver before this"
  - key: budget
    source: research_brief
    required: false
    inject_as: constraint
    description: "Budget envelope from brief — plan must not exceed"

emits:
  - key: study_timeline
    pool: false
    pool_strategy: replace
    extraction_model: sonnet
    schema:
      type: array
      items:
        $ref: schemas/study_timeline.yaml
    extract_from: "ALL timeline phases — extract EVERY phase as a separate array item"
  - key: risks
    pool: false
    pool_strategy: replace
    extraction_model: sonnet
    schema:
      type: array
      items:
        $ref: schemas/study_risk.yaml
    extract_from: "ALL risks — extract EVERY risk as a separate array item"
  - key: deliverables
    pool: false
    pool_strategy: replace
    extraction_model: sonnet
    schema:
      type: array
      items:
        $ref: schemas/study_deliverable.yaml
    extract_from: "ALL deliverables — extract EVERY deliverable as a separate array item"

# ═══════════════════════════════════════════════════════════
# AI GENERATION
# ═══════════════════════════════════════════════════════════
ai_generation_tasks:
  # GLOBAL FORMATTING RULE (applies to all tasks below):
  # Always use markdown dash (-) for bullets, never Unicode bullets (•).
  # Do not wrap text in quotes. Use display-friendly dates (Month DD, YYYY).

  # Summary — narrative synthesis of the plan
  - task_id: "summary"
    prompt: |
      Write a 2-3 sentence summary of this research plan:

      Study: {{project_title}}
      Context: {{decision_context}}
      Goal: {{research_goal}}
      Method: {{methodology}}
      Participants: {{participant_count}} — {{target_participants}}

      {% if upstream_research_objectives %}
      BRIEF COMMITMENTS (approved — this plan operationalizes these):
      Research objectives: {{upstream_research_objectives}}
      Research questions: {{upstream_research_questions}}
      {% if upstream_target_barriers %}Target barriers: {{upstream_target_barriers}}{% endif %}
      Approved method: {{upstream_methodology_selection}}

      IMPORTANT: The plan exists to execute the approved brief. The summary
      MUST reference the brief's objectives and method as commitments being
      operationalized — not as optional context. Ground the summary in what
      was approved and how this plan delivers on it.
      {% endif %}

      The summary should explain: what the study will do, how many participants
      and what method, and what decision the findings will inform. Be specific
      and concise. Do not use quotes around text.

  # Background — expand business context, grounded in brief
  - task_id: "background"
    prompt: |
      Expand this business context into a clear, professional background
      paragraph (3-4 sentences):

      {{decision_context}}

      {% if upstream_research_objectives %}
      BRIEF COMMITMENTS (approved):
      Research objectives: {{upstream_research_objectives}}
      {% if upstream_business_context %}Business context from brief: {{upstream_business_context}}{% endif %}
      {% if upstream_out_of_scope %}Out of scope (constraint): {{upstream_out_of_scope}}{% endif %}

      The background must be consistent with the approved brief's framing.
      Reference the brief's objectives as the approved scope this plan serves.
      Do not introduce new scope beyond what the brief approved.
      {% endif %}

      Include: what the product/feature is, what problem exists, what decision
      this research will inform, and why it matters now. Use direct language.
      Do not wrap text in quotes.

  # Objectives — reformulate research goal as learning verbs
  - task_id: "objectives"
    prompt: |
      Transform this research goal into 3-4 specific objectives using
      learning-focused verbs (Identify, Understand, Evaluate, Document):

      Goal: {{research_goal}}
      Method: {{methodology}}

      Format as:
      - **Identify** [what barriers/issues we aim to find]
      - **Understand** [what mental models/behaviors we aim to learn]
      - **Evaluate** [what we aim to assess]
      - **Document** [what we aim to record for future reference]

      Each objective should be one line, specific to this study.
      Always use markdown dash (-) for bullets, never Unicode bullets (•).
      Do not wrap text in quotes.

  # Research questions — derive from objectives + context
  - task_id: "research_questions"
    prompt: |
      Generate 3-4 specific research questions for this study:

      Study: {{project_title}}
      Context: {{decision_context}}
      Goal: {{research_goal}}
      Method: {{methodology}}

      Format as a numbered list:
      1. [Question about user behavior or pain points]
      2. [Question about mental models or expectations]
      3. [Question about specific feature/flow effectiveness]
      4. [Question about priorities or improvements]

      Questions should be answerable through {{methodology}} research.
      Do not wrap text in quotes.

  # Method — expand methodology selection
  - task_id: "method"
    prompt: |
      Describe the research methodology for this study:

      Method: {{methodology}}
      Participants: {{participant_count}} — {{target_participants}}
      Study: {{project_title}}

      Write in bold-em-dash format:

      **Approach** — [2-3 sentences: what the sessions will explore, what protocol
      will be used, how data will be collected. Be specific to {{methodology}}.]

      **Session format** — [Format, duration, and setup. For moderated research,
      note remote/in-person and any accessibility accommodations.]

      **Data collection** — [List specific methods: think-aloud protocol, screen
      recording, observer notes, post-session interviews, etc.]

      **Tasks** — [List 4-5 realistic task scenarios specific to this study.
      These are what participants will be asked to do.]

      End with: "Detailed task scripts and discussion guide will be developed
      separately and reviewed before fielding."

      Do not wrap text in quotes.

  # Participants — format participant criteria
  - task_id: "participants"
    prompt: |
      Format participant recruitment details for this study:

      Target: {{target_participants}}
      Count: {{participant_count}}
      Method: {{methodology}}

      Write in this format:

      **Sample size** — {{participant_count}}

      **Required composition:**

      [Format the target participant criteria as a bulleted list. Each distinct
      criterion gets its own bullet. Include device diversity, accessibility
      needs, usage frequency, and any demographic requirements mentioned.]

      **Recruitment** — [1-2 sentences about recruitment channels appropriate
      for reaching these participants]

      **Compensation** — [Standard rate for this type of research, typically
      $50-$100 per participant for 60-90 minute sessions]

      Always use markdown dash (-) for bullets, never Unicode bullets (•).
      Do not wrap text in quotes.

  # Timeline display — format timeline preference for summary table
  - task_id: "timeline_display"
    prompt: |
      Format this timeline preference as a display-friendly string:

      Preference: {{timeline_preference}}
      Start date: {{start_date}}

      Rules:
      - "standard" → "5 weeks, starting [Month DD, YYYY]"
      - "accelerated" → "2 weeks, starting [Month DD, YYYY]"
      - "extended" → "8 weeks, starting [Month DD, YYYY]"

      Convert the start date to display format (e.g., "May 4, 2026").
      Output ONLY the formatted string, nothing else.

  # Timeline — calculate dates from start_date + preference, respecting brief constraints
  - task_id: "timeline"
    prompt: |
      Create a timeline table for {{timeline_preference}} research starting {{start_date}}.

      {% if upstream_decision_deadline %}
      CONSTRAINT: The brief specifies a decision deadline of {{upstream_decision_deadline}}.
      The final Reporting phase MUST end on or before this date. If the standard
      phase durations would exceed the deadline, compress proportionally —
      Planning and Recruitment absorb the most compression, Fieldwork and
      Analysis compress last.
      {% endif %}

      {% if upstream_start_date %}
      CONSTRAINT: Brief-approved start date is {{upstream_start_date}}.
      Use this if it differs from the modal input.
      {% endif %}

      CRITICAL: Output EXACTLY 3 columns per row. No more, no less.
      The 3 columns are: Phase | Dates | Duration
      The Dates column combines start AND end into ONE cell: "May 18 – May 25, 2026"

      Phase durations for {{timeline_preference}}:
      - standard: Planning 7d, Recruitment 10d, Fieldwork 7d, Analysis 3d, Reporting 2d
      - accelerated: Planning 2d, Recruitment 4d, Fieldwork 4d, Analysis 2d, Reporting 2d
      - extended: Planning 14d, Recruitment 14d, Fieldwork 14d, Analysis 7d, Reporting 7d

      Rules:
      - Start from {{start_date}}. Each phase starts the day after the previous ends.
      - Do NOT output a header row — only the 5 data rows.
      - No blank lines between rows.

      YOUR OUTPUT MUST LOOK EXACTLY LIKE THIS (but with dates calculated from {{start_date}}):
      | Planning and stakeholder alignment | May 18 – May 25, 2026 | 1 week |
      | Recruitment | May 26 – June 4, 2026 | 1.5 weeks |
      | Fieldwork (sessions) | June 5 – June 11, 2026 | 1 week |
      | Analysis | June 12 – June 14, 2026 | 3 days |
      | Reporting | June 15 – June 16, 2026 | 2 days |

  # Deliverables — methodology-driven static list
  - task_id: "deliverables"
    prompt: |
      List the expected deliverables for {{methodology}} research.

      Use EXACTLY the list for the matching methodology:

      Usability Testing:
      - **Session summaries** (one per participant) — within 48 hours of each session
      - **Affinity map** — themes from cross-participant analysis
      - **Journey map** — stage-by-stage user experience with pain points (if behavioral patterns warrant)
      - **Research readout** — primary stakeholder document with findings and recommendations
      - **Design recommendations** — specific implementable changes tied to findings

      User Interviews:
      - **Session summaries** (one per participant) — within 48 hours of each session
      - **Affinity map** — themes from cross-participant analysis
      - **Personas** — behavioral archetypes (if archetype patterns warrant)
      - **Research readout** — primary stakeholder document with findings and recommendations

      Survey Research:
      - **Survey synthesis** — thematic analysis of open-ended responses
      - **Research readout** — primary stakeholder document with findings and recommendations

      Card Sorting:
      - **Card sort analysis** — clustering and similarity analysis
      - **Information architecture recommendations** — restructuring proposals
      - **Research readout** — primary stakeholder document with findings and recommendations

      Concept Testing:
      - **Session summaries** — concept reactions and preference analysis
      - **Concept reaction synthesis** — aggregated feedback and viability assessment
      - **Research readout** — primary stakeholder document with findings and recommendations
      - **Design recommendations** — specific changes based on concept feedback

      Mixed Methods:
      - **Session summaries** (one per participant) — within 48 hours of each session
      - **Affinity map** — themes from cross-participant analysis
      - **Journey map** — stage-by-stage user experience with pain points
      - **Research readout** — primary stakeholder document with findings and recommendations
      - **Design recommendations** — specific implementable changes tied to findings
      - **Decision matrix** — prioritized recommendations with effort estimates

      Contextual Inquiry:
      - **Session summaries** — contextual observations and workflows documented
      - **Affinity map** — themes from cross-participant analysis
      - **Journey map** — workflow mapping with contextual pain points
      - **Research readout** — primary stakeholder document with findings and recommendations

      Tree Test:
      - **Tree test analysis** — task completion rates and pathways
      - **Information architecture recommendations** — restructuring proposals
      - **Research readout** — primary stakeholder document with findings and recommendations

      If the methodology doesn't match any above, use:
      - **Session summaries** — per-participant analysis
      - **Research readout** — primary stakeholder document with findings and recommendations
      - **Design recommendations** — specific implementable changes tied to findings

      {% if upstream_research_objectives %}
      BRIEF COMMITMENT — each deliverable should map to at least one approved
      research objective:
      {{upstream_research_objectives}}

      After each deliverable bullet, add a parenthetical noting which
      objective(s) it addresses, e.g.: "— addresses objectives 1, 3"
      {% endif %}

      Output ONLY the bulleted list for {{methodology}}. Nothing else.

  # Risks — generate 3 study-specific risks, referencing upstream constraints
  - task_id: "risks"
    prompt: |
      Identify 3 risks for {{methodology}} research on {{project_title}}
      with {{participant_count}} participants ({{target_participants}}):

      {% if upstream_target_barriers %}
      UPSTREAM GROUNDING — barriers identified in approved brief:
      {{upstream_target_barriers}}

      At least one risk should address challenges related to testing these
      specific barriers (e.g., difficulty simulating barrier conditions,
      participant ability to articulate barrier experiences).
      {% endif %}

      {% if upstream_decision_deadline %}
      CONSTRAINT: Decision deadline is {{upstream_decision_deadline}}.
      Consider deadline-driven risks (compressed analysis time, stakeholder
      availability for review).
      {% endif %}

      {% if upstream_budget %}
      CONSTRAINT: Budget envelope is {{upstream_budget}}.
      Consider budget-related risks if relevant (participant incentives,
      tooling costs).
      {% endif %}

      Format as table rows ONLY (no header):
      | [Risk description] | [High/Medium/Low] | [Specific mitigation] |
      | [Risk description] | [High/Medium/Low] | [Specific mitigation] |
      | [Risk description] | [High/Medium/Low] | [Specific mitigation] |

      Risks should be specific to this study — not generic project management.
      Consider: recruitment difficulty for this population, technical setup for
      {{methodology}}, timeline constraints for {{timeline_preference}} schedule.

      CRITICAL: Output rows with NO blank lines between them. Every row must
      connect directly to the next. Blank lines break markdown table rendering.

# ═══════════════════════════════════════════════════════════
# OUTPUT
# ═══════════════════════════════════════════════════════════
output_template: |
  # Research Plan: {{project_title}}

  **Study:** {{selected_study}} &nbsp; | &nbsp; **Researcher:** {{lead_researcher}} &nbsp; | &nbsp; **Date:** {{current_date}} &nbsp; | &nbsp; **Status:** Draft

  ---

  ## Summary

  {{ai_generated.summary}}

  | | |
  |---|---|
  | **Method** | {{methodology}} |
  | **Participants** | {{participant_count}} |
  | **Timeline** | {{ai_generated.timeline_display}} |
  | **Deliverables** | Research readout, design recommendations |

  ---

  ## Background

  {{ai_generated.background}}

  ---

  ## Objectives

  What we aim to learn through this research:

  {{ai_generated.objectives}}

  ---

  ## Research questions

  {{ai_generated.research_questions}}

  ---

  ## Method

  {{ai_generated.method}}

  ---

  ## Participants

  {{ai_generated.participants}}

  ---

  ## Timeline

  | Phase | Dates | Duration |
  |-------|-------|---------:|
  {{ai_generated.timeline}}

  > [!NOTE]
  > Timeline begins after stakeholder approval of this plan. Recruitment may extend if participant diversity requires additional outreach.

  ---

  ## Deliverables

  {{ai_generated.deliverables}}

  All artifacts will be stored in the study's research folder for ongoing reference.

  ---

  ## Team and roles

  | Role | Person |
  |------|--------|
  | Lead researcher | {{lead_researcher}} |
  | Note-taker | To be assigned |
  | Observer | To be assigned |
  | Stakeholder reviewer | TBD |

  ---

  ## Risks and mitigations

  | Risk | Likelihood | Mitigation |
  |------|:----------:|------------|
  {{ai_generated.risks}}

  {% if upstream_research_objectives %}
  ---

  ## Upstream context

  This plan operationalizes the approved research brief. Brief commitments
  are binding — scope changes require brief amendment.

  | Brief commitment | How this plan addresses it |
  |---|---|
  | **Objectives** | Plan objectives elaborate the brief's approved learning goals |
  | **Method** | {{upstream_methodology_selection}} — detailed in Method section |
  | **Participants** | Recruitment criteria match brief's participant commitment |
  | **Timeline** | Phased schedule fits within brief's {{upstream_timeline_preference}} preference{% if upstream_decision_deadline %}, ending before {{upstream_decision_deadline}}{% endif %} |
  {% if upstream_out_of_scope %}| **Out of scope** | {{upstream_out_of_scope}} — plan does not exceed these boundaries |{% endif %}
  {% if upstream_budget %}| **Budget** | {{upstream_budget}} — plan costs fit within this envelope |{% endif %}

  > **Plan notes:** Brief commitments operationalized. Objectives, method, and
  > participant criteria from the approved brief are treated as binding scope.
  > Any deviation requires a brief amendment before proceeding.
  {% endif %}

output_options:
  path: "01-planning/"
  filename: "{{selected_study}}-research-plan-{{current_date_iso}}.md"

# ═══════════════════════════════════════════════════════════
# METADATA (documentation only — not read by backend)
# ═══════════════════════════════════════════════════════════
processing_workflow:
  1. validate_modal_inputs
  2. execute_ai_tasks
  3. render_output_template_with_deliverables
  4. save_to_planning_folder

notify:
  - role: team
    action: "Research plan generated"
    channel: "{{study_channel}}"
    message: "Research plan for {{project_title}} is ready for review."

notes: |
  v5.0: Cascade-aware retrofit per Section 8 of design standards.
  - consumes: updated inject_as semantics (commitment/grounding/constraint
    instead of blanket context). 5 keys now required: research_objectives,
    research_questions, methodology_selection, target_barriers, participant_criteria.
  - emits: schemas upgraded to $ref (study_timeline.yaml, study_risk.yaml,
    study_deliverable.yaml). extraction_model: sonnet for all 3 emits.
    extract_from instructions updated for array extraction.
  - AI tasks: cascade-aware prompts in summary, background, timeline, risks,
    deliverables. Brief commitments treated as binding scope. Timeline respects
    decision_deadline constraint. Risks reference upstream barriers. Deliverables
    map to approved objectives.
  - Output: added "Upstream context" section with commitment traceability table.
    Plan notes call out "Brief commitments operationalized."
  - Multi-task architecture preserved (8 tasks, not consolidated).

  v4.7: Removed Approval section — approval gate now lives in research brief.
  Research brief = approval gate. Research plan = execution doc.

  v4.6 Changes (Design Language Translation):
  - Translated locked design from docs/design-references/research_plan_reference.md
  - Pattern C: document-level footer only (backend buildTraceabilityFooter)
  - Modal simplified: 14 fields → 8. Removed session_duration, incentive,
    researcher_title, researcher_email, team_office, product_area (merged into
    decision_context as "business context"). Methodology changed from multi to
    single select. Start date defaults to next Monday. Lead researcher auto-fills
    from study or Slack profile.
  - AI tasks: 15 → 7. Removed octo_priorities, user_journey, clean_product_area,
    product_description, success_criteria, deliverables (static), demographics,
    next_steps, detailed_protocols, formatted_participants.
  - Output: ~292 lines → ~145 lines. Removed OCTO Priorities, User Journey,
    Success Criteria, Detailed Protocols, Implementation Plan, demographic
    sub-tables. Added Summary, Research Questions, Deliverables (methodology-
    mapped static), Approval checkboxes, Status: Draft in masthead.
  - Handler: updated extract() calls to match simplified modal. Added Slack
    profile fallback for lead_researcher.
  - Filename: research-plan-{{project_title}}-{{current_date_iso}}.md

  v4.5: Standards Polish (canonical structure, dead config removal)
  v4.4: Timeline start_date fix
  v4.0: Single task architecture (from multi-task)

output_use: |
  Generate stakeholder-ready research plans from modal input. Lean format
  focused on methodology, participants, timeline, and deliverables.
  Pattern C treatment — no findings traceability (planning document).
