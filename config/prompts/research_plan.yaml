# ═══════════════════════════════════════════════════════════
# IDENTITY
# ═══════════════════════════════════════════════════════════
id: research_plan
name: run_research_plan
label: "📋 Research Plan"
version: "v6.0"

description: |
  Transform your research concept into a stakeholder-ready execution plan.
  Lean output focused on methodology, participants, timeline, and deliverables.

author: Qori R&D
created: 2025-06-26
last_updated: 2026-05-06

# ═══════════════════════════════════════════════════════════
# CONFIGURATION
# ═══════════════════════════════════════════════════════════
input_type: structured
input_processing: direct

# ═══════════════════════════════════════════════════════════
# INPUTS
# ═══════════════════════════════════════════════════════════
input_variables:
  - project_title:
      type: "text"
      required: true
  - decision_context:
      type: "textarea"
      required: true
  - research_goal:
      type: "textarea"
      required: true
  - methodology:
      type: "select"
      required: true
  - target_participants:
      type: "textarea"
      required: true
  - participant_count:
      type: "select"
      required: true
  - start_date:
      type: "date"
      required: true
  - timeline_preference:
      type: "radio"
      required: true
  - lead_researcher:
      type: "text"
      required: true

# ═══════════════════════════════════════════════════════════
# CASCADE CONTRACT
# ═══════════════════════════════════════════════════════════
consumes:
  # Commitments from brief — plan MUST honor these
  - key: research_objectives
    source: research_brief
    required: true
    inject_as: commitment
    description: "Approved objectives — plan operationalizes these"
  - key: research_questions
    source: research_brief
    required: true
    inject_as: commitment
    description: "Approved questions — plan designs tasks to answer these"
  - key: methodology_selection
    source: research_brief
    required: true
    inject_as: commitment
    description: "Approved method — plan details the execution"
  - key: target_barriers
    source: research_brief
    required: true
    inject_as: grounding
    description: "Barriers to test — grounds task design and risk assessment"
  - key: participant_criteria
    source: research_brief
    required: true
    inject_as: commitment
    description: "Who to recruit — plan specifies recruitment to match"
  - key: participant_approach
    source: research_brief
    required: false
    inject_as: commitment
    description: "Composition and count from brief"
  # Context from brief
  - key: business_context
    source: research_brief
    required: false
    inject_as: context
    description: "Problem framing from brief"
  # Constraints from brief — plan must work within these
  - key: out_of_scope
    source: research_brief
    required: false
    inject_as: constraint
    description: "What research won't cover — plan must not exceed"
  - key: timeline_preference
    source: research_brief
    required: false
    inject_as: constraint
    description: "Standard/accelerated/extended — constrains phase date calculation"
  - key: start_date
    source: research_brief
    required: false
    inject_as: constraint
    description: "When planning begins — constrains phase dates"
  - key: decision_deadline
    source: research_brief
    required: false
    inject_as: constraint
    description: "Hard deadline for findings — plan must deliver before this"
  - key: budget
    source: research_brief
    required: false
    inject_as: constraint
    description: "Budget envelope from brief — plan must not exceed"

emits:
  - key: study_timeline
    pool: false
    pool_strategy: replace
    extraction_model: sonnet
    schema:
      type: array
      items:
        $ref: schemas/study_timeline.yaml
    extract_from: "ALL timeline phases — extract EVERY phase as a separate array item"
  - key: risks
    pool: false
    pool_strategy: replace
    extraction_model: sonnet
    schema:
      type: array
      items:
        $ref: schemas/study_risk.yaml
    extract_from: "ALL risks — extract EVERY risk as a separate array item"
  - key: deliverables
    pool: false
    pool_strategy: replace
    extraction_model: sonnet
    schema:
      type: array
      items:
        $ref: schemas/study_deliverable.yaml
    extract_from: "ALL deliverables — extract EVERY deliverable as a separate array item"

# ═══════════════════════════════════════════════════════════
# AI GENERATION
# ═══════════════════════════════════════════════════════════
ai_generation_tasks:
  - task_id: "plan_complete"
    prompt: |
      You are generating a complete research execution plan. This plan
      operationalizes an approved research brief into actionable steps.

      ============================================================
      CRITICAL RULES
      ============================================================

      1. GENERATE ALL SECTIONS. Output the COMPLETE plan in one pass.
         Do NOT ask for more information. Do NOT output meta-responses
         like "I'd be happy to help" or "Could you please provide..."
      2. Use markdown dash (-) for bullets, never Unicode bullets (•).
      3. Do not wrap text in quotes. Use display-friendly dates (Month DD, YYYY).
      4. Do NOT invent team names. Use generic categories only:
         Design, Engineering, Accessibility, Product, Content, Research.

      ============================================================
      RESEARCHER INPUT (from modal)
      ============================================================

      Study: {{project_title}}
      Context: {{decision_context}}
      Goal: {{research_goal}}
      Method: {{methodology}}
      Participants: {{participant_count}} — {{target_participants}}
      Start date: {{start_date}}
      Timeline preference: {{timeline_preference}}
      Lead researcher: {{lead_researcher}}

      {% if upstream_research_objectives %}
      ============================================================
      CASCADE — BRIEF COMMITMENTS (binding)
      ============================================================

      The research brief has been approved. This plan MUST operationalize
      these commitments. Do not deviate from the approved scope.

      APPROVED OBJECTIVES:
      {{upstream_research_objectives}}

      APPROVED RESEARCH QUESTIONS:
      {{upstream_research_questions}}

      APPROVED METHOD: {{upstream_methodology_selection}}

      TARGET BARRIERS (plan must design tasks to test these):
      {{upstream_target_barriers}}

      APPROVED PARTICIPANT CRITERIA:
      {{upstream_participant_criteria}}

      {% if upstream_participant_approach %}
      APPROVED APPROACH: {{upstream_participant_approach}}
      {% endif %}

      {% if upstream_business_context %}
      BUSINESS CONTEXT: {{upstream_business_context}}
      {% endif %}

      ============================================================
      CASCADE — CONSTRAINTS (hard envelopes)
      ============================================================

      {% if upstream_decision_deadline %}
      DEADLINE: {{upstream_decision_deadline}} — all phases must complete before this.
      {% endif %}

      {% if upstream_budget %}
      BUDGET: {{upstream_budget}} — plan costs must fit within this.
      {% endif %}

      {% if upstream_out_of_scope %}
      OUT OF SCOPE: {{upstream_out_of_scope}} — plan must not exceed these boundaries.
      {% endif %}

      {% if upstream_timeline_preference %}
      TIMELINE PREFERENCE: {{upstream_timeline_preference}}
      {% endif %}
      {% endif %}

      ============================================================
      OUTPUT FORMAT — GENERATE ALL SECTIONS BELOW
      ============================================================

      ## Summary

      [2-3 sentences: what the study will do, how many participants and what
      method, and what decision the findings will inform. If brief commitments
      exist above, reference them as the approved scope being operationalized.]

      | | |
      |---|---|
      | **Method** | {{methodology}} |
      | **Participants** | {{participant_count}} |
      | **Timeline** | [X weeks, starting Month DD, YYYY — calculate from {{timeline_preference}} and {{start_date}}] |
      | **Deliverables** | Research readout, design recommendations |

      ---

      ## Background

      [3-4 sentences expanding the business context. If brief's business_context
      exists above, ground in that approved framing. Do not introduce scope
      beyond what the brief approved.]

      ---

      ## Objectives

      What we aim to learn through this research:

      [If brief commitments exist above, reformulate the APPROVED OBJECTIVES as
      learning-focused verbs (Identify, Understand, Evaluate, Document). Preserve
      their intent — do not add or remove objectives.
      If no brief commitments, generate 3-4 from the research goal.]

      - **Identify** [what barriers/issues we aim to find]
      - **Understand** [what mental models/behaviors we aim to learn]
      - **Evaluate** [what we aim to assess]
      - **Document** [what we aim to record for future reference]

      ---

      ## Research questions

      [If brief commitments exist above, use the APPROVED RESEARCH QUESTIONS.
      Add brief parenthetical context about how each will be investigated via
      {{methodology}}. Preserve the approved questions — do not add or remove.
      If no brief commitments, generate 3-4 from the study context.]

      1. [Question] — _(investigated via [specific {{methodology}} technique])_
      2. [Question] — _(investigated via [technique])_
      3. [Question] — _(investigated via [technique])_

      ---

      ## Method

      **Approach** — [2-3 sentences: what sessions will explore, protocol, data
      collection. Be specific to {{methodology}}.]

      **Session format** — [Format, duration, setup. Note remote/in-person and
      accessibility accommodations.]

      **Data collection** — [List methods: think-aloud, screen recording,
      observer notes, post-session interviews, etc.]

      **Tasks** — [List 4-5 realistic task scenarios specific to this study.
      If target barriers exist above, design tasks that will elicit evidence
      about those barriers.]

      End with: "Detailed task scripts and discussion guide will be developed
      separately and reviewed before fielding."

      ---

      ## Participants

      **Sample size** — {{participant_count}}

      **Required composition:**

      [If APPROVED PARTICIPANT CRITERIA exists above, use it. Otherwise use
      the modal's target_participants. Format as bulleted list — each distinct
      criterion gets its own bullet.]

      - [Criterion 1]
      - [Criterion 2]

      **Recruitment** — [1-2 sentences about channels appropriate for this population]

      **Compensation** — [Standard rate, typically $50-$100 per participant for 60-90 min]

      ---

      ## Timeline

      [Calculate phase dates from {{start_date}} using {{timeline_preference}} durations:
      - standard: Planning 7d, Recruitment 10d, Fieldwork 7d, Analysis 3d, Reporting 2d
      - accelerated: Planning 2d, Recruitment 4d, Fieldwork 4d, Analysis 2d, Reporting 2d
      - extended: Planning 14d, Recruitment 14d, Fieldwork 14d, Analysis 7d, Reporting 7d

      If a decision deadline constraint exists above, compress phases to fit.
      Planning and Recruitment absorb the most compression.]

      | Phase | Dates | Duration |
      |-------|-------|---------:|
      | Planning and stakeholder alignment | [calculated] | [duration] |
      | Recruitment | [calculated] | [duration] |
      | Fieldwork (sessions) | [calculated] | [duration] |
      | Analysis | [calculated] | [duration] |
      | Reporting | [calculated] | [duration] |

      > [!NOTE]
      > Timeline begins after stakeholder approval of this plan.

      ---

      ## Deliverables

      [Select deliverables appropriate for {{methodology}}:
      - Usability Testing: Session summaries, Affinity map, Journey map, Research readout, Design recommendations
      - User Interviews: Session summaries, Affinity map, Personas, Research readout
      - Card Sorting: Card sort analysis, IA recommendations, Research readout
      - Survey Research: Survey synthesis, Research readout
      - Concept Testing: Session summaries, Concept reaction synthesis, Research readout, Design recommendations
      - Mixed Methods: Session summaries, Affinity map, Journey map, Research readout

      If brief objectives exist above, note which objective(s) each deliverable addresses.]

      - **[Deliverable]** — [description] _(addresses objective N)_

      All artifacts will be stored in the study's research folder for ongoing reference.

      ---

      ## Team and roles

      | Role | Person |
      |------|--------|
      | Lead researcher | {{lead_researcher}} |
      | Note-taker | To be assigned |
      | Observer | To be assigned |
      | Stakeholder reviewer | TBD |

      ---

      ## Risks and mitigations

      [Generate 3 study-specific risks. NOT generic project management risks.
      If target barriers exist above, at least one risk should address challenges
      testing those barriers. If deadline/budget constraints exist, address those.]

      | Risk | Likelihood | Mitigation |
      |------|:----------:|------------|
      | [Study-specific risk] | [High/Medium/Low] | [Specific mitigation] |
      | [Study-specific risk] | [High/Medium/Low] | [Specific mitigation] |
      | [Study-specific risk] | [High/Medium/Low] | [Specific mitigation] |

      Do NOT output a footer or "Generated by Qori" line — that is added automatically.

# ═══════════════════════════════════════════════════════════
# OUTPUT
# ═══════════════════════════════════════════════════════════
output_template: |
  # Research Plan: {{project_title}}

  **Study:** {{selected_study}} &nbsp; | &nbsp; **Researcher:** {{lead_researcher}} &nbsp; | &nbsp; **Date:** {{current_date}} &nbsp; | &nbsp; **Status:** Draft

  ---

  {{ai_generated.plan_complete}}

output_options:
  path: "01-planning/"
  filename: "{{selected_study}}-research-plan-{{current_date_iso}}.md"

# ═══════════════════════════════════════════════════════════
# METADATA (documentation only — not read by backend)
# ═══════════════════════════════════════════════════════════
processing_workflow:
  1. validate_modal_inputs
  2. execute_plan_complete
  3. render_output_template
  4. save_to_planning_folder

notify:
  - role: team
    action: "Research plan generated"
    channel: "{{study_channel}}"
    message: "Research plan for {{project_title}} is ready for review."

notes: |
  v6.0: Single-task architecture migration.
  - Migrated from 10 separate AI tasks to 1 consolidated "plan_complete" task.
    Eliminates 10x API calls, cascade variable fragmentation, and meta-response
    leakage. Matches architecture of brief, session_summary, affinity, persona,
    journey, readout, discussion_guide, stakeholder_synthesis.
  - All cascade variables available in single prompt context.
  - Output template simplified to masthead + {{ai_generated.plan_complete}}.
  - Anti-fabrication: generic team categories only.
  - Cascade-aware: brief commitments (objectives, questions, method, participants)
    treated as binding scope. Constraints (deadline, budget, out_of_scope) as
    hard envelopes. Tasks designed to test target barriers.

  v5.0-v5.1: Cascade-aware retrofit (superseded by v6.0 migration).

  v4.7 Changes (Lean Rewrite):
  - Research brief = approval gate. Research plan = execution doc.
  - VA-specific sections removed: OCTO Priorities, User Journey, Implementation Plan
  - Modal simplified from 15 fields to 8 with sensible defaults
  - Output collapsed from ~292 lines to ~145 lines

output_use: |
  Generate a stakeholder-ready research execution plan from an approved
  research brief. Plan operationalizes brief commitments: objectives become
  study tasks, methodology becomes execution protocol, participant criteria
  become recruitment spec, timeline fits within brief constraints.
