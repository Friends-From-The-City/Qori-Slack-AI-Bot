# ═══════════════════════════════════════════════════════════
# IDENTITY
# ═══════════════════════════════════════════════════════════
id: session_summary
name: analyze_session_notes
label: "Analyze Notes"
version: "v7.2"

description: |
  Analyze session transcript and observer notes to produce a structured
  session summary with pain points, insights, and barrier validation.
  v7.1: Verbatim system-assigned participant codes (ADR 0020). LLM must
  use {{participant_id}} exactly as provided — no guessing/inventing.
  v7.0: Interleaved Handlebars/AI — mechanical content rendered by
  template, LLM writes bounded analytical sections. Emits 5 pool
  variables (atomic nuggets, participant metadata, task completion
  records, barrier validations) consumed by all downstream synthesis
  and readout templates. Per ADR 0005/0016.

author: Qori R&D
created: 2025-10-25
last_updated: 2026-06-03

# ═══════════════════════════════════════════════════════════
# CONFIGURATION
# ═══════════════════════════════════════════════════════════
input_type: multi_source_analysis
input_processing: synthesize_notes_and_transcript

# ═══════════════════════════════════════════════════════════
# INPUTS
# ═══════════════════════════════════════════════════════════
input_variables:
  - session_id:
      type: "select"
      required: true
      label: "Session"
      placeholder: "Select a session to analyze..."
      data_source: "sessions"
      help_text: "Choose from completed sessions with notes"

  - selected_notes:
      type: "multi_select"
      required: true
      label: "Session notes to analyze"
      placeholder: "Select one or more note files..."
      data_source: "session_notes"
      help_text: "Choose all observer notes for this session"
      min_selections: 1
      max_selections: 10

  # NOTE: coded_transcript_file was removed in v7.2 (B1 cleanup).
  # The old coded-transcript workflow no longer exists — transcripts are now
  # uploaded via /qori-notes with transcript=true flag, and the handler
  # (analyzeNotesHandler.ts) provides coded_transcript_content directly.

  - participant_id:
      type: "hidden"
      derived_from: "session_id.participant_id"

  - participant_name:
      type: "hidden"
      derived_from: "session_id.participant_name"

  - session_date:
      type: "hidden"
      derived_from: "session_id.session_date"

  - study_name:
      type: "hidden"
      derived_from: "session_id.study_name"

  - notes_content:
      type: "hidden"
      derived_from: "selected_notes.content_combined"

  - coded_transcript_content:
      type: "hidden"
      # Handler-provided: analyzeNotesHandler.ts fetches transcript content
      # directly from notes marked transcript=true. No YAML derivation.

  - analyzer:
      type: "hidden"
      derived_from: "slack_user_display_name"

# ═══════════════════════════════════════════════════════════
# CASCADE CONTRACT
# ═══════════════════════════════════════════════════════════
consumes:
  - key: target_barriers
    source: research_brief
    required: false
    inject_as: grounding
    description: "Hypothesized barriers to validate against this session's observations"

  - key: research_questions
    source: research_brief
    required: false
    inject_as: context
    description: "Questions that frame what to look for in this session"

  - key: methodology_selection
    source: research_brief
    required: false
    inject_as: context
    description: "Methodology determines what observations matter and how to frame them"

emits:
  - key: atomic_nugget_core
    pool: true
    pool_strategy: append_or_replace_per_participant
    extraction_model: sonnet
    schema:
      $ref: schemas/atomic_nugget_core.yaml
    extract_from: "Findings sections, task observations, accessibility issues, key insights, pain points, what worked"

  - key: atomic_nugget_detail
    pool: true
    pool_strategy: append_or_replace_per_participant
    extraction_model: sonnet
    schema:
      $ref: schemas/atomic_nugget_detail.yaml
    extract_from: "Per-finding verbatim quotes, behavioral observations, emotional context, inferred meaning. Each detail must reference a core nugget id."

  - key: participant_metadata
    pool: true
    pool_strategy: append_or_replace_per_participant
    extraction_model: sonnet
    schema:
      $ref: schemas/participant_metadata.yaml
    extract_from: "Participant context section, session conditions"

  - key: task_completion_records
    pool: true
    pool_strategy: append_or_replace_per_participant
    extraction_model: sonnet
    schema:
      $ref: schemas/task_completion_record.yaml
    extract_from: "Task observations, completion outcomes, methodology section, recommended actions"

  - key: barrier_validations
    pool: true
    pool_strategy: append_or_replace_per_participant
    extraction_model: sonnet
    schema:
      $ref: schemas/barrier_validation.yaml
    extract_from: "Barrier validation section, findings that confirm or refute target barriers"

# ═══════════════════════════════════════════════════════════
# AI GENERATION — focused, bounded task
# ═══════════════════════════════════════════════════════════
ai_generation_tasks:

  # Single analysis_body task — Summary + participant context + pain points
  # + what worked + key insights + recommended actions + barrier validation
  # (conditional) + methodology prose.
  # Kept as one task because of strong cross-section coherence: summary
  # callout references pain points, insights reference pain points,
  # recommended actions address pain points by number, barrier validation
  # cross-references findings, methodology counts sources.
  - task_id: "analysis_body"
    prompt: |
      You are analyzing a UX research session to create a comprehensive session summary.

      SESSION METADATA
      - Participant ID: {{participant_id}}
      - Study Name: {{study_name}}
      - Session Date: {{session_date}}

      {% if upstream_target_barriers %}
      ============================================================
      UPSTREAM CONTEXT (from research brief — use to validate)
      ============================================================

      TARGET BARRIERS TO VALIDATE:
      {{upstream_target_barriers}}

      {% if upstream_research_questions %}
      RESEARCH QUESTIONS TO ADDRESS:
      {{upstream_research_questions}}
      {% endif %}

      {% if upstream_methodology_selection %}
      METHODOLOGY:
      {{upstream_methodology_selection}}
      {% endif %}

      ============================================================
      CASCADE-AWARE GENERATION
      ============================================================

      When upstream brief variables are present, your job is to:

      1. REFERENCE TARGET BARRIERS BY ID. When an observation validates
         or refutes a target_barrier from the brief, mark it inline with
         the barrier's stable ID: [TB-001], [TB-002], etc. (each barrier
         in the upstream data has an id field like TB-001). In the Barrier
         Validation section, summarize which barriers were confirmed,
         refuted, or not addressed for this participant.

      2. REFERENCE RESEARCH QUESTIONS BY ID. When an observation
         addresses a research_question from the brief, mark it inline
         with the question's stable ID: [RQ-001], [RQ-002], etc.

      3. USE METHODOLOGY TO FRAME OBSERVATIONS. If method is "card sorting,"
         frame observations in card sorting language (groupings, labels,
         spatial relationships). If "usability testing," frame in task
         language (success, failure, friction, recovery). If "interviews,"
         frame in narrative language (themes, mental models, motivations).

      4. CITE VERBATIM QUOTES. Use the exact participant language when
         capturing observations. Mark quotes with the [verbatim] tag
         in extraction-friendly format.

      5. USE ONLY OBSERVATIONS FROM THE SESSION. Do not infer or fabricate.
         If an observation isn't in the transcript or notes, do not include it.
      {% endif %}

      PRIMARY SOURCE - Session Transcript:
      {{coded_transcript_content}}

      SUPPORTING SOURCES - Observer Notes (may be empty):
      {{notes_content}}

      ============================================================
      CRITICAL GROUNDING RULES
      ============================================================

      You are an EXTRACTOR and SYNTHESIZER. Your job is to find what EXISTS in the sources and make reasonable inferences from participant behavior.

      ABSOLUTE REQUIREMENTS:
      1. Pain Points and Quotes must be EXPLICITLY stated in sources
      2. Opportunities can be INFERRED from participant struggles and requests
      3. Insights can be INFERRED from observed behavior and statements
      4. Every finding must trace back to specific source evidence
      5. When in doubt about Pain Points or Quotes, OMIT
      6. When in doubt about Opportunities or Insights, INCLUDE with clear evidence link
      7. PARTICIPANT IDENTIFIER RULES:
         - The system has assigned this participant the code: {{participant_id}}
         - Use this EXACT code ({{participant_id}}) throughout your output — do NOT invent or modify it
         - Replace any real names in the transcript with {{participant_id}}
         - "the participant" is also acceptable for variety
         - Nugget IDs must follow format: nugget-{{participant_id}}-NNN (e.g., nugget-PT-003-001)

      QUOTE RULES:
      - ONLY use quotes that appear VERBATIM in the sources with quotation marks
      - Include timestamps if present
      - NEVER fabricate or paraphrase quotes

      PARTICIPANT CONTEXT RULES:
      Participant context fields record ONLY what the participant explicitly
      stated or what was directly observed as session mechanics (assistive
      technology in use, device). NEVER infer demographic, medical, disability,
      or identity attributes from speech patterns, task performance, or
      behavioral evidence. When a field's information was not explicitly
      stated: write "Not stated in session." When in doubt, omit.

      CONFIDENCE ASSESSMENT (required for each pain point):
      Assess evidence strength using three levels. Always include a parenthetical
      explanation of WHY you assigned that level:
      - Strong: Verbatim quote + observed behavior + clear task impact
        Example: Strong (verbatim quote + observed three task attempts + complete abandonment)
      - Moderate: Single observation but consistent with broader pattern
        Example: Moderate (single observation, but consistent with broader VoiceOver labeling patterns)
      - Limited: Observer interpretation without direct participant statement
        Example: Limited (observer interpretation, no direct quote)

      ============================================================
      GENERATE THESE SECTIONS
      ============================================================

      Output ALL sections below. Use ## headings. Do not stop early.

      ## Summary

      [2-3 sentence narrative synthesis of this participant's session. Reference: who they are (accessibility needs, usage pattern), what the session surfaced (number of pain points, key pattern), and the most significant behavioral observation. Ground every sentence in THIS session's data.]

      > [!IMPORTANT]
      > **Most striking observation:** [Single most notable finding — the one thing a stakeholder should know from this session]

      ---

      ## Participant context

      **Background** — [Explicitly stated background relevant to the study (e.g., service era, prior experience with the product)]

      **App usage** — [Frequency, primary tasks, duration of use]

      **Assistive technology** — [Assistive technology observed in use, or accessibility needs the participant explicitly stated, or "None noted"]

      **Calling pattern** — [If relevant: how often they call VA support instead of using the app]

      [1-2 sentence narrative that frames their feedback — what lens they bring to the experience]

      If insufficient context available, note: *Limited participant context available in sources.*

      ---

      ## Pain points

      Extract the TOP 3-5 most critical issues the participant experienced.

      Look for:
      - Explicit frustration statements
      - Task failures or struggles
      - Confusion expressed by participant
      - Accessibility barriers encountered
      - Workarounds participant had to use

      ### 01 &nbsp;&nbsp; [Pain Point Title — Specific and Descriptive]

      [1-2 sentence description of what happened and its impact on the participant's task]

      > "[Verbatim quote from sources]"
      > — {{participant_id}}, [timestamp if available]

      **Severity** — Critical &nbsp;|&nbsp; **Confidence** — Strong ([parenthetical reasoning])

      ---

      ### 02 &nbsp;&nbsp; [Pain Point Title]

      [Same format as 01. Include description, quote, severity + confidence metadata line.]

      ---

      [Continue for each pain point. Typically 3-5 pain points. Each follows the exact same format.]

      If no pain points found, output: *No clear pain points were documented in the available sources.*

      ---

      ## What worked

      Identify 1-3 aspects of the experience that worked smoothly for the participant. Each gets its own subsection with a supporting quote.

      ### [What Worked — Descriptive Title]

      [1-2 sentence description of what worked and why it matters]

      > "[Supporting quote from sources]"
      > — {{participant_id}}, [timestamp]

      ### [Another Success]

      [Description + quote]

      If no positive moments identified, output: *No explicit positive feedback was captured in the available sources.*

      ---

      ## Key insights

      These insights emerged from observing {{participant_id}}'s session and connect specific behaviors to broader patterns worth investigating across the participant pool.

      Identify 2-4 DIVERSE insights about user behavior, mental models, or patterns.

      IMPORTANT:
      - Insights are about the USER, not the interface
      - Each insight should reveal something DIFFERENT
      - Include at least one insight about what WORKED WELL if present in sources

      ### [Insight Title — Descriptive, Focusing on the Behavioral Pattern]

      [1-2 sentence description of the insight and its design implications]

      ### [Another Insight]

      [Description. Include a supporting quote if one exists in the sources:]

      > "[Quote if relevant]"
      > — {{participant_id}}, [timestamp]

      [Continue for each insight. Typically 2-4.]

      If genuinely no insights can be inferred, output: *No key insights were identified in the available sources.*

      ---

      ## Recommended actions

      | Priority | Action | Addresses | Effort |
      |:--------:|--------|-----------|:------:|
      | 1 | [Specific, actionable recommendation] | Pain point 01 | [High/Medium/Low] |
      | 2 | [Action] | Pain point 02 | [Effort] |
      | 3 | [Action] | Pain point 03 | [Effort] |

      Requirements:
      - Each action must address a specific pain point by number
      - Make actions specific and achievable
      - Priority as numbers (1 = most urgent), effort as text labels

      If insufficient findings, output: *Additional session data needed to generate specific recommendations.*

      ---

      {% if upstream_target_barriers %}
      ## Barrier validation

      Summarize which target barriers from the research brief were confirmed, refuted, or not addressed in this session.

      | Target barrier | Status | Evidence |
      |----------------|--------|----------|
      | TB-001: [barrier text from brief] | Confirmed / Refuted / Not addressed | [observation summary with quote ref] |
      | TB-002: [barrier text] | [status] | [evidence] |

      **Confidence** — [Strong/Moderate/Limited] ([parenthetical reasoning for overall barrier validation confidence])

      If no barriers were testable in this session: *Session tasks did not address target barriers directly. Cross-reference with subsequent sessions.*

      ---

      {% endif %}
      ## Methodology

      **Session format** — [Moderated/unmoderated, duration, setup details from sources]

      **Tasks attempted** — [List tasks the participant was asked to complete]

      **Sources analyzed** — Session transcript (primary source for verbatim quotes and behavioral data) and [X] observer notes files

      **Analysis approach** — Pain points and quotes are direct extractions from the session transcript; opportunities and insights are reasoned inferences from behavioral patterns observed during the session.

      **Limitations** — [Single participant caveat. Note source completeness. Cross-reference recommendation.]

      OUTPUT BOUNDARIES: Do not generate the document title, masthead,
      references list, upstream context section, sources appendix,
      validity checklist, or cascade summary. The template handles
      those sections.
      USE ## headings for each section (## Summary, ## Pain points, etc.).

      Before outputting, verify:
      - Every pain point has source evidence and a Confidence level with reasoning
      - Every quote is verbatim from sources with timestamp if available
      - Opportunities are reasonable inferences from struggles/requests
      - Insights reveal something about the USER, not just the interface
      - Actions link to specific pain points by number
      - Summary narrative references specific findings from THIS session
      Do NOT output a footer or "Generated by Qori" line — that is added automatically.

# ═══════════════════════════════════════════════════════════
# OUTPUT — interleaved Handlebars + AI prose
# ═══════════════════════════════════════════════════════════
output_template: |
  # Session Summary: {{participant_id}}

  **Study:** {{study_name}} &nbsp; | &nbsp; **Analyzer:** {{analyzer}} &nbsp; | &nbsp; **Date:** {{session_date}}

  ---

  {{ai_generated.analysis_body}}

  ---

  ### References

  - Nielsen Norman Group -- Moderated usability testing methodology
  - Krug, S. -- *Rocket Surgery Made Easy* (2010)
  - Hall, E. -- *Just Enough Research* (2nd ed., 2019)
  - W3C Web Content Accessibility Guidelines (WCAG) 2.2

  ---

  {{#if upstream_target_barriers}}
  <details>
  <summary><strong>Upstream context</strong></summary>

  This session summary was analyzed against upstream inputs from the research brief.

  | Source | Used for |
  |--------|----------|
  | research_brief ({{study_name}}) | Target barriers [TB-001..n], research questions [RQ-001..n], methodology context |

  Citation markers throughout: [TB-XXX] = target barriers, [RQ-XXX] = research questions.

  </details>
  {{/if}}

  <details>
  <summary><strong>Sources analyzed</strong></summary>

  | Source | Location | Status |
  |--------|----------|--------|
  | {{participant_id}} transcript | 03-fieldwork/transcripts/ | Analyzed |
  | Observer notes | 03-fieldwork/session-notes/ | Analyzed |

  Only sources that were actually analyzed are listed. The transcript is the primary source; observer notes are supporting context when available.

  </details>

  <details>
  <summary><strong>Validity checklist</strong></summary>

  | Criterion | Verified |
  |-----------|:--------:|
  | All quotes verbatim from session transcript | |
  | Pain points grounded in specific observed behaviors | |
  | Inferences (insights, opportunities) traced to evidence | |
  | Confidence levels declared per pain point | |
  | Source documents listed in methodology | |

  </details>

  ---

  <details>
  <summary><strong>Research provenance</strong></summary>

  This session summary emits pool variables consumed by downstream synthesis templates.

  | Variable | Pool | Strategy | Description |
  |----------|:----:|----------|-------------|
  | atomic_nugget_core | Yes | append_or_replace_per_participant | Core observation fields (6 required) |
  | atomic_nugget_detail | Yes | append_or_replace_per_participant | Enrichment fields linked by id (10 nullable) |
  | participant_metadata | Yes | append_or_replace_per_participant | Demographics and session context |
  | task_completion_records | Yes | append_or_replace_per_participant | Per-task success/failure records |
  | barrier_validations | Yes | append_or_replace_per_participant | Target barrier confirmation/refutation |

  **Consumed from upstream:**

  | Variable | Source | Role |
  |----------|--------|------|
  | target_barriers | research_brief | Barrier validation grounding |
  | research_questions | research_brief | Question framing |
  | methodology_selection | research_brief | Observation framing |

  </details>

output_options:
  path: "03-fieldwork/sessions/"
  filename: "{{study_name}}--{{participant_id}}--session-summary--{{__derivation_fp}}.md"

# ═══════════════════════════════════════════════════════════
# METADATA
# ═══════════════════════════════════════════════════════════
notes: |
  v7.0: Interleaved Handlebars/AI architecture (ADR 0005/0016 pattern).
  - Monolithic analyze_and_extract task replaced by analysis_body task.
  - Handlebars renders: masthead, references (static), upstream context
    (toggle, conditional), sources appendix (toggle), validity checklist
    (toggle), declared inputs (static declaration table).
  - Barrier validation conditional stays in AI prompt (Option b from delta —
    avoids wasted generation when no upstream barriers exist).
  - Methodology prose stays in AI task (varies per session — format, tasks,
    source count, limitations). References moved to Handlebars (static).
  - OUTPUT BOUNDARIES instruction added.
  - Dead metadata sections removed (slack_command, external_data_sources,
    slack_ui, processing_rules, validation_rules, quality_assurance, notify —
    all documentation-only, never read by backend. Handler is source of truth).
  - Validity checklist checkmarks removed (reviewer prompts, not auto-populated).
  - Cascade summary added (standard v7.0 — 5 emits + 3 consumes).
  - Quality checks moved to prompt-only instructions (no longer in output structure).
  - All 5 emit schemas and 3 consumes unchanged from v2.0.
  - No handler changes needed (analyzeNotesHandler.ts independent of prompt structure).

  v2.0: Cascade-aware retrofit (superseded by v7.0).
  v1.6: Design language translation.
  v1.5: Standards polish.
  v1.4: GitHub-styled output with collapsible sections.
