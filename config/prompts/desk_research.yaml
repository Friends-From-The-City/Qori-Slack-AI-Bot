# ═══════════════════════════════════════════════════════════
# IDENTITY
# ═══════════════════════════════════════════════════════════
id: desk_research
name: run_desk_research
label: "Desk Research"
version: v7.1

description: |
  Analyze uploaded research documents and generate a synthesis with key
  themes, findings, and knowledge gaps.
  v7.0: Interleaved Handlebars/AI architecture — document inventory
  rendered mechanically from handler data, LLM writes analytical prose.
  Per ADR 0005/0016 pattern.

author: Qori R&D
created: 2025-08-27
last_updated: 2026-08-04

# ═══════════════════════════════════════════════════════════
# CONFIGURATION
# ═══════════════════════════════════════════════════════════
input_type: structured
input_processing: direct
discovery_scope: true

# ═══════════════════════════════════════════════════════════
# INPUTS
# ═══════════════════════════════════════════════════════════
input_variables:
  - selected_study:
      type: "select"
      required: true
      description: "Study folder name"

  - topic:
      type: "text"
      required: true
      placeholder: "e.g., Veteran telehealth adoption barriers"
      description: "Researcher-provided topic — slugified for filename and variable store path"

  - research_topic:
      type: "text"
      required: false
      placeholder: "e.g., Veteran telehealth adoption barriers"
      description: "Optional focus area. Defaults to topic if not provided."
      default: "{{topic}}"

  - project_problem_statement:
      type: "text"
      required: false
      description: "Project-level research problem. Knowledge gaps are derived against this."

  - source_intent:
      type: "textarea"
      required: true
      placeholder: "e.g., What barriers do Veterans face with claim status tracking?"
      description: "What the researcher needs this source to tell them — how it relates to the project problem."

  - description:
      type: "textarea"
      required: false
      placeholder: "e.g., Competitive analysis from Q3, industry reports on telehealth"
      description: "Legacy field — use source_intent instead"

  - document_content:
      type: "textarea"
      required: true
      description: "Extracted text from uploaded documents (provided by backend)"
      validation:
        min_length: 100
        error_message: "Document content is required. Please upload documents."

# ═══════════════════════════════════════════════════════════
# AI GENERATION — focused, bounded tasks
# ═══════════════════════════════════════════════════════════
ai_generation_tasks:

  # Document analysis: per-document summaries and relevance (analytical, not inventory)
  # File names, types, and count are rendered mechanically by Handlebars.
  # This task adds the analytical layer: what each document contributes.
  - task_id: "document_analysis"
    prompt: |
      Review the following document content and provide analytical summaries.

      **Study:** {{selected_study}}
      **Research Topic:** {{effective_topic}}

      **Documents uploaded:** {{document_count}} files
      **File names:** {{document_names}}

      **Document Content:**
      ---BEGIN CONTENT---
      {{document_content}}
      ---END CONTENT---

      CRITICAL RULES:
      - If the content between BEGIN/END markers is empty, respond ONLY with:
        "> **No documents provided.** Please upload research documents and try again."
      - ONLY analyze documents explicitly present in the provided content
      - Do NOT invent document titles, authors, dates, or sources
      - If a field is not stated in the content, write "Not specified"

      For EACH document, output:

      **[Document Title or Filename]**

      | Attribute | Value |
      |:----------|:------|
      | **Source** | [Author/Organization or "Not specified"] |
      | **Date** | [Publication date or "Not specified"] |
      | **Type** | [Report / Study / Survey / Brief / Article / Guide] |
      | **Relevance** | [High / Medium / Low] to {{effective_topic}} |

      [2-3 sentence description of what this document covers and its key contribution]

      ---

      OUTPUT BOUNDARIES: Do not generate section headings, sub-headings,
      citation appendices, reference lists, horizontal rules, or markdown
      section dividers beyond the per-document separators above. The template
      handles all document structure.

  # Executive summary
  - task_id: "executive_summary"
    prompt: |
      Create a publication-quality executive summary of the desk research.

      **Study:** {{selected_study}}
      **Research Topic:** {{effective_topic}}

      **Document Content:**
      ---BEGIN CONTENT---
      {{document_content}}
      ---END CONTENT---

      CRITICAL ANTI-HALLUCINATION RULES:
      1. If content is empty, respond: "> **No documents provided.** Unable to generate executive summary."
      2. EVERY finding must be directly quoted or paraphrased from the provided content
      3. Do NOT invent statistics, percentages, or data points
      4. Do NOT cite authors or studies not mentioned in the content
      5. If content doesn't address research questions, state this explicitly

      Structure as:

      **Overview:** 2-3 sentences on what this research covers and its significance for {{effective_topic}}. Ground in actual document content.

      **Key Findings:** Present 3-5 major findings. For each:

      > **Finding N: [Descriptive title]**
      >
      > [1-2 sentence explanation with specific data if available]
      >
      > *Source: [Document name]*

      **Strategic Implications:** 2-3 sentences on what these findings mean for decision-making. Only draw from actual findings.

      <details>
      <summary><strong>Confidence Assessment</strong></summary>

      | Aspect | Confidence | Rationale |
      |:-------|:-----------|:----------|
      | Evidence quality | [High/Medium/Low] | [Brief explanation] |
      | Coverage of topic | [High/Medium/Low] | [How well documents address questions] |
      | Actionability | [High/Medium/Low] | [Whether findings translate to actions] |

      </details>

      OUTPUT BOUNDARIES: Do not generate section headings, sub-headings,
      citation appendices, reference lists, horizontal rules, or markdown
      section dividers. The template handles all document structure.
      Output only the prose content for this section.

  # Key themes
  - task_id: "themes"
    prompt: |
      Identify and analyze major themes across the research documents.

      **Research Topic:** {{effective_topic}}

      **Document Content:**
      ---BEGIN CONTENT---
      {{document_content}}
      ---END CONTENT---

      CRITICAL ANTI-HALLUCINATION RULES:
      1. If content is empty, respond: "> **No documents provided.** Unable to identify themes."
      2. EVERY theme must be grounded in specific text from provided documents
      3. Do NOT create themes based on what you think should be covered
      4. QUOTE directly from documents when providing evidence
      5. If you can only identify 1-2 themes, that's fine - do not pad
      6. RECOMMENDATIONS ARE NOT EVIDENCE. A source's recommendation (e.g.,
         "Add plain-language descriptions") may be reported as what the source
         recommends, but it cannot be quoted as evidence FOR a theme. Evidence
         must be observational or empirical, not prescriptive.

      For each theme:

      **Theme N: [Theme Title]**

      *What the Research Shows:* 2-3 sentences synthesizing findings. Be specific.

      > "[Direct quote from document]"
      > — *[Document name/source]*

      > "[Direct quote from document 2]"
      > — *[Document name/source]*

      *Why this matters:* 1-2 sentences on implications for research and design decisions.

      *Confidence:* `[HIGH]` / `[MEDIUM]` / `[LOW]` — one sentence explaining.

      ---

      Requirements:
      - Only include themes with at least 2 pieces of direct evidence
      - Maximum 5 themes
      - Number themes sequentially starting at 1 with no gaps (1, 2, 3... not 1, 2, 4)
      - Each theme must have clear implications stated

      OUTPUT BOUNDARIES: Do not generate section headings, sub-headings,
      citation appendices, reference lists, horizontal rules, or markdown
      section dividers beyond the per-theme separators above. The template
      handles all document structure.

  # Knowledge gaps — derived against the project problem statement
  - task_id: "knowledge_gaps_prose"
    skip_when: "not project_problem_statement"
    skip_output: |
      > **Knowledge gaps require a project problem statement.**
      >
      > Run `/qori-start` to set a problem statement for this project, then re-run discovery.
    prompt: |
      Identify knowledge gaps from the desk research.

      ============================================================
      DERIVATION RULE
      ============================================================

      A knowledge gap is: A question that the stated research problem requires
      answering, which THIS SOURCE cannot answer.

      **Research Problem (from project):**
      {{project_problem_statement}}

      **Source Intent (what researcher needs from this source):**
      {{source_intent}}

      **Research Topic:** {{effective_topic}}

      **Document Content:**
      ---BEGIN CONTENT---
      {{document_content}}
      ---END CONTENT---

      ============================================================
      RULES
      ============================================================

      1. EVERY gap must be a question that the research problem REQUIRES answering
      2. For each gap, state what the source DOES establish on that question, then where it stops
      3. Do NOT include:
         - Questions the source answers (partially or fully)
         - Questions unrelated to the stated problem
         - Generic research-practice observations
         - Product actions, feature changes, or design implementations
      4. If the documents are comprehensive relative to the problem:
         > The documents provide strong coverage of the research problem. One area for further investigation: [specific gap].

      ============================================================
      OUTPUT FORMAT
      ============================================================

      For each gap (3-5 maximum):

      **Gap N: [Question the problem requires answering]**

      | What this source establishes | Where it stops |
      |:-----------------------------|:---------------|
      | [Specific evidence from documents] | [Specific limitation] |

      **Suggested research approach:** [Method to investigate — e.g., card sorting, usability testing, interviews]

      ---

      OUTPUT BOUNDARIES: Do not generate section headings, sub-headings,
      citation appendices, reference lists, horizontal rules, or markdown
      section dividers beyond the per-gap separators above. The template
      handles all document structure.

  # Sources
  - task_id: "sources"
    model: "claude-haiku-4-5-20251001"
    prompt: |
      Create a professional reference list for the desk research.

      **Document Content:**
      ---BEGIN CONTENT---
      {{document_content}}
      ---END CONTENT---

      CRITICAL ANTI-HALLUCINATION RULES:
      1. If content is empty, respond: "> **No documents provided.** No sources to list."
      2. ONLY list sources explicitly named or identifiable in content
      3. Do NOT invent titles, authors, organizations, or dates
      4. If author/date not stated, write "Not specified"

      Format as a single details block per source (no redundant table):

      <details>
      <summary><strong>N. [Document Title]</strong> — [Author/Org], [Date]</summary>

      - **Document Type:** [Report / Study / Survey / etc.]
      - **Key Contribution:** [2-3 sentences on what this source establishes]
      - **Limitations:** [Any noted limitations or gaps]

      </details>

      If no distinct sources identifiable:
      > **Source Attribution:** The analyzed content did not include clear source attribution. Findings are derived from the provided document text.

      OUTPUT BOUNDARIES: Do not generate section headings or markdown
      section dividers. The template handles all document structure.

# ═══════════════════════════════════════════════════════════
# OUTPUT — interleaved Handlebars + AI prose
# ═══════════════════════════════════════════════════════════
output_template: |
  # Desk Research Report: {{effective_topic}}

  **Study:** {{selected_study}} &nbsp; | &nbsp; **Topic:** {{effective_topic}} &nbsp; | &nbsp; **Documents:** {{document_count}} &nbsp; | &nbsp; **Date:** {{current_date}}

  ---

  {{#if project_problem_statement}}
  **Research problem:** {{project_problem_statement}}

  **This document contributes:** {{source_intent}}
  {{else}}
  > [!WARNING]
  > No project problem statement set. Knowledge gaps cannot be derived without a stated research problem.
  > Run `/qori-start` to set one.
  {{/if}}

  ---

  > [!NOTE]
  > This analysis is based solely on the documents provided. All findings, themes, and knowledge gaps are derived from the uploaded content.

  ---

  ## Executive Summary

  {{ai_generated.executive_summary}}

  ---

  ## Key Themes

  {{ai_generated.themes}}

  ---

  ## Knowledge Gaps and Research Implications

  {{ai_generated.knowledge_gaps_prose}}

  ---

  <details>
  <summary><strong>Methodology</strong></summary>

  This desk research synthesis uses thematic analysis with source triangulation.
  Findings are corroborated across multiple documents where possible, with
  confidence ratings reflecting evidence strength. Knowledge gaps are derived
  against the stated research problem, not generated speculatively.

  </details>

  ---

  ## Sources and Documents

  **Documents analyzed:** {{document_count}}

  {{#each document_names}}
  - **{{this}}** ({{lookup ../document_types @index}})
  {{/each}}

  <details>
  <summary><strong>Document details</strong> — source, relevance, and summaries</summary>

  {{ai_generated.document_analysis}}

  </details>

  ### Source Attribution

  {{ai_generated.sources}}

  ---

  <details>
  <summary><strong>Research provenance</strong></summary>

  This desk research emits discovery variables for downstream templates.

  | Variable | Description |
  |----------|-------------|
  | discovered_barriers | Barriers, challenges, pain points from the research |
  | discovered_metrics | Quantitative findings — percentages, scores, rates |
  | discovered_journeys | User task flow patterns — success and failure paths |
  | methodology_recommendations | Suggested research methods from the literature |
  | knowledge_gaps | Areas the research could not answer |
  | source_artifacts | Document metadata for provenance tracking |

  </details>

output_options:
  filename: "{{project_slug}}--desk-research--{{__derivation_fp}}.md"
  path: "{{project_slug}}/00-discovery/"

  delivery:
    github:
      enabled: true
      commit_message: "Add desk research: {{effective_topic}}"

    slack:
      enabled: true
      channel: "{{study_channel}}"
      message: |
        **Desk Research Complete**

        **Study:** {{selected_study}}
        **Topic:** {{effective_topic}}
        **Documents Analyzed:** {{document_count}}

        View the full analysis for findings, evidence, and knowledge gaps.

      actions:
        - text: "View Full Report"
          style: "primary"
          url: "{{github_file_url}}"
        - text: "View Recommendations"
          style: "secondary"
          url: "{{github_file_url}}#-knowledge-gaps-and-research-implications"

# ═══════════════════════════════════════════════════════════
# METADATA
# ═══════════════════════════════════════════════════════════
emits:
  - key: discovered_barriers
    pool: true
    pool_strategy: append
    extraction_model: sonnet
    schema:
      type: array
      items:
        $ref: schemas/discovered_barrier.yaml
    extract_from: |
      DERIVATION RULE — discovered_barriers

      definition: An obstacle that prevented or measurably degraded task
        completion, evidenced by a specific observation in the source.

      evidence_requirement: Must cite a specific observation showing the
        barrier blocked or degraded a task. Include: what was attempted,
        what happened, what the consequence was.

      does_not_qualify:
        - Dissatisfaction without a blocked or degraded task
        - Recommendations (even if they imply a problem)
        - Inference from absence of evidence
        - Complaints without task context

      Assign sequential IDs (barrier-001).
      Include: title, summary, magnitude with numbers, evidence as array of
      supporting quotes/metrics, affected_population, source_document name,
      confidence level.

      barrier_categories (REQUIRED, array of 1+ values):
      Classify each barrier by research-method category. Use ALL that apply:
        - ia: navigation, findability, mental models, labeling
        - accessibility: assistive tech, WCAG, screen readers, motor/vision
        - performance: speed, latency, load times, responsiveness
        - content: readability, comprehension, terminology, tone
        - task-flow: task completion, workflow steps, error recovery, forms
        - cognitive: mental load, decision complexity, memory demands
        - other: ONLY if no category genuinely applies

  - key: discovered_metrics
    pool: true
    pool_strategy: append
    schema:
      type: array
      items:
        $ref: schemas/discovered_metric.yaml
    extract_from: "All quantitative findings — percentages, scores, counts, rates, comparisons. Assign sequential IDs (metric-001). Include metric_name, value, context explaining what it means, baseline_or_target for comparisons, source_document name."

  - key: discovered_journeys
    pool: true
    pool_strategy: append
    schema:
      type: array
      items:
        $ref: schemas/discovered_journey.yaml
    extract_from: "User journey patterns and task flows. Assign sequential IDs (journey-001). Include success_pattern and failure_pattern where contrasts exist, completion_rate and satisfaction scores when available."

  - key: methodology_recommendations
    pool: true
    pool_strategy: append
    schema:
      type: array
      items:
        $ref: schemas/methodology_recommendation.yaml
    extract_from: "Knowledge Gaps and Research Implications section — any suggested research methods. Assign sequential IDs (method-001). Capture what the method addresses and why it's recommended."

  - key: knowledge_gaps
    pool: true
    pool_strategy: append
    schema:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
          gap:
            type: string
          why_matters:
            type: string
            nullable: true
          suggested_resolution:
            type: string
            nullable: true
          source_document:
            type: string
    extract_from: "Knowledge Gaps and Research Implications section, Confidence Assessment low-confidence areas. Assign sequential IDs (gap-001). Include why the gap matters and suggested resolution method."

  - key: source_artifacts
    pool: true
    pool_strategy: append
    schema:
      type: array
      items:
        type: object
        properties:
          title:
            type: string
          source_org:
            type: string
          date:
            type: string
          type:
            type: string
            nullable: true
          contribution:
            type: string
            nullable: true
    extract_from: "Documents Analyzed section, References section. Include source organization, document type, and key contribution."

derived_variables:
  - effective_topic: "{{research_topic | default: topic}}"
  - topic_slug: "{{topic | slugify}}"

validation_rules:
  - rule: "document_content_not_empty"
    check: "{{document_content | length}} > 50"
    error_message: "No document content provided. Please upload research documents before running analysis."

slack_ui:
  modal:
    title: "Desk research"
    submit_label: "Analyze"
    close_label: "Cancel"

  error_messages:
    no_documents: "Please upload at least one document before running desk research."
    processing_failed: "Analysis failed. Please check that your documents are readable text files (PDF, DOCX, TXT, MD)."

notes: |
  v7.0: Interleaved Handlebars/AI architecture (ADR 0005/0016 pattern).
  - Document inventory (file names, types, count) rendered mechanically
    via Handlebars. LLM document_analysis task adds per-document summaries
    and relevance assessments on top of the mechanical list.
  - Handler now extracts modal fields (description, research_topic, topic)
    that were previously silently ignored.
  - Masthead standardized to match brief/plan pattern (no centered div).
  - Cascade summary section added at bottom.
  - Anti-fabrication guards preserved (already strong from v5.1).
  - OUTPUT BOUNDARIES rule added to all tasks.

  v5.1: Per-section LLM tasks (superseded by v7.0).
