# ═══════════════════════════════════════════════════════════
# IDENTITY
# ═══════════════════════════════════════════════════════════
id: usability_issues
name: run_usability_issues_extractor
label: "Usability Issues"
version: "v7.0"

description: |
  Extract and prioritize usability issues from session data using
  systematic severity assessment and evidence linking. v7.0:
  Interleaved Handlebars/AI — mechanical content rendered by
  template, LLM writes bounded analytical sections. Emits
  prioritized_issues for downstream research_readout consumption.
  Replace strategy (study-level, not per-participant pool).
  Per ADR 0005/0016.

author: Qori R&D
created: 2025-06-26
last_updated: 2026-05-21

# ═══════════════════════════════════════════════════════════
# CONFIGURATION
# ═══════════════════════════════════════════════════════════
input_type: slack_modal_form
input_processing: auto_file_discovery

# ═══════════════════════════════════════════════════════════
# INPUTS
# ═══════════════════════════════════════════════════════════
input_variables:
  - selected_study
  - include_research_plan
  - include_participant_notes
  - include_raw_transcripts
  - discovered_files
  - combined_file_content

# ═══════════════════════════════════════════════════════════
# CASCADE CONTRACT
# ═══════════════════════════════════════════════════════════
consumes:
  - key: atomic_nugget_core
    source: session_summary
    required: true
    inject_as: reference
    description: "Pool of typed observations — primary input for issue extraction"

  - key: atomic_nugget_detail
    source: session_summary
    required: true
    inject_as: reference
    description: "Rich context for nuggets — verbatim quotes, behaviors, emotional state"

  - key: validated_themes
    source: affinity_mapping
    required: false
    inject_as: reference
    description: "Cross-participant patterns — issues may map to themes"

  - key: target_barriers
    source: research_brief
    required: false
    inject_as: grounding
    description: "Hypothesized barriers — issues can validate or refute these"

  - key: research_questions
    source: research_brief
    required: false
    inject_as: context
    description: "Research questions to address through issue analysis"

emits:
  - key: prioritized_issues
    pool: false
    pool_strategy: replace
    extraction_model: sonnet
    schema:
      type: array
      items:
        $ref: schemas/prioritized_issue.yaml
    extract_from: "ALL numbered issue sections — extract EVERY issue as a separate array item"

# ═══════════════════════════════════════════════════════════
# AI GENERATION — focused, bounded task
# ═══════════════════════════════════════════════════════════
ai_generation_tasks:

  # Single analysis_body task — At a Glance + per-issue sections
  # (problem, behavior/expectation, evidence, severity, fix) +
  # What's Working + Cross-Issue Connections + Fix Priority table.
  # Kept as one task for cross-issue coherence: priority rankings
  # reference severity across issues, connections identify root causes.
  - task_id: "analysis_body"
    prompt: |
      ============================================================
      CRITICAL RULES
      ============================================================

      RULE 1: NO HALLUCINATION - EXTRACT ONLY
      You are an EXTRACTOR, not a GENERATOR.
      - Every issue must be based on ACTUAL observations from the data
      - Every quote must be VERBATIM from the data
      - If you cannot find evidence, DO NOT INCLUDE IT

      RULE 2: SYSTEMATIC EXTRACTION
      Process the data in this order:
      1. Scan ALL data for distinct usability problems
      2. For each problem, gather ALL supporting evidence
      3. Analyze user behaviors and expectations
      4. Assess severity using Nielsen scale (1-4)
      5. Generate specific, actionable fix recommendations
      6. Validate with supporting quotes

      RULE 3: VA GOVERNMENT CONTEXT ONLY
      These are Veterans using VA services.
      Pain points relate to: app usability, navigation, accessibility, claims, healthcare.

      RULE 4: CITE EVERYTHING
      Every quote MUST have Participant ID (PT-001, PT-002) and timestamp if available.

      RULE 5: ISSUES MUST BE DISTINCT
      If two issues sound similar, combine them into ONE.

      RULE 6: SPECIFIC ISSUE NAMES
      Issue names should be specific to THIS data, not generic UX jargon.
      Bad: "Navigation Challenges"
      Good: "Unlabeled Buttons Block Screen Reader Navigation"

      {% if upstream_atomic_nugget_core %}
      ============================================================
      CASCADE-AWARE GENERATION
      ============================================================

      You have upstream nugget pool and analysis context. Your job:

      1. **Extract issues from nuggets by type and severity.** Use nugget_type
         (task_failure, pain_point, accessibility_issue, workaround) and
         severity to identify distinct usability issues.

      2. **Cite supporting nuggets by ID.** Reference nugget IDs (e.g.,
         nugget-PT001-003) in evidence tables.

      3. **Include representative verbatim quotes.** Pull the strongest
         verbatim_quote from supporting nuggets. Attribute with PT ID.

      {% if upstream_target_barriers %}
      4. **Mark issue-barrier relationships.**
         - [validates TB-001] when issue confirms a target barrier
         - [addresses RQ-001] when issue addresses a research question

      TARGET BARRIERS:
      {{upstream_target_barriers}}
      {% endif %}

      {% if upstream_research_questions %}
      RESEARCH QUESTIONS:
      {{upstream_research_questions}}
      {% endif %}

      {% if upstream_validated_themes %}
      5. **Link issues to themes.** Reference validated_theme IDs (theme-XX)
         when an issue maps to a broader pattern.

      VALIDATED THEMES:
      {{upstream_validated_themes}}
      {% endif %}

      6. **Confidence calibration:**
         - Strong: 3+ participants, consistent severity, multiple quotes
         - Moderate: 2 participants OR mixed severity
         - Limited: 1 participant OR weak evidence

      ATOMIC NUGGETS — CORE:
      {{upstream_atomic_nugget_core}}

      ATOMIC NUGGETS — DETAIL:
      {{upstream_atomic_nugget_detail}}

      {% endif %}

      ============================================================
      INPUT DATA
      ============================================================

      **Study:** {{selected_study}}
      **Input Data:** {{combined_file_content}}

      ============================================================
      GENERATE THESE SECTIONS
      ============================================================

      Output ALL sections below. Use ## headings. Do not stop early.

      ## At a Glance

      | # | Issue | Severity | Affected Users | Fix Complexity |
      |:-:|:------|:--------:|:---------------|:--------------:|
      | 1 | [Specific issue name] | High (4) | PT-001, PT-002 | Low |
      | 2 | [Specific issue name] | High (3) | PT-001, PT-003 | Medium |
      [continue for each issue]

      ---

      ## Issue 01: [Specific Issue Name]

      **Category:** [Navigation / Forms / Search / Content / Visual Design / Accessibility / Feedback / Workflow / Error Handling]
      **Location:** [Specific screen, feature, or interface element]
      **Severity:** [1-4 Nielsen scale] &nbsp;|&nbsp; **Confidence:** [Strong/Moderate/Limited] ([reasoning])

      ### The Problem

      [1-2 sentence description of what's broken and why it matters]

      ### User Behaviors & Expectations

      | Aspect | Detail |
      |--------|--------|
      | **Observed** | [What users actually did] |
      | **Expected** | [What users thought would happen] |
      | **Mismatch** | [Where mental model diverged from interface] |
      | **Recovery** | [How users tried to work around the problem] |
      | **Impact** | [Effect on confidence, frustration, task completion] |
      | **Frequency** | [All users / Majority / Several / Isolated] |

      ### Evidence

      | Type | Evidence | Source |
      |:----:|----------|--------|
      | Quote | "[Verbatim quote]" | PT-00X via nugget-PT00X-003 |
      | Pain point | [Observed pain point] | PT-00X via nugget-PT00X-011 |
      | Behavior | [Observed behavior] | PT-00X via nugget-PT00X-015 |

      ### Fix Recommendations

      **Primary Fix:** [Specific, actionable recommendation]

      **Implementation:**
      - [Specific design change]
      - [Technical requirement if any]

      **Fix Complexity:** [Low / Medium / High] — [reasoning]
      **Quick Win?** [Yes / No] — [reasoning]

      ---

      ## Issue 02: [Specific Issue Name]

      [Same complete format as Issue 01]

      ---

      [REPEAT FOR EACH ISSUE — typically 3-8 issues]

      ---

      ## What's Working

      | What Works | Evidence | Source |
      |------------|----------|--------|
      | [Positive finding] | "[Quote or observation]" | PT-00X |

      ---

      ## Cross-Issue Connections

      [How issues relate — are they symptoms of the same root design problem?]

      ---

      ## Recommended Fix Priority

      | Priority | Issue | Quick Win? | Effort | Addresses |
      |:--------:|-------|:----------:|:------:|-----------|
      | 1 | [Issue name] | Yes | Low | [Problem area] |
      | 2 | [Issue name] | No | Medium | [Problem area] |

      OUTPUT BOUNDARIES: Do not generate the document title, masthead,
      methodology framework description, references, upstream context section,
      validity checklist, or cascade summary. The template handles those sections.
      USE ## headings for each section (## At a Glance, ## Issue 01, etc.).

      Before outputting, verify:
      - Every issue has evidence from source data
      - Every quote is verbatim with participant ID
      - Issues are distinct (no overlap)
      - Severity uses consistent 1-4 scale
      - Fix recommendations are specific and actionable
      Do NOT output a footer or "Generated by Qori" line — that is added automatically.

# ═══════════════════════════════════════════════════════════
# OUTPUT — interleaved Handlebars + AI prose
# ═══════════════════════════════════════════════════════════
output_template: |
  # Usability Issues Report

  **Study:** {{selected_study}} &nbsp; | &nbsp; **Researcher:** {{researcher_contact}} &nbsp; | &nbsp; **Date:** {{current_date}}

  ---

  {{ai_generated.analysis_body}}

  ---

  <details>
  <summary><strong>Methodology</strong></summary>

  **Framework:** Systematic Usability Issue Extraction

  **Approach:** Issues identified through systematic analysis of session data, with each issue validated against direct evidence. User behaviors and expectations analyzed to understand root causes. Severity assessed using Nielsen's 1-4 scale.

  **Severity Criteria:**
  - **4 — Catastrophic:** Prevents task completion, affects majority of users
  - **3 — Major:** Causes significant confusion or delays, workaround possible
  - **2 — Minor:** Noticeable friction, affects some users, doesn't block tasks
  - **1 — Cosmetic:** Minor annoyance, affects few users

  ### References

  - Nielsen, J. — Severity ratings for usability problems (1995)
  - Nielsen Norman Group — Usability heuristics for user interface design
  - Krug, S. — *Rocket Surgery Made Easy* (2010)
  - W3C Web Content Accessibility Guidelines (WCAG) 2.2

  </details>

  {{#if upstream_atomic_nugget_core}}
  <details>
  <summary><strong>Upstream context</strong></summary>

  This usability analysis was synthesized from:

  | Source | Used for |
  |--------|----------|
  | session_summary outputs | Nuggets across participants |
  {{#if upstream_validated_themes}}| affinity_mapping | Validated themes for issue-theme linking |{{/if}}
  {{#if upstream_target_barriers}}| research_brief | Target barriers, research questions |{{/if}}

  Citation markers throughout:
  - [validates TB-XXX] = issue confirms target barrier
  - [addresses RQ-XXX] = issue addresses research question
  - nugget-PT00X-XXX = source nugget reference
  - theme-XX = linked validated theme

  </details>
  {{/if}}

  <details>
  <summary><strong>Validity checklist</strong></summary>

  | Criterion | Verified |
  |-----------|:--------:|
  | Every issue based on actual observations from data | |
  | All quotes verbatim with participant ID | |
  | Issues are distinct (no overlap) | |
  | Severity uses consistent 1-4 Nielsen scale | |
  | Fix recommendations are specific and actionable | |
  | Evidence citations include nugget IDs where available | |

  </details>

  ---

  <details>
  <summary><strong>Research provenance</strong></summary>

  This usability analysis emits variables for downstream templates. Replace strategy — one analysis per study, not per-participant pool.

  | Variable | Pool | Strategy | Description |
  |----------|:----:|----------|-------------|
  | prioritized_issues | No | replace | Severity-rated issues with evidence and fix recommendations (7 req + 10 nullable fields) |

  **Consumed from upstream:**

  | Variable | Source | Role |
  |----------|--------|------|
  | atomic_nugget_core | session_summary | Primary evidence for issue extraction |
  | atomic_nugget_detail | session_summary | Verbatim quotes, behaviors, context |
  | validated_themes | affinity_mapping | Issue-theme linking |
  | target_barriers | research_brief | Barrier validation |
  | research_questions | research_brief | Question addressing |

  </details>

output_options:
  path: "04-synthesis/"
  filename: "{{selected_study}}--usability-issues--{{__derivation_fp}}.md"

# ═══════════════════════════════════════════════════════════
# METADATA
# ═══════════════════════════════════════════════════════════
notes: |
  v7.0: Interleaved Handlebars/AI architecture (ADR 0005/0016 pattern).
  - Monolithic usability_complete task replaced by analysis_body task.
  - Handlebars renders: masthead, methodology (toggle with severity criteria
    and references), upstream context (toggle, conditional), validity checklist
    (toggle), declared inputs (static declaration table).
  - NEW: emits prioritized_issues (replace strategy, Sonnet extraction).
    This closes the broken cascade contract — research_readout declares
    it consumes prioritized_issues from usability_issues but the emit
    didn't exist until this version.
  - Replace strategy is intentional: usability_issues is a study-level
    synthesis (one per study), not a per-participant pool like session_summary.
    Each run replaces the previous analysis for the study.
  - Consumes updated: atomic_nuggets split into atomic_nugget_core +
    atomic_nugget_detail (matching all other v7.0 templates). Added
    target_barriers and research_questions from research_brief for
    cascade-aware TB/RQ citation markers.
  - OUTPUT BOUNDARIES instruction added.
  - Dead metadata removed (processing_workflow, notify, quality_assurance).
  - Anti-fabrication guards preserved (6 rules).
  - No handler changes needed (researchSynthesisHandler.ts, ANALYSIS_YAML_MAPPING).

  v3.1: Standards polish.
  v3.0: Task consolidation (6 broken chained tasks -> 1).
  v2.0: 6-task chained architecture (broken by parallel execution).
