# ═══════════════════════════════════════════════════════════
# IDENTITY
# ═══════════════════════════════════════════════════════════
id: usability_issues_extractor
name: run_usability_issues_extractor
label: 🐛 Usability Issues
version: "v3.1"

description: >
  Extract and prioritize usability issues from testing sessions, user observations, and research notes.
  Identifies specific UX problems with severity levels, user behaviors, and actionable recommendations.

author: Qori R&D
created: 2025-06-26
last_updated: 2026-04-29

# ═══════════════════════════════════════════════════════════
# CONFIGURATION
# ═══════════════════════════════════════════════════════════
input_type: slack_modal_form
input_processing: auto_file_discovery

# ═══════════════════════════════════════════════════════════
# INPUTS
# ═══════════════════════════════════════════════════════════
input_variables:
  - selected_study              # Study name from dropdown (REQUIRED)
  - include_research_plan       # Boolean from checkbox (OPTIONAL)
  - combined_file_content       # Auto-combined content (GENERATED)

# ═══════════════════════════════════════════════════════════
# AI GENERATION
# ═══════════════════════════════════════════════════════════
# v3.0: Consolidated from 6 chained tasks into 1 comprehensive task.
# The original 6-task architecture (v2.0) used {{ai_generated.*}} references
# between tasks, but executeAiGenerationTasks runs all tasks via Promise.all
# (parallel). Tasks 2-6 received empty strings for chained references,
# causing the extraction to hang or produce empty output. Same fix applied
# to affinity_mapping v3.0 — see its notes section.
ai_generation_tasks:
  - task_id: "usability_complete"
    prompt: |
      ============================================================
      🚨 CRITICAL RULES - READ BEFORE ANYTHING ELSE 🚨
      ============================================================

      RULE 1: NO HALLUCINATION - EXTRACT ONLY
      You are an EXTRACTOR, not a GENERATOR.
      - Every issue must be based on ACTUAL observations from the data
      - Every quote must be VERBATIM from the data
      - If you cannot find evidence, DO NOT INCLUDE IT

      RULE 2: SYSTEMATIC EXTRACTION
      Process the data in this order:
      1. First, scan ALL data for distinct usability problems
      2. For each problem, gather ALL supporting evidence
      3. Analyze user behaviors and expectations for each
      4. Assess severity using consistent criteria
      5. Generate specific, actionable fix recommendations
      6. Validate with supporting quotes

      RULE 3: VA GOVERNMENT CONTEXT ONLY
      These are Veterans using VA services.
      - Pain points relate to: app usability, navigation, accessibility, claims, healthcare
      - NEVER mention unrelated concepts

      RULE 4: CITE EVERYTHING
      Every quote MUST have:
      - Participant ID (PT-001, PT-002, etc.)
      - Timestamp if available (00:01:56)

      RULE 5: ISSUES MUST BE DISTINCT
      If two issues sound similar, combine them into ONE.
      - "Button visibility issues" and "Hidden edit button" = ONE issue
      - "Navigation challenges" and "Getting lost in benefits" = ONE issue

      RULE 6: SPECIFIC ISSUE NAMES
      Issue names should be specific to THIS data, not generic UX jargon.

      ❌ GENERIC: "Navigation Challenges"
      ❌ GENERIC: "Poor User Experience"
      ✅ SPECIFIC: "Unlabeled Buttons Block Screen Reader Navigation"
      ✅ SPECIFIC: "Claim Status Shows 'None' Despite Active Filing"

      ============================================================
      YOUR TASK
      ============================================================

      Perform a comprehensive usability issues extraction on this research data:

      **Study:** {{selected_study}}
      **Analysis Date:** {{current_date}}
      **Input Data:** {{combined_file_content}}

      ============================================================
      OUTPUT FORMAT - FOLLOW EXACTLY
      ============================================================

      # 🐛 Usability Issues Report: [INSERT ACTUAL STUDY NAME]

      > **[X] issues** identified | **[Y] participants** affected

      ---

      ## At a Glance

      | # | Issue | Severity | Affected Users | Fix Complexity |
      |:-:|:------|:--------:|:---------------|:--------------:|
      | 1 | [Specific issue name] | 🔴 High | PT-001, PT-002 | 🔵⚪⚪ Low |
      | 2 | [Specific issue name] | 🟡 Medium | PT-001, PT-003 | 🔵🔵⚪ Medium |
      | 3 | [Specific issue name] | 🟢 Low | PT-002 | 🔵🔵🔵 High |

      ---

      ## Issue 1: [Specific Issue Name from Data]

      **Category:** [Navigation / Forms / Search / Content / Visual Design / Accessibility / Feedback / Workflow]
      **Location:** [Specific screen, feature, or interface element]
      **Severity:** 🔴 High / 🟡 Medium / 🟢 Low

      ### The Problem

      [One-paragraph description of what's broken and why it matters]

      ### User Behaviors & Expectations

      | Aspect | Detail |
      |--------|--------|
      | 👀 **Observed** | [What users actually did — be specific about clicks, navigation, confusion] |
      | 🎯 **Expected** | [What users thought would happen or tried to accomplish] |
      | 🧠 **Mismatch** | [Where user mental model diverged from interface design] |
      | 🔧 **Recovery** | [How users tried to work around the problem] |
      | 😤 **Impact** | [Effect on user confidence, frustration, or task completion] |
      | 📊 **Frequency** | [How often: "All users" / "Majority" / "Several" / "Isolated"] |

      ### Evidence

      | Type | Evidence | Source |
      |:----:|----------|--------|
      | 💬 | "[Verbatim quote demonstrating this issue]" | PT-001, 00:00:00 |
      | 💬 | "[Another verbatim quote]" | PT-002, 00:00:00 |
      | 🔴 | [Observed pain point] | PT-001 |
      | 👁️ | [Observed behavior] | PT-003 |

      **Signal Strength:** [Affected X out of Y users / Consistent problem / Recurring pattern]
      **Evidence Quality:** [Strong / Moderate / Limited] — [reasoning]

      ### Severity Assessment

      - 📋 **Task Impact:** [How this affects users' ability to complete their task]
      - 👤 **User Impact:** [Effect on experience, confidence, abandonment]
      - 💼 **Business Impact:** [Effect on conversion, support burden, retention]
      - ⏱️ **Fix Complexity:** [Low / Medium / High] — [reasoning]

      ### Fix Recommendations

      💡 **Primary Fix:** [Specific, actionable recommendation that addresses the core problem]

      🔧 **Implementation Details:**
      - [Specific design change needed]
      - [Technical requirement if any]
      - [Content/label update if any]

      🔄 **Alternatives:**
      - [Alternative approach if primary fix isn't feasible]

      📊 **Success Metric:** [How to measure if this fix works]
      ⚡ **Quick Win?** [Yes / No] — [reasoning]

      ---

      ## Issue 2: [Specific Issue Name]

      [Same complete format as Issue 1 — include ALL sections]

      ---

      [REPEAT FOR EACH ISSUE — typically 3-8 issues depending on data density]

      ---

      ## ✅ What's Working

      Positive usability findings from the research:

      | What Works | Evidence | Source |
      |------------|----------|--------|
      | [Positive finding] | "[Quote or observation]" | PT-001 |
      | [Positive finding] | "[Quote or observation]" | PT-002 |

      ---

      ## Cross-Issue Connections

      [How issues relate — are they symptoms of the same root design problem? Are there systemic patterns?]

      ---

      ## Recommended Fix Priority

      | Priority | Issue | Quick Win? | Effort | Addresses |
      |:--------:|-------|:----------:|:------:|-----------|
      | 1 | [Issue name] | ⚡ Yes | 🔵⚪⚪ | [Core problem area] |
      | 2 | [Issue name] | No | 🔵🔵⚪ | [Core problem area] |
      | 3 | [Issue name] | No | 🔵🔵🔵 | [Core problem area] |

      ---

      ## Methodology

      **Framework:** Systematic Usability Issue Extraction

      **Approach:** Issues were identified through systematic analysis of testing data, with each issue validated against direct evidence. User behaviors and expectations were analyzed to understand the root cause. Severity was assessed using consistent criteria (task impact, user impact, frequency). Fix recommendations are specific and actionable.

      **Severity Criteria:**
      - 🔴 **High:** Prevents task completion, affects majority of users, critical workflow blocker
      - 🟡 **Medium:** Causes confusion or delays, affects some users, workaround possible
      - 🟢 **Low:** Minor annoyance, affects few users, doesn't block core tasks

      **Data Sources:** [List ALL participant IDs analyzed]

      ---

      *Generated by Qori • {{current_date}}*

      ============================================================
      QUALITY REQUIREMENTS (INTERNAL - DO NOT OUTPUT)
      ============================================================

      Before submitting, verify:
      - [ ] Every quote is VERBATIM from source data
      - [ ] Every participant ID exists in source
      - [ ] Issue names are specific to THIS study (not generic)
      - [ ] Issues are distinct (no overlap)
      - [ ] Each issue has complete behavior analysis (observed, expected, mismatch)
      - [ ] Each issue has severity assessment with reasoning
      - [ ] Each issue has specific fix recommendations
      - [ ] Evidence citations include participant IDs and timestamps
      - [ ] Cross-issue connections identified
      - [ ] Fix priority table completed

# ═══════════════════════════════════════════════════════════
# OUTPUT
# ═══════════════════════════════════════════════════════════
output_template: |
  {{ai_generated.usability_complete}}

output_options:
  path: "04-analysis/usability-issues/"
  filename: "{{selected_study}}_usability_issues_{{current_date}}.md"

# ═══════════════════════════════════════════════════════════
# METADATA (documentation only — not read by backend)
# ═══════════════════════════════════════════════════════════
processing_workflow:
  1. validate_slack_modal_inputs
  2. discover_files_from_study_selection
  3. combine_selected_files_with_truncation
  4. execute_usability_complete
  5. format_output
  6. save_to_analysis_folder

notify:
  - role: team
    action: "Usability issues extraction completed"
    channel: "{{study_channel}}"

quality_assurance:
  require_verbatim_quotes: true
  require_citations: true
  require_specific_names: true
  require_severity_assessment: true
  require_fix_recommendations: true

notes: |
  v3.1 Changes (Standards Polish):
  - Applied canonical key ordering (IDENTITY → CONFIGURATION → INPUTS → AI GENERATION → OUTPUT → METADATA)
  - Removed dead config: llm_config, system_limits, privacy_controls, study_metadata, auto_file_discovery
  - Removed github_file_template (referenced variables never provided by handler)
  - Removed default_delivery, slack_format, file_format from output_options (dead config)
  - Updated prompt: summary blockquote removes date (date is in footer)
  - Removed decorative emoji from Cross-Issue Connections heading (was 🔗)
  - Standardized participant ID format to PT-001 (hyphenated)
  - Added inline comments on input_variables

  v3.0 Changes (Task Consolidation):
  - Consolidated 6 chained AI tasks into 1 comprehensive task
  - Previous 6-task architecture used {{ai_generated.*}} cross-references between
    tasks, but executeAiGenerationTasks runs all tasks via Promise.all (parallel).
    Tasks 2-6 received empty context, causing hang/failure. Same issue that drove
    affinity_mapping v3.0 redesign.
  - All analytical depth preserved: issue identification, behavior/expectation
    analysis, severity assessment, fix recommendations, and evidence validation
    are all included in the single consolidated prompt.

  v2.0: 6-task chained architecture (broken by parallel execution)
  v1.0: Original implementation

output_use: |
  Slack-Native Usability Issues Extractor systematically identifies specific
  interface problems with user behaviors and expectations, assesses severity
  and impact, and generates actionable fix recommendations. Outputs concise
  Slack summaries plus detailed GitHub markdown reports.
