# ═══════════════════════════════════════════════════════════
# IDENTITY
# ═══════════════════════════════════════════════════════════
id: discussion_guide
name: run_discussion_guide
label: "💬 Discussion Guide"
version: "v7.1"

description: |
  Generate a session guide for user research. Adapts structure based on
  methodology (usability testing, interviews, card sorting, etc.).
  Includes introduction scripts, methodology-specific tasks, and closing protocols.
  v7.1: True v7.0 restructure — Handlebars frame renders masthead, summary table,
  static sections (emergency, debrief), upstream context, validity checklist, cascade
  provenance. LLM bounded to guide_body (sections 01-05 + coverage check).
  OUTPUT BOUNDARIES added. Metadata ruling applied (cascade → collapsed details).

author: Qori R&D
created: 2025-06-26
last_updated: 2026-08-04

# ═══════════════════════════════════════════════════════════
# CONFIGURATION
# ═══════════════════════════════════════════════════════════
input_type: structured
input_processing: direct

# ═══════════════════════════════════════════════════════════
# INPUTS
# ═══════════════════════════════════════════════════════════
input_variables:
  - selected_study:
      type: "select"
      required: true
  - research_focus:
      type: "textarea"
      required: true
  - research_questions:
      type: "textarea"
      required: true
  - research_method:
      type: "select"
      required: true
  - session_length:
      type: "select"
      required: true
  - task_count:
      type: "select"
      required: true
  - lead_researcher:
      type: "text"
      required: true

# ═══════════════════════════════════════════════════════════
# CASCADE CONTRACT
# ═══════════════════════════════════════════════════════════
consumes:
  - key: research_objectives
    source: research_brief
    required: true
    inject_as: commitment
    description: "Guide must serve all research objectives"
  - key: research_questions
    source: research_brief
    required: true
    inject_as: commitment
    description: "Each script section must serve at least one research question"
  - key: methodology_selection
    source: research_brief
    required: true
    inject_as: commitment
    description: "Methodology determines guide structure"
  - key: target_barriers
    source: research_brief
    required: true
    inject_as: grounding
    description: "Tasks/probes designed to elicit barrier validation evidence"
  - key: participant_criteria
    source: research_brief
    required: false
    inject_as: context
    description: "Adjust language/probes based on participant types"

emits:
  - key: task_scenarios
    pool: false
    pool_strategy: replace
    extraction_model: sonnet
    schema:
      type: array
      items:
        $ref: schemas/task_scenario.yaml
    extract_from: |
      ALL task/topic/concept/observation sections. For EACH task, extract:
      - id: Format task-01, task-02, etc.
      - task_description: What the participant is asked to do
      - success_criteria: How to determine completion
      - validates_barriers: REQUIRED — Extract TB-XXX IDs from [targets TB-XXX] markers in task headers.
        Example: "### Task 01 ... [targets TB-001]" → validates_barriers: ["TB-001"]
      - addresses_questions: REQUIRED — Extract RQ-XXX IDs from [RQ-XXX] markers in task headers.
        Example: "### Task 01 ... [RQ-001] [RQ-002]" → addresses_questions: ["RQ-001", "RQ-002"]
      CRITICAL: Every task MUST have non-empty validates_barriers and addresses_questions arrays.
      Parse the markers from the generated document text — they are inline in the task headers.
  - key: probes
    pool: false
    pool_strategy: replace
    extraction_model: sonnet
    schema:
      type: array
      items:
        $ref: schemas/probe.yaml
    extract_from: |
      ALL probe/follow-up questions from each task/topic section. For EACH probe:
      - id: Format probe-01, probe-02, etc.
      - probe_text: The actual follow-up question
      - addresses_question: REQUIRED — The RQ-XXX from the parent task's header.
        A probe inherits its research question from the task it belongs to.
      CRITICAL: Every probe MUST have a non-empty addresses_question field.

# ═══════════════════════════════════════════════════════════
# AI GENERATION
# ═══════════════════════════════════════════════════════════
ai_generation_tasks:
  - task_id: "descriptive_title"
    model: "claude-haiku-4-5-20251001"
    prompt: |
      Generate a concise study title from this research focus: {{research_focus}}

      OUTPUT BOUNDARIES: Generate ONLY the title text — max 8 words. No heading
      marker, no quotes, no preamble. Example: "Mobile Benefits Navigation Usability"

  - task_id: "summary"
    prompt: |
      Write a 2-3 sentence summary for a discussion guide.

      Research focus: {{research_focus}}
      Method: {{research_method}}
      Tasks: {{task_count}}
      Session length: {{session_length}} minutes

      OUTPUT BOUNDARIES: Generate ONLY the summary sentences — no heading,
      no preamble, no footer or structural elements.
      Focus: what this session covers, the methodology, number of tasks/topics,
      and what the research aims to learn.

  - task_id: "guide_body"
    prompt: |
      You are creating the session content for a discussion guide.

      IMPORTANT: Generate ALL five sections (01-05) plus the coverage check.
      Do not stop early.

      {% if upstream_research_objectives %}
      ============================================================
      UPSTREAM CONTEXT (from approved research brief)
      ============================================================

      NOTE: The data below may be in JSON format with array brackets,
      curly braces, and null fields. This is the raw variable store
      format. When you reference this data in the output, you MUST
      reformat it as readable prose — bulleted lists with IDs and
      plain-text descriptions. NEVER copy JSON syntax into the output.

      RESEARCH OBJECTIVES:
      {{upstream_research_objectives}}

      {% if upstream_research_questions %}
      RESEARCH QUESTIONS:
      {{upstream_research_questions}}
      {% endif %}

      {% if upstream_target_barriers %}
      TARGET BARRIERS (design tasks that probe these):
      {{upstream_target_barriers}}
      {% endif %}

      {% if upstream_methodology_selection %}
      APPROVED METHOD: {{upstream_methodology_selection}}
      {% endif %}

      {% if upstream_participant_criteria %}
      PARTICIPANT CRITERIA:
      {{upstream_participant_criteria}}
      {% endif %}

      ============================================================
      CASCADE-AWARE GENERATION
      ============================================================

      1. **Each task must serve research questions.** Mark inline with [RQ-XXX] which
         question(s) each task addresses.

      2. **Tasks designed to validate barriers.** Mark inline with [targets TB-XXX]
         when a task is specifically designed to elicit evidence about a target barrier.

      3. **Use stable IDs.** RQ-XXX for questions, TB-XXX for barriers.

      4. **Coverage check required.** After all tasks, verify every RQ-XXX has at least
         one task addressing it. Flag gaps.

      5. **No fabrication of entities.** For team references, use ONLY:
         - Teams explicitly named in upstream variables
         - Generic role categories: Design, Engineering, Accessibility, Product, Content, Research
         Do NOT invent specific team names.

      6. **Title must reflect upstream scope.** The study title in the output
         MUST derive from the upstream business_context / research_objectives —
         not from a narrow subset Sonnet finds compelling. If the brief covers
         5 activity areas, the title must reflect the full scope.

      7. **Tasks must cover the FULL upstream context.** Distribute tasks across
         ALL research questions and target barriers — not just the ones that
         seem most interesting. Each RQ-XXX and each major TB-XXX cluster should
         have at least one task addressing it. Do NOT narrow all tasks to a
         single sub-topic when the brief's scope is broader.

      Ground warm-up questions in the research objectives. Design task
      scenarios that test the target barriers. Retrospective questions
      should assess whether the research questions were addressed.
      {% if upstream_participant_criteria %}
      Adjust language, probes, and scenario complexity based on
      participant criteria.
      {% endif %}
      {% endif %}

      ============================================================
      INPUT
      ============================================================

      **Research Focus:** {{research_focus}}
      **Research Questions:** {{research_questions}}
      **Research Method:** {{research_method}}
      **Session Length:** {{session_length}} minutes
      **Number of Tasks/Topics:** {{task_count}}
      **Lead Moderator:** {{lead_researcher}}

      ============================================================
      RULES
      ============================================================

      1. Generate a guide for {{research_method}} methodology specifically.
      2. Script text (what to read aloud) goes in blockquotes (> lines).
      3. Researcher instructions go in italics (*text*).
      4. Always use markdown dash (-) for bullets, never Unicode bullets.
      5. Markdown tables must have NO blank lines between rows.
      6. Generate exactly {{task_count}} main activity blocks in Section 03.
      7. Timing must add up to exactly {{session_length}} minutes.
      8. Tasks/topics/concepts must be specific to {{research_focus}} — not
         generic placeholders. Each should test one of the research questions.
      9. NEVER output raw JSON in the document. Upstream variables may arrive
         as JSON arrays with brackets, curly braces, and null fields. You MUST
         extract the human-readable content and format as clean markdown bullets.
         Example: JSON like {"id":"RQ-001","question":"How do...","priority":null}
         becomes "- **RQ-001** — How do..."

      METHODOLOGY-AWARE LABELING:
      {% if research_method == "usability_testing" %}
      Label main activities as "Task 01", "Task 02", etc.
      {% elif research_method == "user_interviews" %}
      Label main activities as "Topic 01", "Topic 02", etc.
      {% elif research_method == "concept_testing" %}
      Label main activities as "Concept 01", "Concept 02", etc.
      {% elif research_method == "contextual_inquiry" %}
      Label main activities as "Observation 01", "Observation 02", etc.
      {% elif research_method == "card_sorting" %}
      Label main activities as "Task 01", "Task 02", etc.
      {% elif research_method == "tree_testing" %}
      Label main activities as "Task 01", "Task 02", etc.
      {% elif research_method == "mixed_methods" %}
      Split activities: first half as "Task" blocks, second half as "Topic" blocks.
      {% else %}
      Label main activities as "Activity 01", "Activity 02", etc.
      {% endif %}

      ============================================================
      OUTPUT FORMAT — Sections 01 through 05 + Coverage check
      ============================================================

      Begin with the session timing table, then generate sections 01-05
      and the coverage check. The template handles the masthead, summary,
      cascade summary, emergency procedures, debrief, and appendixes.

      ## Session timing

      | Phase | Duration | Running |
      |-------|---------:|--------:|
      | Introduction and consent | [X] min | [X] min |
      | Warm-up | [X] min | [X] min |
      {% if research_method == "usability_testing" or research_method == "card_sorting" or research_method == "tree_testing" %}
      | Tasks 01–0{{task_count}} | [X] min | [X] min |
      {% elif research_method == "user_interviews" %}
      | Topics 01–0{{task_count}} | [X] min | [X] min |
      {% elif research_method == "concept_testing" %}
      | Concepts 01–0{{task_count}} | [X] min | [X] min |
      {% elif research_method == "contextual_inquiry" %}
      | Observations 01–0{{task_count}} | [X] min | [X] min |
      {% elif research_method == "mixed_methods" %}
      | Tasks and topics | [X] min | [X] min |
      {% else %}
      | Activities 01–0{{task_count}} | [X] min | [X] min |
      {% endif %}
      | Retrospective | [X] min | [X] min |
      | Closing | 2 min | {{session_length}} min |

      > [!NOTE]
      > Durations are budgets, not minimums. Move on once success criteria are observed.

      ---

      ## 01 &nbsp;&nbsp; Introduction and consent

      *[X] minutes. Read warmly, not robotically. Confirm consent before proceeding.*

      #### Welcome

      > Hi [participant], thank you for taking the time to talk with me today. I'm {{lead_researcher}}, and I'm part of a team studying [brief context from {{research_focus}}]. Your perspective will directly help shape improvements that affect thousands of users like you.

      #### Session purpose

      > [Explain what the session will explore — tailored to {{research_method}}. 2-3 sentences.]

      #### Consent and recording

      > I'd like to record our session so I can focus on our conversation rather than taking notes. The recording is only used by our research team and won't be shared outside it. Your name and personal information will be kept confidential. Is it okay if I record?

      #### Ground rules

      > A few things to keep in mind: there are no right or wrong answers. Please think out loud as much as you can — tell me what you're noticing, even if it seems obvious. If any question makes you uncomfortable, just let me know and we'll skip it. Take a break anytime.

      #### Confirm before proceeding

      - [ ] Recording permission verbally confirmed
      - [ ] Right to skip questions explained
      - [ ] Right to end session at any time confirmed

      ---

      ## 02 &nbsp;&nbsp; Warm-up

      *[X] minutes. Build rapport. Surface context that will inform later observations.*

      #### Questions

      1. [Open-ended question about their background/experience with the product domain]
         - *Why this matters:* [Brief note for researcher]

      2. [Question about current behaviors/habits related to {{research_focus}}]
         - *Why this matters:* [Brief note]

      3. [Question about general expectations or past experiences]
         - *Why this matters:* [Brief note]

      4. [Question that naturally transitions to the main activities]
         - *Why this matters:* [Brief note]

      #### If participant uses assistive technology

      Ask them to describe their setup before screen sharing begins:

      - Which assistive technology do you use most often?
      - Any settings I should know about (text size, contrast, voice control)?

      ---

      ## 03 &nbsp;&nbsp; [Section label based on methodology — "Tasks" / "Topics" / "Concepts" / etc.]

      *[X] minutes total for {{task_count}} activities.*

      {% if research_method == "usability_testing" %}
      *For each task, read the scenario and instruction verbatim. Observe without helping unless participant is completely stuck.*

      [Generate {{task_count}} task blocks. Each follows this format:]

      ### Task 01 &nbsp;·&nbsp; [X] min &nbsp;·&nbsp; [Task Name — specific to {{research_focus}}] &nbsp; [RQ-XXX] [targets TB-XXX]

      #### Scenario

      > [Realistic situation the participant would encounter. Specific to {{research_focus}}.]

      #### Instruction

      > [Exact words to say. Direct the participant to attempt the task.]

      #### Success criteria

      - [What successful completion looks like]
      - [Secondary measure if applicable]

      #### Observe

      - [Specific behavior to watch for]
      - [Navigation pattern or hesitation]
      - [Error recovery behavior]

      #### Probe

      - "[Question to ask during or after the task]"
      - "[Follow-up about their thought process]"

      ---

      [Continue for Task 02 through Task {{task_count}} using the same format.
       Each task header MUST include [RQ-XXX] and [targets TB-XXX] markers.]

      {% elif research_method == "user_interviews" %}
      *These are open-ended questions to explore experiences and mental models. Follow the participant's lead and probe deeper on interesting responses.*

      [Generate {{task_count}} topic blocks. Each follows this format:]

      ### Topic 01 &nbsp;·&nbsp; [X] min &nbsp;·&nbsp; [Topic Name — specific to {{research_focus}}] &nbsp; [RQ-XXX] [targets TB-XXX]

      #### Primary question

      > "[Main question to ask — open-ended, grounded in {{research_focus}}]"

      #### Follow-up probes

      - "[Probe for specific details or examples]"
      - "[Probe for feelings/reactions]"
      - "[Probe for comparison to alternatives]"

      #### Listen for

      - [Themes or mental models to note]
      - [Behaviors or attitudes to track]

      ---

      [Continue for Topic 02 through Topic {{task_count}}.
       Each topic header MUST include [RQ-XXX] and [targets TB-XXX] markers.]

      {% elif research_method == "card_sorting" %}
      *Set up the card sorting exercise. Explain the process clearly before beginning.*

      [Generate {{task_count}} sort exercise blocks:]

      ### Task 01 &nbsp;·&nbsp; [X] min &nbsp;·&nbsp; [Sort Exercise Name] &nbsp; [RQ-XXX] [targets TB-XXX]

      #### Setup

      > [Explain the cards and what the participant should do with them]

      #### Instructions

      > [Exact words: "Group these items in a way that makes sense to you..."]

      #### Observe

      - [Grouping patterns and rationale]
      - [Items that cause hesitation]

      #### Reflection

      - "[Why did you put these together?]"
      - "[What would you call this group?]"

      ---

      [Continue for remaining sort exercises.
       Each task header MUST include [RQ-XXX] and [targets TB-XXX] markers.]

      {% elif research_method == "concept_testing" %}
      *Show each concept and gather reactions. Don't explain or defend — let participants react naturally.*

      [Generate {{task_count}} concept blocks:]

      ### Concept 01 &nbsp;·&nbsp; [X] min &nbsp;·&nbsp; [Concept Name] &nbsp; [RQ-XXX] [targets TB-XXX]

      #### Reveal

      > [What to show and how to introduce it]

      #### Initial reaction

      > "What's your first impression of this?"

      #### Comprehension

      > "What do you think this is for? How would you use it?"

      #### Value assessment

      > "How useful would this be for you? Why or why not?"

      ---

      [Continue for remaining concepts.
       Each concept header MUST include [RQ-XXX] and [targets TB-XXX] markers.]

      {% elif research_method == "contextual_inquiry" %}
      *Observe the participant in their natural context. Ask questions as they arise.*

      [Generate {{task_count}} observation blocks:]

      ### Observation 01 &nbsp;·&nbsp; [X] min &nbsp;·&nbsp; [Activity to Observe] &nbsp; [RQ-XXX] [targets TB-XXX]

      #### Context

      > [What to ask the participant to do or demonstrate]

      #### What to observe

      - [Workflow patterns]
      - [Tools and artifacts used]
      - [Workarounds or inefficiencies]

      #### When to probe

      - "[Ask when you notice hesitation or unexpected behavior]"
      - "[Ask about rationale for choices]"

      ---

      [Continue for remaining observations.
       Each observation header MUST include [RQ-XXX] and [targets TB-XXX] markers.]

      {% elif research_method == "tree_testing" %}
      *Present the tree structure. For each question, ask where they would go to find the answer.*

      [Generate {{task_count}} tree question blocks:]

      ### Task 01 &nbsp;·&nbsp; [X] min &nbsp;·&nbsp; [Finding Task] &nbsp; [RQ-XXX] [targets TB-XXX]

      #### Question

      > "[Where would you go to find/do X?]"

      #### Expected path

      - [Correct navigation path in the tree]

      #### Record

      - Path taken (correct / incorrect / indirect)
      - Time to first click
      - Confidence level stated by participant

      ---

      [Continue for remaining tree questions.
       Each task header MUST include [RQ-XXX] and [targets TB-XXX] markers.]

      {% elif research_method == "mixed_methods" %}
      *Split session: first half is task-based, second half is interview topics.*

      [Generate first half as Task blocks, second half as Topic blocks. Split {{task_count}} roughly in half.]

      ### Task 01 &nbsp;·&nbsp; [X] min &nbsp;·&nbsp; [Task Name] &nbsp; [RQ-XXX] [targets TB-XXX]

      [Use usability testing format: Scenario → Instruction → Success criteria → Observe → Probe]

      ---

      ### Topic 01 &nbsp;·&nbsp; [X] min &nbsp;·&nbsp; [Topic Name] &nbsp; [RQ-XXX] [targets TB-XXX]

      [Use interview format: Primary question → Follow-up probes → Listen for]

      ---

      [Continue for remaining tasks and topics.
       Each header MUST include [RQ-XXX] and [targets TB-XXX] markers.]

      {% else %}
      *Adapt these activities to your specific research method.*

      [Generate {{task_count}} activity blocks:]

      ### Activity 01 &nbsp;·&nbsp; [X] min &nbsp;·&nbsp; [Activity Name] &nbsp; [RQ-XXX] [targets TB-XXX]

      #### Setup

      > [How to introduce this activity]

      #### Instructions

      > "[What to say to participant]"

      #### What to capture

      - [Key observations]
      - [Quotes to note]

      ---

      [Continue for remaining activities.
       Each activity header MUST include [RQ-XXX] and [targets TB-XXX] markers.]

      {% endif %}

      ---

      ## 04 &nbsp;&nbsp; Retrospective

      *[X] minutes. Surface overall impressions, frustrations, unmet needs.*

      #### Questions

      1. **Overall impressions** — What's your overall impression of [the experience] today?
      2. **Pain points** — What was the most frustrating or confusing part?
      3. **Mental model** — [Question about how they think about the domain — specific to {{research_focus}}]
      4. **Improvements** — If you could change one thing about [the product/process], what would it be?
      5. **Likelihood to use** — On a scale of 1–10, how likely would you be to [use this / do this again]? What would make it a 10?
      6. **Anything else** — Is there anything else you'd like to share that I didn't ask about?

      ---

      ## 05 &nbsp;&nbsp; Closing

      *2 minutes.*

      #### Thank you

      > Thank you so much for taking the time to share your insights today. Your feedback is genuinely valuable and will directly help shape how [the product/service] gets improved.

      #### What happens next

      > We'll be analyzing your feedback along with other participants' experiences to identify the most important improvements.

      #### Compensation

      [Confirm compensation method and timing per study agreement.]

      #### Final question

      > Do you have any questions for me before we wrap up?

      #### Confirm before ending

      - [ ] Compensation method and timing communicated
      - [ ] Follow-up contact preferences confirmed
      - [ ] Recording stopped

      {% if upstream_research_questions %}
      ---

      ## Coverage check

      | Research question | Addressed by |
      |-------------------|--------------|
      [For each RQ-XXX from the upstream research questions, list which task/topic/concept/observation addresses it. If a question has no task addressing it, mark it as "GAP — no task addresses this question".]

      {% if upstream_target_barriers %}
      | Target barrier | Validated by |
      |----------------|--------------|
      [For each TB-XXX from the upstream target barriers, list which task/topic/concept/observation targets it. If a barrier has no task targeting it, mark it as "GAP — no task targets this barrier".]
      {% endif %}
      {% endif %}

      ============================================================
      QUALITY CHECKS (do not include in output)
      ============================================================

      Before outputting, verify:
      - Timing adds up to exactly {{session_length}} minutes
      - Exactly {{task_count}} main activity blocks generated
      - All script text is in blockquotes (> lines)
      - Tables have no blank lines between rows
      - Tasks/topics are specific to {{research_focus}}, not generic
      - Activity labels match methodology (Task/Topic/Concept/Observation/Activity)
      - Every task/topic/concept/observation header has [RQ-XXX] markers
      - Every RQ-XXX appears in at least one task (coverage check table is complete)
      - [targets TB-XXX] markers present where tasks probe specific barriers
      - Coverage check section has no GAPs (if gaps exist, add tasks or reassign)

      OUTPUT BOUNDARIES: Do not generate the document title, masthead, summary
      section, cascade summary, emergency procedures, after-session debrief,
      upstream context appendix, validity checklist, or footer. The template
      handles those sections. Start with ## Session timing and end after the
      coverage check (or after ## 05 Closing if no upstream context).

# ═══════════════════════════════════════════════════════════
# OUTPUT
# ═══════════════════════════════════════════════════════════
output_template: |
  # Discussion Guide: {{ai_generated.descriptive_title}}

  **Study:** {{selected_study}} &nbsp; | &nbsp; **Researcher:** {{lead_researcher}} &nbsp; | &nbsp; **Date:** {{current_date}} &nbsp; | &nbsp; **Status:** Draft

  ---

  ## Summary

  {{ai_generated.summary}}

  | | |
  |---|---|
  | **Method** | {{research_method}} |
  | **Session length** | {{session_length}} minutes |
  | **Format** | Remote, video + screen share |
  | **Tasks** | {{task_count}} |

  ---

  {{ai_generated.guide_body}}

  ---

  ## After-session debrief

  *Ask yourself after each session — capture in session notes immediately.*

  1. What patterns am I seeing related to {{research_focus}}?
  2. What surprised me about this participant's experience?
  3. What needs deeper investigation in remaining sessions?
  4. What quotes or moments were most revealing?

  *After all sessions complete:*

  5. What are the top 3–5 themes across all participants?
  6. How confident am I in these findings? What's still unclear?
  7. What recommendations emerge from these patterns?

  ---

  ## Emergency procedures

  #### Technical issues

  - Backup meeting link ready before session starts
  - Screen share troubleshooting: check browser permissions, try a different browser, fall back to phone
  - Have phone number as backup contact method

  #### Participant distress

  - Pause session immediately and check comfort level
  - Remind them they can stop at any time and there are no wrong answers
  - For Veterans: VA Crisis Line — call 988, then press 1 (24/7 support)

  #### Data and privacy concerns

  - Reassure about data handling and anonymization
  - Review consent form if questions arise
  - Stop recording immediately if requested

  {% if upstream_research_objectives %}
  ---

  <details>
  <summary><strong>Upstream context</strong></summary>

  *This guide was generated from the following approved research brief variables.
  These are provided for moderator reference — do not read aloud.*

  **Research objectives:**
  {{upstream_research_objectives}}

  {% if upstream_research_questions %}
  **Research questions:**
  {{upstream_research_questions}}
  {% endif %}

  {% if upstream_target_barriers %}
  **Target barriers:**
  {{upstream_target_barriers}}
  {% endif %}

  {% if upstream_participant_criteria %}
  **Participant criteria:**
  {{upstream_participant_criteria}}
  {% endif %}

  </details>
  {% endif %}

  ---

  <details>
  <summary><strong>Validity checklist</strong></summary>

  | Check | Result |
  |-------|--------|
  | Timing adds up to {{session_length}} minutes | |
  | Exactly {{task_count}} activity blocks generated | |
  | All script text in blockquotes | |
  | Every activity header has [RQ-XXX] markers | |
  | Coverage check has no gaps | |
  | Activity labels match methodology | |

  </details>

  ---

  <details>
  <summary><strong>Research provenance</strong></summary>

  {% if upstream_research_objectives %}
  | Brief commitment | Detail |
  |------------------|--------|
  | Research objectives | {{upstream_research_objectives_count}} objectives |
  | Research questions | {{upstream_research_questions_count}} questions |
  | Target barriers | {{upstream_target_barriers_count}} barriers |
  | Methodology | {{upstream_methodology_selection}} |

  **Upstream context**

  | Source | Used for |
  |--------|----------|
  | research_brief | Objectives, questions, method, barriers, participant criteria |

  Citation markers throughout:
  - [RQ-XXX] = research question this task addresses
  - [TB-XXX] = target barrier this task tests
  {% else %}
  No upstream cascade variables — guide generated from researcher inputs only.
  {% endif %}

  </details>

output_options:
  path: "02-plan/"
  filename: "{{selected_study}}--discussion-guide--{{__derivation_fp}}.md"

# ═══════════════════════════════════════════════════════════
# METADATA (documentation only — not read by backend)
# ═══════════════════════════════════════════════════════════
processing_workflow:
  1. validate_modal_inputs
  2. execute_descriptive_title_task
  3. execute_summary_task
  4. execute_guide_body_task
  5. render_output_template
  6. save_to_planning_folder

notes: |
  v7.1 Changes (True v7.0 Restructure):
  - Restructured from monolithic guide_complete → descriptive_title + summary + guide_body.
  - Handlebars output_template now renders: masthead, summary table, static sections
    (after-session debrief, emergency procedures), upstream context toggle, validity
    checklist (empty cells), and cascade provenance (collapsed <details>).
  - LLM bounded to guide_body: sections 01–05 + coverage check tables.
  - OUTPUT BOUNDARIES instruction added.
  - Metadata ruling applied: cascade summary → collapsed <details> "Research provenance".
  - Emergency procedures and debrief moved from LLM prompt to static Handlebars.
  - Upstream context moved from LLM-generated appendix to Handlebars <details> toggle
    with raw variable interpolation (no LLM reformatting needed).
  - Fixed typo: "tree_testinging" → "tree_testing" in session timing Jinja2 branch.

  v7.0 Changes (Cascade-Aware Retrofit):
  - Consumes upgraded: research_objectives, research_questions, methodology_selection
    now required with inject_as: commitment. Added participant_criteria (optional, context).
  - Emits upgraded: task_scenarios and probes now use $ref schemas.
  - All 7 method branches + fallback updated with cascade markers in headers.

  v6.2 Changes (Design Language Translation):
  - Translated locked design from docs/design-references/discussion_guide_reference.md
  - Pattern C: document-level footer only (backend buildTraceabilityFooter)
  - Consolidated 4 AI tasks → 1 comprehensive task with Jinja2 branching
  - Editorial numbering for sequential sections (## 01 through ## 05)
  - Script text in blockquotes (> lines) for read-aloud distinction
  - Methodology-aware activity labeling (Task/Topic/Concept/Observation/Activity)
  - 7 Jinja2 branches: usability_testing, user_interviews, card_sorting,
    concept_testing, contextual_inquiry, tree_testing, mixed_methods + fallback
  - task_count from modal controls number of main activity blocks
  - Confirm checklists in Introduction and Closing sections
  - After-session debrief section
  - Emergency procedures section
  - Footer removed from prompt (backend handles)
  - Filename: discussion-guide-{{selected_study}}-{{current_date_iso}}.md

  Follow-up (v6.3): Research plan integration — auto-ground warm-up and
  retrospective questions in research plan objectives when a plan exists.
  Pattern: modal checkbox "Pull objectives from research plan if available."
  Estimated effort: M.

  v6.1: Standards Polish (canonical structure, dead config removal)
  v6.0: Multi-task generation with method-specific Jinja2 branching

output_use: |
  Generate session guides for user research. Adapts structure based on
