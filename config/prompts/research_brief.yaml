# ═══════════════════════════════════════════════════════════
# IDENTITY
# ═══════════════════════════════════════════════════════════
id: research_brief
name: create_research_brief
label: "Research Brief"
version: "v7.1"

description: |
  Cascade-aware stakeholder approval document for research scope.
  Brief = approval gate. Plan = execution doc.
  v7.1: Validity checklist (empty cells), cascade summary collapsed per metadata ruling.
  v7.0: Interleaved Handlebars/AI architecture — computed values render
  mechanically, LLM only writes bounded prose sections. Handler assigns
  barrier/question IDs via pre-render JSON tasks (Option C).

author: Qori R&D
created: 2025-06-26
last_updated: 2026-08-04

# ═══════════════════════════════════════════════════════════
# CONFIGURATION
# ═══════════════════════════════════════════════════════════
input_type: structured
input_processing: direct

# ═══════════════════════════════════════════════════════════
# INPUTS
# ═══════════════════════════════════════════════════════════
input_variables:
  - selected_study:
      type: "select"
      required: true
  - lead_researcher:
      type: "text"
      required: true
  - requestor_name:
      type: "text"
      required: true
  - problem_statement:
      type: "textarea"
      required: true
  - learning_objectives:
      type: "textarea"
      required: true
  - out_of_scope:
      type: "textarea"
      required: true
  - methodology:
      type: "select"
      required: true
  - timeline_preference:
      type: "radio"
      required: true
  - start_date:
      type: "date"
      required: true
  - decision_deadline:
      type: "date"
      required: true
  - budget:
      type: "text"
      required: false

# ═══════════════════════════════════════════════════════════
# CASCADE CONTRACT
# ═══════════════════════════════════════════════════════════
# Brief uses MANUAL discovery loading via briefHandler.ts (not YAML consumes).
# Researcher selects which discovery artifacts to include via modal checkboxes.
# This is intentional — researcher controls which sources inform the brief.
#
# TARGET BARRIERS and RESEARCH QUESTIONS are generated by pre-render LLM
# tasks in the handler (Option C from delta document), then assigned
# stable IDs (TB-001, RQ-001) mechanically. They arrive as Handlebars-ready
# arrays, not as LLM prose.

emits:
  - key: research_objectives
    pool: false
    pool_strategy: replace
    schema:
      type: array
      items:
        $ref: schemas/research_objective.yaml
    extract_from: |
      What we'll learn section — each objective bullet. For EACH objective:
      - id: Format OBJ-001, OBJ-002, etc. (sequential)
      - objective: The learning goal text
      CRITICAL: Every objective MUST have a unique OBJ-XXX ID.
  - key: research_questions
    pool: false
    pool_strategy: replace
    schema:
      type: array
      items:
        $ref: schemas/research_question.yaml
    extract_from: "Research questions list — each with RQ-001, RQ-002 IDs, question text, and priority"
  - key: target_barriers
    pool: false
    pool_strategy: replace
    schema:
      type: array
      items:
        $ref: schemas/target_barrier.yaml
    extract_from: "Target barriers list — each with TB-001, TB-002 IDs, barrier text, and source"
  - key: methodology_selection
    pool: false
    pool_strategy: replace
    schema:
      type: string
    extract_from: "Method section — methodology value"
  - key: participant_criteria
    pool: false
    pool_strategy: replace
    schema:
      type: string
    extract_from: "Participants section"
  - key: out_of_scope
    pool: false
    pool_strategy: replace
    schema:
      type: array
      items:
        type: string
    extract_from: "Out of scope section — each bullet item"
  - key: business_context
    pool: false
    pool_strategy: replace
    schema:
      type: string
    extract_from: "Problem section — full narrative paragraphs"
  - key: timeline_preference
    pool: false
    pool_strategy: replace
    schema:
      type: string
    extract_from: "Timeline metadata"
  - key: start_date
    pool: false
    pool_strategy: replace
    schema:
      type: string
    extract_from: "Timeline section — start date"
  - key: decision_deadline
    pool: false
    pool_strategy: replace
    schema:
      type: string
    extract_from: "Timeline section — hard deadline"
  - key: budget
    pool: false
    pool_strategy: replace
    schema:
      type: string
    extract_from: "Summary metadata table — budget line"
  - key: participant_approach
    pool: false
    pool_strategy: replace
    schema:
      type: string
    extract_from: "Participants section — composition and count"
  - key: recruitment_sources
    pool: false
    pool_strategy: replace
    schema:
      type: string
    extract_from: "Participants section — Recruitment line"

# ═══════════════════════════════════════════════════════════
# AI GENERATION — focused, bounded tasks
# ═══════════════════════════════════════════════════════════
#
# NOTE: Target barriers and research questions are NOT generated here.
# They are pre-rendered by the handler via direct LLM calls (Option C)
# so the handler can assign stable IDs before these prose tasks run.
# The prose tasks receive the ID'd data as Handlebars context.

ai_generation_tasks:

  # Principled exception: slug humanization is genuinely generative, not factual
  # rendering. Study slugs like "va-mobile-nav-q3" need creative humanization.
  # This is NOT license to use LLM tasks for other computed values without scrutiny.
  - task_id: "descriptive_title"
    model: "claude-haiku-4-5-20251001"
    prompt: |
      Convert this study slug into a short, descriptive title:
      Study slug: {{selected_study}}
      Problem context: {{problem_statement}}
      Rules: Title case, 3-8 words. Describe the subject, not the method.
      Do not include "Research Brief". Output only the title.

  - task_id: "summary"
    prompt: |
      Write a 2-3 sentence summary for a research brief.

      Study: {{selected_study}}
      Problem: {{problem_statement}}
      Method: {{methodology}}
      Participants: {{participant_approach}}

      {% if upstream_discovered_barriers %}
      DISCOVERY CONTEXT: {{upstream_discovered_barriers}}
      {% endif %}

      The Summary is the elevator pitch for stakeholders deciding whether
      to fund this study. Open with what this study will DO (the research
      action and value), not with the problem (the Problem section
      covers that). Example opening: "This card sorting study with 8
      veterans will reveal..." NOT "The mobile app faces critical..."

      The summary describes what this study WILL DO during its execution.
      Downstream impacts (informs redesign, supports decision) should be
      framed as outcomes the study enables, not actions the study performs.
      Example: "This study will reveal X, informing the Y redesign"
      NOT "This study will reveal X to redesign Y"

      Output ONLY the summary paragraph. No heading, no preamble.
      Bold key metrics from discovery data if available.

      CITATION RULES: {% if citation_convention %}{{citation_convention}}
      Number citations sequentially within this section, starting at [D1], [S1], or [V1].
      Every claim from upstream gets a superscript: <sup>[D1]</sup>, <sup>[S2]</sup>, <sup>[V3]</sup>.
      {% else %}No discovery sources — do not use citation markers.{% endif %}

      Do NOT invent statistics, metrics, or numbers. Use ONLY data from the
      inputs provided. If no supporting data exists, state the claim without
      a metric.

      OUTPUT BOUNDARIES: Do not generate section headings, sub-headings,
      citation appendices, reference lists, horizontal rules, or markdown
      section dividers. The template handles all document structure.
      Output only the prose content for this section. Inline citation
      markers (e.g., [D1], [V2]) are required where data is referenced
      but should not be summarized in a separate block.

  - task_id: "problem_narrative"
    prompt: |
      Write 2-3 paragraphs framing the research problem for a stakeholder brief.

      Problem statement: {{problem_statement}}
      Method: {{methodology}}

      {% if upstream_discovered_barriers %}
      DESK RESEARCH:
      Barriers: {{upstream_discovered_barriers}}
      {% if upstream_discovered_metrics %}Metrics: {{upstream_discovered_metrics}}{% endif %}
      {% if upstream_discovered_journeys %}Journeys: {{upstream_discovered_journeys}}{% endif %}
      {% if upstream_knowledge_gaps %}Knowledge gaps: {{upstream_knowledge_gaps}}{% endif %}
      {% endif %}

      {% if upstream_stakeholder_constraints %}
      STAKEHOLDER SYNTHESIS:
      Constraints: {{upstream_stakeholder_constraints}}
      {% if upstream_stakeholder_priorities %}Priorities: {{upstream_stakeholder_priorities}}{% endif %}
      {% if upstream_alignment_gaps %}Alignment gaps: {{upstream_alignment_gaps}}{% endif %}
      {% endif %}

      {% if upstream_survey_themes %}
      SURVEY SYNTHESIS:
      Themes: {{upstream_survey_themes}}
      {% if upstream_survey_findings %}Findings: {{upstream_survey_findings}}{% endif %}
      {% endif %}

      Output ONLY the narrative paragraphs. No heading, no preamble.
      Enrich the researcher's problem framing with discovery evidence inline.
      Bold key metrics. Show contrast (what works vs what fails).

      CITATION RULES: {% if citation_convention %}{{citation_convention}}
      Number citations sequentially within this section, starting at [D1], [S1], or [V1].
      Every claim from upstream gets a superscript: <sup>[D1]</sup>, <sup>[S2]</sup>, <sup>[V3]</sup>.
      {% else %}No discovery sources — do not use citation markers.{% endif %}

      Do NOT invent statistics, metrics, or numbers. Use ONLY data from the
      inputs provided. If no supporting data exists, state the claim without
      a metric.

      OUTPUT BOUNDARIES: Do not generate section headings, sub-headings,
      citation appendices, reference lists, horizontal rules, or markdown
      section dividers. The template handles all document structure.
      Output only the prose content for this section. Inline citation
      markers (e.g., [D1], [V2]) are required where data is referenced
      but should not be summarized in a separate block.

  - task_id: "method_rationale"
    prompt: |
      Write a method section for a research brief covering three areas:

      Method: {{methodology}}
      Problem: {{problem_statement}}
      Learning objectives: {{learning_objectives}}

      {% if upstream_methodology_recommendations %}
      METHODOLOGY RECOMMENDATIONS FROM DISCOVERY: {{upstream_methodology_recommendations}}
      {% endif %}

      Cover these three areas as continuous prose (no sub-headings):

      1. APPROACH (1-2 sentences): Why {{methodology}} is the right method
         for this study. If methodology recommendations exist from discovery,
         explain WHY with "N discovery sources independently recommended..."
         and cite each source. Note what this method answers and what
         follow-up would address remaining gaps.

      2. SESSION FORMAT (1-2 sentences): Remote/in-person, session structure,
         accessibility accommodations, alternative formats if applicable.

      3. DATA COLLECTION (1-2 sentences): Specific methods: think-aloud,
         screen recording, observer notes, post-session interviews, etc.
         Be specific to the methodology.

      CITATION RULES: {% if citation_convention %}{{citation_convention}}
      Number citations sequentially within this section, starting at [D1], [S1], or [V1].
      {% else %}No discovery sources — do not use citation markers.{% endif %}

      Do NOT invent statistics, metrics, or numbers. Use ONLY data from the
      inputs provided.

      OUTPUT BOUNDARIES: Do not generate section headings, sub-headings,
      citation appendices, reference lists, horizontal rules, or markdown
      section dividers. The template handles all document structure.
      Output only the prose content for this section. Inline citation
      markers (e.g., [D1], [V2]) are required where data is referenced
      but should not be summarized in a separate block.

  - task_id: "participant_rationale"
    prompt: |
      Write the participant composition content for a research brief.

      Participant approach: {{participant_approach}}
      Methodology: {{methodology}}

      {% if upstream_discovered_barriers %}
      DISCOVERY BARRIERS (use to justify segments): {{upstream_discovered_barriers}}
      {% endif %}

      Output a markdown table: Segment | Count | Rationale
      Then a brief paragraph about demographic composition rationale.
      Justify segments with discovery evidence if available (e.g., AT users
      if accessibility barriers were found, older veterans if age patterns emerged).
      Do NOT mention recruitment sources — recruitment is rendered separately
      by the template.

      CITATION RULES: {% if citation_convention %}{{citation_convention}}
      Number citations sequentially within this section, starting at [D1], [S1], or [V1].
      {% else %}No discovery sources — do not use citation markers.{% endif %}

      Do NOT invent statistics, metrics, or numbers. Use ONLY data from the
      inputs provided.

      OUTPUT BOUNDARIES: Do not generate section headings, sub-headings,
      citation appendices, reference lists, horizontal rules, or markdown
      section dividers. The template handles all document structure.
      Output only the prose content for this section. Inline citation
      markers (e.g., [D1], [V2]) are required where data is referenced
      but should not be summarized in a separate block.

  - task_id: "out_of_scope_rationale"
    prompt: |
      Format the out-of-scope items as scope boundaries for a research brief.

      Researcher's out-of-scope items: {{out_of_scope}}

      Out of scope items describe what this study DELIBERATELY EXCLUDES
      from its scope and why. These are scope boundaries, not findings.

      Examples of correct out-of-scope items:
      - **Backend performance investigation** — Separate engineering workstream
      - **Feature redesign itself** — This study informs the redesign, doesn't perform it
      - **Generative concept exploration** — This study validates, not ideates

      Do NOT list discovery findings as out-of-scope. Things already known
      from discovery are inputs to this study, not boundaries around it.

      Output as a bullet list. Bold title for each item, then a brief
      rationale explaining why this is excluded from the study's scope.
      Derive items from the researcher's input above.

      Do NOT invent statistics, metrics, or numbers. Use ONLY data from the
      inputs provided.

      OUTPUT BOUNDARIES: Do not generate section headings, sub-headings,
      citation appendices, reference lists, horizontal rules, or markdown
      section dividers. The template handles all document structure.
      Output only the prose content for this section. Inline citation
      markers (e.g., [D1], [V2]) are required where data is referenced
      but should not be summarized in a separate block.

  - task_id: "risks"
    output_format: json
    prompt: |
      Generate 3-5 study-specific risks for this research brief as a JSON array.

      Study: {{selected_study}}
      Method: {{methodology}}
      Problem: {{problem_statement}}

      {% if upstream_stakeholder_constraints %}
      STAKEHOLDER CONSTRAINTS (use as risk sources): {{upstream_stakeholder_constraints}}
      {% endif %}

      Rules:
      1. Risks must be study-specific, NOT generic project management risks.
      2. If stakeholder constraints exist, use them as risk sources with role attribution.
      3. Include specific mitigation strategies.

      Output ONLY valid JSON. No prose, no code fences.
      Schema: [{"risk": "string", "source": "string", "mitigation": "string"}]

  - task_id: "approval_items"
    model: "claude-haiku-4-5-20251001"
    prompt: |
      Generate 4 approval checkboxes for research brief about {{selected_study}}:
      - [ ] Stakeholder approves scope and method
      - [ ] Stakeholder approves timeline and deadline
      - [ ] Budget confirmed
      - [ ] [fourth item specific to this study, e.g., recruitment criteria]
      Output only the checklist.

# ═══════════════════════════════════════════════════════════
# OUTPUT — interleaved Handlebars + AI prose
# ═══════════════════════════════════════════════════════════
output_template: |
  # Research Brief: {{ai_generated.descriptive_title}}

  **Study:** {{selected_study}} &nbsp; | &nbsp; **Researcher:** {{lead_researcher}} &nbsp; | &nbsp; **Requested by:** {{requestor_name}} &nbsp; | &nbsp; **Date:** {{display_date}} &nbsp; | &nbsp; **Status:** Pending approval

  ---

  ## Summary

  {{ai_generated.summary}}

  | | |
  |---|---|
  | **Method** | {{methodology}} |
  | **Participants** | {{participant_approach}} |
  | **Timeline** | {{timeline_display}} |
  | **Decision deadline** | {{decision_deadline}} |
  | **Budget** | {{#if budget}}{{budget}}{{else}}TBD{{/if}} |

  ---

  ## Problem

  {{ai_generated.problem_narrative}}

  **Target barriers for validation:**

  {{#each target_barriers}}
  - **[{{this.id}}]** {{this.barrier}} _({{this.source}})_
  {{/each}}

  ---

  ## What we'll learn

  {{#each research_objectives}}
  - **[{{this.id}}]** {{this.objective}}
  {{/each}}

  **Research questions:**

  {{#each research_questions}}
  - **[{{this.id}}]** {{this.question}} _({{this.priority}})_
  {{/each}}

  ---

  ## Method

  **Approach** — {{methodology}}

  {{ai_generated.method_rationale}}

  ---

  ## Participants

  {{ai_generated.participant_rationale}}

  {{#if recruitment_sources}}
  **Recruitment** — {{recruitment_sources}}
  {{/if}}

  ---

  ## Out of scope

  {{ai_generated.out_of_scope_rationale}}

  ---

  ## Risks

  | Risk | Source | Mitigation |
  |------|--------|------------|
  {{#each risks}}
  | {{this.risk}} | {{this.source}} | {{this.mitigation}} |
  {{/each}}

  ---

  ## Timeline

  | Phase | Dates |
  |-------|-------|
  {{#each timeline_phases}}
  | {{this.phase}} | {{this.dates}} |
  {{/each}}

  **Hard deadline:** {{decision_deadline}}

  ---

  ## Approval

  {{ai_generated.approval_items}}

  Once approved, the lead researcher will produce a detailed research plan covering session protocols, recruitment mechanics, and analysis approach.

  ---

  <details>
  <summary><strong>Validity checklist</strong></summary>

  | Check | Result |
  |-------|--------|
  | Problem statement grounds target barriers | |
  | Learning objectives map to research questions | |
  | Methodology fits the research questions | |
  | Participant approach addresses criteria | |
  | Discovery sources cited where used | |
  | Out of scope is explicit | |

  </details>

  ---

  <details>
  <summary><strong>Research provenance</strong></summary>

  This brief establishes the research scope for downstream templates.

  | Commitment | Count |
  |------------|-------|
  | Research objectives | {{objectives_count}} |
  | Research questions | {{research_questions_count}} |
  | Target barriers | {{target_barriers_count}} |
  | Methodology | {{methodology}} |
  | Budget | {{#if budget}}{{budget}}{{else}}N/A{{/if}} |

  {{#if discovery_sources}}
  **Discovery sources**

  This brief synthesized findings from {{discovery_count}} discovery sources. Citation markers are numbered per-section starting from 1. The prefix letter indicates source type.

  | Prefix | Source | Type | Date | Findings used |
  |--------|--------|------|------|---------------|
  {{discovery_sources}}

  Full discovery artifacts: see `_discovery/` in study repository.
  {{/if}}

  </details>

output_options:
  path: "01-brief/"
  filename: "{{selected_study}}--research-brief--{{__derivation_fp}}.md"

# ═══════════════════════════════════════════════════════════
# METADATA (documentation only — not read by backend)
# ═══════════════════════════════════════════════════════════
processing_workflow:
  1. handler_creates_study_and_loads_discovery
  2. handler_computes_mechanical_values_and_runs_structured_llm_tasks
  3. handler_assigns_ids_to_barriers_and_questions
  4. execute_focused_prose_ai_tasks
  5. parse_json_ai_outputs_risks
  6. render_interleaved_output_template
  7. save_to_planning_folder
  8. extract_cascade_variables_async

notes: |
  v7.0: Interleaved Handlebars/AI architecture (ADR 0005 conformance).
  - Output template is now the source of structure. Computed values
    (display date, timeline phases, timeline display label, methodology,
    budget, deadline, cascade counts) render mechanically via Handlebars.
    LLM only writes prose.
  - Single monolithic brief_body task replaced by 7 focused tasks:
    5 prose tasks + 1 structured JSON task (risks) + 1 creative task
    (descriptive_title — principled exception, slug humanization is
    genuinely generative, not factual rendering).
  - Target barriers and research questions are generated by pre-render
    LLM tasks in the handler (Option C from delta document), assigned
    stable IDs (TB-001, RQ-001) mechanically, and passed as Handlebars-
    ready arrays. The handler is the only source of these IDs.
  - display_date, timeline_display, timeline computed by handler using
    shared utils/timelineComputation.ts (also used by planHandler).
  - Anti-fabrication guard in every prose task: "Do NOT invent statistics,
    metrics, or numbers. Use ONLY data from the inputs provided."
  - Citation markers use per-section numbering: each prose task numbers
    citations sequentially within its own section, starting at [D1]/[S1]/[V1].
  - Cascade summary section added at bottom (preceded by double horizontal
    rule separator distinguishing body from meta-information).
  - Handler pre-renders 2 structured tasks (barriers, questions) via
    executeAiGenerationTasks directly, then passes complete data to
    processYamlTemplate for the remaining 7 tasks + rendering.

  v6.0: Single brief_body task architecture (superseded by v7.0).
  v5.0-v5.0.1: Pre-cascade version.

output_use: |
  Cascade-aware stakeholder approval document. Synthesizes upstream discovery
  variables (desk research, stakeholder interviews, surveys) into prose with
  citation markers. First document in study lifecycle. Researcher selects which
  discovery sources to include. Brief approved -> plan elaborates.
