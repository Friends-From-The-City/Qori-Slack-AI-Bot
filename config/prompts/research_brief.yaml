# ═══════════════════════════════════════════════════════════
# IDENTITY
# ═══════════════════════════════════════════════════════════
id: research_brief
name: create_research_brief
label: "Research Brief"
version: "v5.0.1"

description: |
  Stakeholder approval document for research scope.
  Brief = approval gate. Plan = execution doc.
  First document in a study — no prior inputs exist.

author: Qori R&D
created: 2025-06-26
last_updated: 2026-05-01

# ═══════════════════════════════════════════════════════════
# CONFIGURATION
# ═══════════════════════════════════════════════════════════
input_type: structured
input_processing: direct

# ═══════════════════════════════════════════════════════════
# INPUTS
# ═══════════════════════════════════════════════════════════
input_variables:
  - selected_study:
      type: "select"
      required: true
  - lead_researcher:
      type: "text"
      required: true
  - requestor_name:
      type: "text"
      required: true
  - problem_statement:
      type: "textarea"
      required: true
  - learning_objectives:
      type: "textarea"
      required: true
  - out_of_scope:
      type: "textarea"
      required: true
  - methodology:
      type: "select"
      required: true
  - method_rationale:
      type: "textarea"
      required: true
  - timeline_preference:
      type: "radio"
      required: true
  - start_date:
      type: "date"
      required: true
  - decision_deadline:
      type: "date"
      required: true
  - budget:
      type: "text"
      required: false

# ═══════════════════════════════════════════════════════════
# CASCADE CONTRACT
# ═══════════════════════════════════════════════════════════
consumes:
  - key: discovered_barriers
    source: desk_research
    required: false
    inject_as: context
    description: "Known barriers from prior research"
  - key: knowledge_gaps
    source: desk_research
    required: false
    inject_as: context
    description: "What desk research couldn't answer"
  - key: stakeholder_constraints
    source: stakeholder_synthesis
    required: false
    inject_as: context
    description: "Technical/policy/resource constraints from stakeholders"
  - key: stakeholder_priorities
    source: stakeholder_synthesis
    required: false
    inject_as: context
    description: "What stakeholders consider highest priority"
  - key: stakeholder_questions_for_users
    source: stakeholder_synthesis
    required: false
    inject_as: context
    description: "Questions stakeholders want answered by user research"

emits:
  - key: research_objectives
    pool: false
    pool_strategy: replace
    schema:
      type: array
      items:
        type: string
    extract_from: "What we'll learn section"
  - key: research_questions
    pool: false
    pool_strategy: replace
    schema:
      type: array
      items:
        type: string
    extract_from: "What we'll learn section (reframed as questions)"
  - key: target_barriers
    pool: false
    pool_strategy: replace
    schema:
      type: array
      items:
        type: string
    extract_from: "Problem section — barriers identified for testing"
  - key: methodology_selection
    pool: false
    pool_strategy: replace
    schema:
      type: string
    extract_from: "Method section — Approach line"
  - key: participant_criteria
    pool: false
    pool_strategy: replace
    schema:
      type: string
    extract_from: "Participants section"
  - key: out_of_scope
    pool: false
    pool_strategy: replace
    schema:
      type: array
      items:
        type: string
    extract_from: "Out of scope section"
  - key: business_context
    pool: false
    pool_strategy: replace
    schema:
      type: string
    extract_from: "Problem section — full paragraph"
  - key: timeline_preference
    pool: false
    pool_strategy: replace
    schema:
      type: string
    extract_from: "Timeline table or timeline metadata"
  - key: start_date
    pool: false
    pool_strategy: replace
    schema:
      type: string
    extract_from: "Timeline section — start date"
  - key: decision_deadline
    pool: false
    pool_strategy: replace
    schema:
      type: string
    extract_from: "Timeline section — decision deadline"
  - key: budget
    pool: false
    pool_strategy: replace
    schema:
      type: string
    extract_from: "Summary metadata table — budget line"
  - key: participant_approach
    pool: false
    pool_strategy: replace
    schema:
      type: string
    extract_from: "Participants section — composition and count"

# ═══════════════════════════════════════════════════════════
# AI GENERATION
# ═══════════════════════════════════════════════════════════
ai_generation_tasks:
  # GLOBAL FORMATTING RULE (applies to all tasks below):
  # Always use markdown dash (-) for bullets, never Unicode bullets (•).
  # Do not wrap text in quotes. Use display-friendly dates (Month DD, YYYY).

  # Descriptive title — human-readable study name for H1
  - task_id: "descriptive_title"
    prompt: |
      Convert this study slug into a short, descriptive title for a research brief:

      Study slug: {{selected_study}}
      Problem context: {{problem_statement}}

      Rules:
      - Title case, 3-8 words
      - Describe the research subject, not the method (e.g., "Navigation Redesign Usability Study" not "Usability Testing Study")
      - Do not include "Research Brief" — that's already in the H1 prefix
      - Output only the title, nothing else

  # Display date — human-readable date for masthead
  - task_id: "display_date"
    prompt: |
      Format this ISO date as a display-friendly date:

      Date: {{current_date_iso}}

      Format: Month DD, YYYY (e.g., "May 1, 2026")
      Output only the formatted date, nothing else.

  # Summary — narrative synthesis of the brief
  - task_id: "summary"
    prompt: |
      Write a 2-3 sentence summary of this research brief:

      Study: {{selected_study}}
      Problem: {{problem_statement}}
      What we'll learn: {{learning_objectives}}
      Method: {{methodology}}
      Participants: {{participant_approach}}
      Deadline: {{decision_deadline}}

      {% if upstream_discovered_barriers %}
      UPSTREAM CONTEXT (from discovery stream):
      Known barriers from desk research: {{upstream_discovered_barriers}}
      {% if upstream_stakeholder_constraints %}Stakeholder constraints: {{upstream_stakeholder_constraints}}{% endif %}
      {% if upstream_knowledge_gaps %}Knowledge gaps: {{upstream_knowledge_gaps}}{% endif %}

      Incorporate upstream context when it strengthens the summary — reference
      known barriers or stakeholder constraints that motivate this research.
      {% endif %}

      The summary should explain: what problem we're solving, what method we'll use,
      and what decision the findings will inform. Be specific and concise.
      Do not use quotes around text.

  # Formatted learning objectives — clean bullet list
  - task_id: "formatted_learning"
    prompt: |
      Format these learning objectives into a clean bulleted list:
      "{{learning_objectives}}"

      Rules:
      - Each objective should be a clear, specific question or goal
      - Start each with a verb or "Where/How/Which/What"
      - Keep to 4-6 bullets maximum
      - Preserve the researcher's original intent
      - Always use markdown dash (-) for bullets, never Unicode bullets (•)

      Output only the bulleted list, no preamble.

  # Formatted out of scope — clean bullet list
  - task_id: "formatted_out_of_scope"
    prompt: |
      Format these out-of-scope items into a clean bulleted list:
      "{{out_of_scope}}"

      Rules:
      - Each item should be concise (one line)
      - Keep to 3-5 bullets maximum
      - Preserve the researcher's original boundaries
      - Always use markdown dash (-) for bullets, never Unicode bullets (•)

      Output only the bulleted list, no preamble.

  # Timeline — calculate dates from start_date + preference
  - task_id: "timeline"
    prompt: |
      Create a timeline table for {{timeline_preference}} research starting {{start_date}}.

      CRITICAL: Output EXACTLY 2 columns per row. No more, no less.
      The 2 columns are: Phase | Dates
      The Dates column combines start AND end into ONE cell: "May 18 – May 25, 2026"

      Phase durations for {{timeline_preference}}:
      - standard: Planning 10d, Fieldwork 7d, Analysis 7d, Findings 4d
      - accelerated: Planning 4d, Fieldwork 4d, Analysis 4d, Findings 2d
      - extended: Planning 14d, Fieldwork 14d, Analysis 14d, Findings 7d

      Rules:
      - Start from {{start_date}}. Each phase starts the day after the previous ends.
      - Do NOT output a header row — only the 4 data rows.
      - No blank lines between rows.

      YOUR OUTPUT MUST LOOK EXACTLY LIKE THIS (but with dates calculated from {{start_date}}):
      | Planning and recruitment | May 4 – May 17, 2026 |
      | Fieldwork | May 18 – May 24, 2026 |
      | Analysis | May 25 – June 2, 2026 |
      | Findings presentation | June 3 – June 5, 2026 |

  # Timeline display — format timeline preference for summary table
  - task_id: "timeline_display"
    prompt: |
      Format this timeline preference as a display-friendly string:

      Preference: {{timeline_preference}}

      Rules:
      - "standard" → "6 weeks"
      - "accelerated" → "2 weeks"
      - "extended" → "8 weeks"

      Output ONLY the formatted string, nothing else.

  # Risks — generate 2 study-specific risks
  - task_id: "risks"
    prompt: |
      Identify 2 risks for {{methodology}} research on {{selected_study}}:

      Problem context: {{problem_statement}}
      Timeline: {{timeline_preference}}
      Deadline: {{decision_deadline}}

      Format as table rows ONLY (no header):
      | [Risk description] | [Specific mitigation] |
      | [Risk description] | [Specific mitigation] |

      Risks should be specific to this study — not generic project management.
      Consider: recruitment difficulty, technical setup for {{methodology}},
      timeline constraints, stakeholder feedback delays.

      CRITICAL: Output rows with NO blank lines between them.

# ═══════════════════════════════════════════════════════════
# OUTPUT
# ═══════════════════════════════════════════════════════════
output_template: |
  # Research Brief: {{ai_generated.descriptive_title}}

  **Study:** {{selected_study}} &nbsp; | &nbsp; **Researcher:** {{lead_researcher}} &nbsp; | &nbsp; **Requested by:** {{requestor_name}} &nbsp; | &nbsp; **Date:** {{ai_generated.display_date}} &nbsp; | &nbsp; **Status:** Pending approval

  ---

  ## Summary

  {{ai_generated.summary}}

  | | |
  |---|---|
  | **Method** | {{methodology}} |
  | **Participants** | {{participant_approach}} |
  | **Timeline** | {{ai_generated.timeline_display}} |
  | **Decision deadline** | {{decision_deadline}} |
  {{#if budget}}| **Budget** | {{budget}} |{{/if}}

  ---

  ## Problem

  {{problem_statement}}

  ---

  ## What we'll learn

  {{ai_generated.formatted_learning}}

  ---

  ## Method

  **Approach** — {{methodology}}

  ---

  ## Participants

  {{participant_approach}}

  ---

  ## Timeline

  | Phase | Dates |
  |-------|-------|
  {{ai_generated.timeline}}

  **Hard deadline:** {{decision_deadline}}

  ---

  ## Out of scope

  {{ai_generated.formatted_out_of_scope}}

  ---

  ## Risks

  | Risk | Mitigation |
  |------|------------|
  {{ai_generated.risks}}

  ---

  ## Approval

  - [ ] Stakeholder approves scope and method
  - [ ] Stakeholder approves timeline and deadline
  - [ ] Budget confirmed
  - [ ] Recruitment criteria validated

  Once approved, the lead researcher will produce a detailed research plan covering session protocols, recruitment, and analysis approach.

output_options:
  path: "01-planning/"
  filename: "{{selected_study}}-research-brief-{{current_date_iso}}.md"

# ═══════════════════════════════════════════════════════════
# METADATA (documentation only — not read by backend)
# ═══════════════════════════════════════════════════════════
processing_workflow:
  1. validate_modal_inputs
  2. execute_ai_tasks
  3. render_output_template
  4. save_to_planning_folder

notify:
  - role: team
    action: "Research brief generated"
    channel: "{{study_channel}}"
    message: "Research brief for {{selected_study}} is ready for stakeholder approval."

notes: |
  v5.0 Changes (Design Language Translation):
  - Translated locked design from docs/design-references/research_brief_reference.md
  - Brief = approval gate. Plan = execution doc. Brief approved → plan elaborates.
  - Pattern C: document-level footer only (backend buildTraceabilityFooter)
  - Exception: Approval section included (brief IS the approval gate)
  - Modal simplified: 15 fields → 7 + study selector
  - Removed: hypotheses, success_criteria, expected_outcomes, next_steps,
    user_journeys, target_barriers, team_table, participant_criteria (all
    belong in research plan)
  - Added: study selector (fixes Scenario A bug), out_of_scope, timeline
    presets (standard/accelerated/extended), decision_deadline
  - AI tasks: 8 → 5 (summary, formatted_learning, formatted_out_of_scope,
    timeline, risks)
  - Handler: removed isFromRequest branching, added Slack profile lookup,
    methodology label mapping
  - Filename: {{selected_study}}-research-brief-{{current_date_iso}}.md

  v4.2: Pre-translation version

output_use: |
  Stakeholder approval document for research scope. First document in a study
  lifecycle — no prior inputs exist. Brief approved → plan elaborates.
  Pattern C treatment with Approval section exception.
