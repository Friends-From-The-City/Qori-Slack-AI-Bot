# ═══════════════════════════════════════════════════════════
# IDENTITY
# ═══════════════════════════════════════════════════════════
id: research_brief
name: create_research_brief
label: "Research Brief"
version: "v6.0"

description: |
  Cascade-aware stakeholder approval document for research scope.
  Brief = approval gate. Plan = execution doc.
  Synthesizes upstream discovery variables into prose with citation markers.

author: Qori R&D
created: 2025-06-26
last_updated: 2026-05-03

# ═══════════════════════════════════════════════════════════
# CONFIGURATION
# ═══════════════════════════════════════════════════════════
input_type: structured
input_processing: direct

# ═══════════════════════════════════════════════════════════
# INPUTS
# ═══════════════════════════════════════════════════════════
input_variables:
  - selected_study:
      type: "select"
      required: true
  - lead_researcher:
      type: "text"
      required: true
  - requestor_name:
      type: "text"
      required: true
  - problem_statement:
      type: "textarea"
      required: true
  - learning_objectives:
      type: "textarea"
      required: true
  - out_of_scope:
      type: "textarea"
      required: true
  - methodology:
      type: "select"
      required: true
  - timeline_preference:
      type: "radio"
      required: true
  - start_date:
      type: "date"
      required: true
  - decision_deadline:
      type: "date"
      required: true
  - budget:
      type: "text"
      required: false

# ═══════════════════════════════════════════════════════════
# CASCADE CONTRACT
# ═══════════════════════════════════════════════════════════
# Brief uses MANUAL discovery loading via briefHandler.js (not YAML consumes).
# Researcher selects which discovery artifacts to include via modal checkboxes.
# This is intentional — researcher controls which sources inform the brief.
#
# Deviation from spec: 05-cc-instruction.md assumed YAML consumes. Manual loading
# is better for briefs because researcher-driven selection enables cherry-picking
# discovery sources per study, rather than consuming everything automatically.
#
# Available upstream variables when discovery selected:
#   DESK RESEARCH: upstream_discovered_barriers, upstream_discovered_metrics,
#     upstream_discovered_journeys, upstream_methodology_recommendations,
#     upstream_knowledge_gaps, upstream_source_artifacts
#   STAKEHOLDER: upstream_stakeholder_constraints, upstream_stakeholder_priorities,
#     upstream_alignment_gaps, upstream_stakeholder_questions_for_users,
#     upstream_backstage_observations, upstream_system_failure_modes
#   SURVEY: upstream_survey_themes, upstream_survey_findings,
#     upstream_survey_recommendations, upstream_discovered_barriers (merged),
#     upstream_discovered_metrics (merged), upstream_sample_demographics
#   METADATA: discovery_count, discovery_sources, citation_convention

emits:
  - key: research_objectives
    pool: false
    pool_strategy: replace
    schema:
      type: array
      items:
        type: string
    extract_from: "What we'll learn section"
  - key: research_questions
    pool: false
    pool_strategy: replace
    schema:
      type: array
      items:
        $ref: schemas/research_question.yaml
    extract_from: "What we'll learn section (reframed as questions) — each with RQ-001, RQ-002 IDs"
  - key: target_barriers
    pool: false
    pool_strategy: replace
    schema:
      type: array
      items:
        $ref: schemas/target_barrier.yaml
    extract_from: "Problem section — barriers identified for testing, each with TB-001, TB-002 IDs"
  - key: methodology_selection
    pool: false
    pool_strategy: replace
    schema:
      type: string
    extract_from: "Method section — Approach line"
  - key: participant_criteria
    pool: false
    pool_strategy: replace
    schema:
      type: string
    extract_from: "Participants section"
  - key: out_of_scope
    pool: false
    pool_strategy: replace
    schema:
      type: array
      items:
        type: string
    extract_from: "Out of scope section"
  - key: business_context
    pool: false
    pool_strategy: replace
    schema:
      type: string
    extract_from: "Problem section — full paragraph"
  - key: timeline_preference
    pool: false
    pool_strategy: replace
    schema:
      type: string
    extract_from: "Timeline metadata"
  - key: start_date
    pool: false
    pool_strategy: replace
    schema:
      type: string
    extract_from: "Timeline section — start date"
  - key: decision_deadline
    pool: false
    pool_strategy: replace
    schema:
      type: string
    extract_from: "Timeline section — decision deadline"
  - key: budget
    pool: false
    pool_strategy: replace
    schema:
      type: string
    extract_from: "Summary metadata table — budget line"
  - key: participant_approach
    pool: false
    pool_strategy: replace
    schema:
      type: string
    extract_from: "Participants section — composition and count"

# ═══════════════════════════════════════════════════════════
# AI GENERATION
# ═══════════════════════════════════════════════════════════
ai_generation_tasks:

  - task_id: "descriptive_title"
    prompt: |
      Convert this study slug into a short, descriptive title:
      Study slug: {{selected_study}}
      Problem context: {{problem_statement}}
      Rules: Title case, 3-8 words. Describe the subject, not the method.
      Do not include "Research Brief". Output only the title.

  - task_id: "display_date"
    prompt: |
      Format as Month DD, YYYY: {{current_date_iso}}
      Output only the formatted date.

  - task_id: "timeline_display"
    prompt: |
      Format: {{timeline_preference}}
      "standard" -> "6 weeks", "accelerated" -> "4 weeks", "extended" -> "8 weeks"
      Output only the string.

  - task_id: "timeline"
    prompt: |
      Create a timeline table for {{timeline_preference}} research starting {{start_date}}.
      Output EXACTLY 2 columns: Phase | Dates (range in one cell).
      Durations for standard: Planning 10d, Fieldwork 14d, Analysis 9d, Findings 7d.
      For accelerated: Planning 4d, Fieldwork 4d, Analysis 4d, Findings 2d.
      For extended: Planning 14d, Fieldwork 14d, Analysis 14d, Findings 7d.
      Start from {{start_date}}. Each phase starts day after previous ends.
      No header row. No blank lines. Example:
      | Planning and recruitment | May 4 - May 13, 2026 |

  - task_id: "brief_body"
    prompt: |
      You are generating the body of a cascade-aware research brief.

      {% if upstream_discovered_barriers %}
      ============================================================
      CASCADE-AWARE GENERATION
      ============================================================

      You have upstream discovery variables. SYNTHESIZE them into prose.
      Do NOT list or dump variables. Weave them into each section naturally.

      CITATION MARKERS: {{citation_convention}}
      - Every claim from upstream gets a superscript: <sup>[D1]</sup>, <sup>[S2]</sup>, <sup>[V3]</sup>
      - D = Desk research, S = Stakeholder synthesis, V = Survey (Voice of customer)
      - Number in order of first appearance across entire document
      - Multiple sources for one claim: <sup>[D2, V4]</sup>
      - Use ONLY metrics from upstream. Do NOT invent statistics.
      - Verbatim quotes sharpen prose: "quote" <sup>[marker]</sup>
      - If a section has no upstream support, write from researcher input without markers

      DESK RESEARCH:
      Barriers: {{upstream_discovered_barriers}}
      {% if upstream_discovered_metrics %}Metrics: {{upstream_discovered_metrics}}{% endif %}
      {% if upstream_discovered_journeys %}Journeys: {{upstream_discovered_journeys}}{% endif %}
      {% if upstream_methodology_recommendations %}Method recommendations: {{upstream_methodology_recommendations}}{% endif %}
      {% if upstream_knowledge_gaps %}Knowledge gaps: {{upstream_knowledge_gaps}}{% endif %}

      STAKEHOLDER SYNTHESIS:
      {% if upstream_stakeholder_constraints %}Constraints: {{upstream_stakeholder_constraints}}{% endif %}
      {% if upstream_stakeholder_priorities %}Priorities: {{upstream_stakeholder_priorities}}{% endif %}
      {% if upstream_alignment_gaps %}Alignment gaps: {{upstream_alignment_gaps}}{% endif %}
      {% if upstream_stakeholder_questions_for_users %}Questions for users: {{upstream_stakeholder_questions_for_users}}{% endif %}

      SURVEY SYNTHESIS:
      {% if upstream_survey_themes %}Themes: {{upstream_survey_themes}}{% endif %}
      {% if upstream_survey_findings %}Findings: {{upstream_survey_findings}}{% endif %}
      {% if upstream_survey_recommendations %}Recommendations: {{upstream_survey_recommendations}}{% endif %}
      {% endif %}

      ============================================================
      RESEARCHER INPUT
      ============================================================

      Study: {{selected_study}}
      Problem: {{problem_statement}}
      Learning objectives: {{learning_objectives}}
      Method: {{methodology}}
      Participants: {{participant_approach}}
      Out of scope: {{out_of_scope}}
      Decision deadline: {{decision_deadline}}
      Budget: {{budget}}

      ============================================================
      GENERATE THESE SECTIONS
      ============================================================

      Output ALL sections below as continuous markdown. Do NOT stop early.

      ## Summary

      2-3 sentences weaving discovery metrics with researcher input as ONE voice.
      Include what problem, what method, what decision this enables. Bold key metrics.
      Citation markers on every upstream claim.

      Then output a metadata table (no header):
      | | |
      |---|---|
      | **Method** | {{methodology}} - recommended by N discovery sources |
      | **Participants** | [count and key segments from participant_approach] |
      | **Timeline** | [from timeline_preference] |
      | **Decision deadline** | {{decision_deadline}} |
      | **Budget** | {{budget}} |

      ## Problem

      2-3 paragraphs. Researcher's framing enriched with discovery evidence inline.
      Bold key metrics. Show contrast (what works vs what fails). Include stakeholder
      diagnosis of root cause. Citation markers on every upstream number.

      After the narrative, list target barriers with stable IDs:

      **Target barriers for validation:**
      - **TB-001:** [barrier statement — e.g., "73% of veterans report abandoning tasks..."]
      - **TB-002:** [barrier statement]
      - **TB-003:** [barrier statement]
      [continue for each barrier identified from discovery + researcher input]

      These IDs are stable references used by downstream templates (session_summary,
      affinity_mapping). Number sequentially from TB-001.

      ## What we'll learn

      {% if upstream_stakeholder_questions_for_users %}
      Use stakeholder questions as research questions (they come pre-prioritized
      Blocking/Important/Validation). Frame each with context from discovery.
      Structure: blocking questions first, then important, note which are non-blocking.
      {% else %}
      Format researcher's learning objectives as research questions.
      {% endif %}

      Each question MUST have a stable ID:
      - **RQ-001:** [question text] _(Primary)_
      - **RQ-002:** [question text] _(Primary)_
      - **RQ-003:** [question text] _(Secondary)_
      [continue for each question]

      These IDs are stable references used by downstream templates. Number
      sequentially from RQ-001. Mark priority: Primary, Secondary, or Exploratory.

      ## Method

      State method. If methodology_recommendations exist, explain WHY with
      "N discovery sources independently recommended..." and cite each source.
      Note what this method answers and what follow-up would address remaining gaps.

      ## Participants

      Table format: Segment | Count | Rationale
      Justify segments with discovery evidence (AT users if accessibility barriers found,
      older veterans if age patterns). Add Demographics section with recruitment sources.

      ## Out of scope

      Bold title for each item. For discovery-established items:
      "**Whether navigation is broken** -- Already demonstrated by 45% abandonment <sup>[D2, V2]</sup>"
      Researcher items included as-is.

      ## Risks

      Table format: Risk | Source | Mitigation (3 columns)
      Bold risk title. Use stakeholder constraints as risk sources with role attribution.
      3-5 rows. Include specific mitigation strategies.

      CRITICAL: Output ALL 7 sections. Do not truncate.

  - task_id: "approval_items"
    prompt: |
      Generate 4 approval checkboxes for research brief about {{selected_study}}:
      - [ ] Stakeholder approves scope and method
      - [ ] Stakeholder approves timeline and deadline
      - [ ] Budget confirmed
      - [ ] [fourth item specific to this study, e.g., recruitment criteria]
      Output only the checklist.

# ═══════════════════════════════════════════════════════════
# OUTPUT
# ═══════════════════════════════════════════════════════════
output_template: |
  # Research Brief: {{ai_generated.descriptive_title}}

  **Study:** {{selected_study}} &nbsp; | &nbsp; **Researcher:** {{lead_researcher}} &nbsp; | &nbsp; **Requested by:** {{requestor_name}} &nbsp; | &nbsp; **Date:** {{ai_generated.display_date}} &nbsp; | &nbsp; **Status:** Pending approval

  ---

  {{ai_generated.brief_body}}

  ---

  ## Timeline

  | Phase | Dates |
  |-------|-------|
  {{ai_generated.timeline}}

  **Hard deadline:** {{decision_deadline}}

  ---

  ## Approval

  {{ai_generated.approval_items}}

  Once approved, the lead researcher will produce a detailed research plan covering session protocols, recruitment mechanics, and analysis approach.

  {{#if discovery_sources}}
  ---

  ## Discovery sources

  This brief synthesized findings from {{discovery_count}} discovery sources. Citation markers throughout the document trace each claim to its source.

  | Marker | Source | Type | Date | Findings used |
  |--------|--------|------|------|---------------|
  {{discovery_sources}}

  Full discovery artifacts: see `_discovery/` in study repository.
  {{/if}}

output_options:
  path: "01-planning/"
  filename: "{{selected_study}}-research-brief-{{current_date_iso}}.md"

# ═══════════════════════════════════════════════════════════
# METADATA (documentation only -- not read by backend)
# ═══════════════════════════════════════════════════════════
processing_workflow:
  1. validate_modal_inputs
  2. execute_ai_tasks
  3. render_output_template
  4. save_to_planning_folder

notify:
  - role: team
    action: "Research brief generated"
    channel: "{{study_channel}}"
    message: "Research brief for {{selected_study}} is ready for stakeholder approval."

notes: |
  v6.0 Changes (Cascade-Aware Brief):
  - CASCADE-AWARE GENERATION: single brief_body task generates all 7 body sections
    with citation markers [D1-D7], [S1-S7], [V1-V7] woven through prose
  - Discovery sources appendix at bottom maps markers to source artifacts
  - Modal pre-populates cascade-driven fields with sparkle markers
  - Auto-selects all discovery checkboxes (researcher unchecks to exclude)
  - Manual discovery loading via briefHandler.js (not YAML consumes) -- researcher
    controls which discovery sources inform the brief
  - Deep schema extraction: barriers with id/title/evidence/confidence, constraints
    with source_role/verbatim_quote/broader_pattern/implications, survey themes
    with frequency/sentiment/verbatim_quotes
  - AI tasks reduced: 9 tasks -> 5 (descriptive_title, display_date, timeline_display,
    timeline, brief_body + approval_items). brief_body generates all prose sections
    in one pass for citation marker consistency across document
  - Version bump: v5.0.1 -> v6.0 per cascade-aware pattern adoption (Section 8)

  v5.0.1: Pre-cascade version (brief output polish, discovery section)
  v5.0: Design language translation
  v4.2: Pre-translation version

output_use: |
  Cascade-aware stakeholder approval document. Synthesizes upstream discovery
  variables (desk research, stakeholder interviews, surveys) into prose with
  citation markers. First document in study lifecycle. Researcher selects which
  discovery sources to include. Brief approved -> plan elaborates.
